name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
# Never run two deploys at once; the newest push wins.
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    # Off until the server key, DNS and Caddy are set up (repo variable DEPLOY_ENABLED=true).
    if: vars.DEPLOY_ENABLED == 'true'
    # GitHub-hosted minutes are unavailable (billing), so deploy runs on the team laptop runner too.
    runs-on: [self-hosted, laptop]
    steps:
      - name: Deploy to musicroombot
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        # Self-hosted: never touch the laptop's own ~/.ssh. The key and known_hosts live in a
        # temp dir for this job only and are removed even if the deploy fails.
        run: |
          dir="$(mktemp -d "$RUNNER_TEMP/deploy-ssh.XXXXXX")"
          trap 'rm -rf "$dir"' EXIT
          umask 077
          printf '%s\n' "$SSH_KEY" > "$dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$dir/known_hosts"
          # The server key is restricted to deploy/deploy.sh; the command here is ignored.
          ssh -F /dev/null -i "$dir/key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$dir/known_hosts" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes denis@46.62.161.228 deploy
      - name: Smoke test
        run: curl -fsS -o /dev/null https://parenting.unsoundmint.com/ && curl -fsS -o /dev/null https://parenting.unsoundmint.com/api/healthz
