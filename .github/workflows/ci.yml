name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    # GitHub-hosted minutes are unavailable (billing), so CI runs on the team laptop runner.
    # Postgres is the podman container parenting-dev-pg there; each run gets a throwaway database.
    runs-on: [self-hosted, laptop]
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Applied migrations are unchanged
        if: github.event_name == 'pull_request'
        working-directory: .
        run: scripts/check-migrations.sh origin/${{ github.base_ref }}
      - name: Throwaway test database
        run: |
          podman start parenting-dev-pg >/dev/null
          for i in $(seq 30); do podman exec parenting-dev-pg pg_isready -U parenting -q && break; sleep 1; done
          podman exec parenting-dev-pg dropdb -U parenting --if-exists ci_${{ github.run_id }}_${{ github.run_attempt }}
          podman exec parenting-dev-pg createdb -U parenting ci_${{ github.run_id }}_${{ github.run_attempt }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Generated code is up to date
        run: |
          go generate ./...
          go tool sqlc generate
          git diff --exit-code -- . || (echo "::error::Run 'make gen' and commit the result" && exit 1)
      - name: Go code is formatted
        run: test -z "$(gofmt -l .)" || (gofmt -l . && echo "::error::Run 'gofmt -w .' in api/" && exit 1)
      - run: go vet ./...
      - run: go test ./...
        env:
          TEST_DATABASE_URL: postgres://parenting:parenting@localhost:5433/ci_${{ github.run_id }}_${{ github.run_attempt }}?sslmode=disable
      - name: Drop the test database
        if: always()
        run: podman exec parenting-dev-pg dropdb -U parenting --if-exists ci_${{ github.run_id }}_${{ github.run_attempt }}

  web:
    runs-on: [self-hosted, laptop]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API client is up to date
        run: |
          pnpm gen:api
          git diff --exit-code -- src/lib/api || (echo "::error::Run 'make gen' and commit the result" && exit 1)
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
