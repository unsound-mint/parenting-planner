  /members/{memberId}/vaccine-doses/{doseId}:
    parameters:
      - $ref: "#/components/parameters/MemberId"
      - name: doseId
        in: path
        required: true
        description: A VaccineDose id from getPassport.
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateVaccineDose
      tags: [passport]
      summary: Record that a vaccine dose was given
      description: |
        Mother and partner; a grandparent or nanny gets 404. A parent records
        their own doses and the child's; a dose of the other parent is 404.
        givenOn in the future is 400. Sets the dose to done, and the plan
        (getPlan, Today, journey) recomputes from it on the next read: the
        rule that asked for this vaccine moves to settled. Sending a new
        givenOn corrects the date. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaccineDoseUpdate"
      responses:
