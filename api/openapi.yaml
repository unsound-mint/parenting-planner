openapi: 3.0.3
info:
  title: Parenting Planner API
  version: 0.1.0
  description: |
    Contract between web/ and api/. Both sides generate code from this file
    (`make gen`); never edit generated code by hand. Change this file first,
    in its own PR or together with both implementations.

    Auth: there is no login. POST /demo/sessions creates a demo family and
    sets an httpOnly session cookie that scopes every other call to that family.
servers:
  - url: /api
security:
  - session: []
tags:
  - name: demo
  - name: family
  - name: plan
  - name: wellbeing
  - name: directory
  - name: passport
  - name: care
  - name: invitations
  - name: content
  - name: today
  - name: tasks
  - name: calendar
  - name: simulator
  - name: shifts
  - name: carelog
  - name: live
  - name: billing
  - name: notifications
  - name: leave
  - name: insurance
  - name: screening
  - name: offers
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthz
      security: []
      responses:
        "200":
          description: The API and its database are up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /demo/sessions:
    post:
      operationId: createDemoSession
      tags: [demo]
      security: []
      summary: Start a demo with a fresh copy of a synthetic family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDemoSessionRequest"
      responses:
        "201":
          description: Family created; the session cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /demo/custom-sessions:
    post:
      operationId: createCustomSession
      tags: [demo]
      security: []
      summary: Start with a new family built from the visitor's own details
      description: |
        "Try it with your own details": creates a new family for this visitor
        from what they typed, through the same seed and rules path as the demo
        families, and sets the same session cookie as createDemoSession. The
        family's template is `custom`. No auth; nothing is stored beyond the
        typed fields, and each call makes a separate family.

        Dates are checked against the stage (400 `bad_details` otherwise):
        - pregnancy: dueDate is required, from 14 days ago to 280 days ahead.
        - postpartum, infant, toddler, preschool, school_age: childBirthDate is
          required, not in the future, and the child's age must fit the stage:
          postpartum under 3 months, infant 3 to 11 months, toddler 12 to 35
          months, preschool 36 to 59 months, school_age 60 months to 9 years.
        - planning, trying: no dates.
        A date that does not belong to the stage is ignored and not stored, and
        childName is ignored before birth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomFamilyInput"
      responses:
        "201":
          description: Family created; the session cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family:
    get:
      operationId: getFamily
      tags: [family]
      summary: The family of the current session, with parents, caregivers and children
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family/demo-time-skips:
    post:
      operationId: createDemoTimeSkip
      tags: [demo]
      summary: Skip the session's family ahead one week (demo time)
      description: |
        Moves this family's demo clock forward 7 days. From then on every date
        the API computes for the family (plan, due items, gestational week,
        timeline) uses the shifted day, from the same stored data. Only this
        family moves; other demo families keep the real date. Starting a new
        demo creates a new family at real time, which is the reset. The UI
        must label the shifted date as demo time.
      responses:
        "200":
          description: The family as of its new demo date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family/upgrade-intents:
    post:
      operationId: createUpgradeIntent
      tags: [family]
      summary: Record that the family wants a paid plan
      description: |
        There are no payments. This stores which tier the family asked for and
        when; it shows as "upgrade requested" on the family. Either parent of the
        session's family may send it. A second request replaces the first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeIntentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeIntent"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/plan:
    get:
      operationId: getMemberPlan
      tags: [plan]
      summary: This week's plan for one parent
      description: |
        Items come from the guideline rules engine, evaluated against the family
        data this parent is allowed to see. Each item says why it applies and
        cites its source.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/weekly-plan:
    get:
      operationId: getMemberWeeklyPlan
      tags: [plan]
      summary: A short written plan for this parent's week
      description: |
        A note written for the acting parent from the data they may see: their
        due plan items, their own recent mood and sleep, diary topics the
        partner shared with them, and the family's stage. The other parent
        gets a different plan. Private records (diary, mood, labs, session
        notes) that were not shared with this parent never feed it. The text
        never diagnoses. Urgent symptoms and self-harm mentions are not
        written here; they go to the fixed urgent-help screen. When the AI
        call fails, fallback is true and the sections are built from the rule
        plan.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyPlan"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/journey:
    get:
      operationId: getMemberJourney
      tags: [journey]
      summary: The family's path from planning to age 9, where they are now and what comes next
      description: |
        Every stage from planning to age 9 in order, each marked past, current
        or future, with its dates when the family's due date or child's birth
        date fixes them. `current` is the "you are here" marker, computed from
        the family's stage, due date and youngest child's birth date. The
        upcoming items are the first few items of this parent's plan from the
        rules engine (the same items and order as getMemberPlan), so the two
        parents can see different items.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journey"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/passport:
    get:
      operationId: getPassport
      tags: [passport]
      summary: The health passport of the family as the acting parent may see it
      description: |
        One entry per person: the acting parent, the other parent and the
        child (when there is one). The acting parent sees all of their own
        records and everything recorded for the child. For the other parent
        only records shared with the acting parent come back (visibility
        partner or family, the rule in access.CanParentRead); private and
        care_team records are left out, and their count is not revealed.
        Reading labs and allergies is audited like any sensitive read.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passport"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/plan/{ruleId}/status:
    put:
      operationId: setPlanItemProgress
      tags: [plan]
      summary: The acting parent marks a plan item as booked or done
      description: |
        Records progress on one plan item for this parent. A booked or done item
        stays on the plan, shown as settled, so nothing disappears unseen.
      parameters:
        - $ref: "#/components/parameters/MemberId"
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
          example: glucose-screen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanItemProgressInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanItem"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/mood-checkins:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    post:
      operationId: createMoodCheckin
      tags: [wellbeing]
      summary: The acting parent records how they feel today
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoodCheckinInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoodCheckin"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listMoodCheckins
      tags: [wellbeing]
      summary: Check-ins from the last 30 days that the acting parent may see
      description: Their own check-ins plus the other parent's check-ins shared with them.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoodCheckinList"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /providers:
    get:
      operationId: listProviders
      tags: [directory]
      summary: Providers in the ecosystem directory, optionally filtered
      description: |
        Every provider is synthetic demo data. The directory is the same for
        every family and holds no personal records, so any parent in the session
        may read it. Sorted by next available date, soonest first.
      parameters:
        - name: type
          in: query
          required: false
          description: Only providers of this type.
          schema:
            $ref: "#/components/schemas/ProviderType"
        - name: state
          in: query
          required: false
          description: Only providers licensed in this US state (two-letter code).
          schema:
            $ref: "#/components/schemas/UsState"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderList"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/booking-requests:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    post:
      operationId: createBookingRequest
      tags: [directory]
      summary: The acting parent asks a provider for an appointment
      description: |
        Saves a request with status requested; nothing is sent to a real
        provider. A request is sensitive: it can reveal that a parent is seeking
        care, so only the parent who made it can see it, never the partner.
        Asking the same provider twice returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingRequestInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingRequest"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listBookingRequests
      tags: [directory]
      summary: The acting parent's own booking requests
      description: Only requests made by this parent, newest first. The partner's requests are never included.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingRequestList"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/mood-patterns:
    get:
      operationId: listMoodPatterns
      tags: [wellbeing]
      summary: Patterns detected in the acting parent's own recent check-ins
      description: |
        Detected from the acting parent's own check-ins of the last 7 days, for
        example low mood on three days. Check-ins are private by default, so a
        pattern is computed only from the acting parent's own entries and is
        returned only to them. Nothing from the other parent's check-ins is
        used, even when those were shared. Empty list when there is no pattern.
        Wording is never diagnostic (docs/product.md, principle 3).
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoodPatternList"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/psychologist-agenda:
    get:
      operationId: getPsychologistAgenda
      tags: [care]
      summary: Topics for the acting parent's next psychologist session
      description: |
        Topics only, as the parent chose them. Private text such as diary
        entries is never part of the agenda. The agenda belongs to the acting parent: the other parent can neither read
        it nor see that a session is booked.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PsychologistAgenda"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/psychologist-slots:
    get:
      operationId: listPsychologistSlots
      tags: [care]
      summary: Open session times with the demo psychologist, next 14 days
      description: |
        Synthetic provider and slots; there is no real provider integration.
        Slots already booked by the acting parent are left out. Booking
        availability is not shared between parents.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PsychologistSlots"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/psychologist-bookings:
    post:
      operationId: createPsychologistBooking
      tags: [care]
      summary: The acting parent books one open slot
      description: |
        The booking is stored for the acting parent only and is private to them.
        Returns 409 slot_taken if the slot is gone.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PsychologistBookingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PsychologistBooking"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/session-notes:
    post:
      operationId: createSessionNote
      tags: [care]
      summary: The acting parent writes a short note after a session
      description: |
        Always private to the author; there is no visibility field and the
        server never widens it. The note feeds the author's next weekly plan.
        The booking must belong to the acting parent and must have started.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionNoteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionNote"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/family:
    patch:
      operationId: updateFamily
      tags: [family]
      summary: A parent sets the family's stage or due date
      description: |
        Mother or partner only; a grandparent or nanny gets 403. Send only the
        fields to change. Used by the onboarding stage picker and to move the
        due date.

        - Stage pregnancy needs a due date, sent now or already stored (400
          otherwise). Moving the due date moves everything derived from it,
          because those values are computed on read, not stored: the
          gestational week, the weekly card, the birth prep unlock and the
          deadlines of paperwork tasks anchored to the due date.
        - Stages after birth (postpartum and later) need a child. Without one
          this returns 409 no_child; the UI offers "Baby is home" instead,
          which is the only way a child is added.
        - Leaving pregnancy for planning or trying clears the due date.

        Content everywhere is filtered by the stored stage (see listGuides),
        so after this call every screen shows the new stage. Sends a live
        update of kind family.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FamilyUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/baby-arrival:
    post:
      operationId: createBabyArrival
      tags: [family]
      summary: A parent flips the family to "Baby is home"
      description: |
        Mother or partner only; a grandparent or nanny gets 403. 409
        not_pregnant when the family's stage is not pregnancy (so a second
        call is 409). In one transaction the server:

        - adds the child with this name and birth date;
        - sets the stage to postpartum (the due date stays stored, but
          gestationalWeek is no longer returned);
        - turns every agreed shift into an active shift starting today, so
          committed shifts appear in everyone's calendar and Today;
        - re-anchors paperwork deadlines that count from the birth date;
        - hides pregnancy items: hospital bag tasks, the weekly pregnancy
          card, birth prep guides and pregnancy plan rules stop being
          returned (they are kept in the database, not deleted).

        Sends a live update of kind family so every open screen refreshes.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
