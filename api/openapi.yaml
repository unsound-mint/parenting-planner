  /members/{memberId}/story:
    get:
      operationId: getStory
      tags: [story]
      summary: Our story so far, the family's memory book written from what they already did
      description: |
        A read-only aggregation of data the family already has, grouped
        into chapters by stage, oldest first. Nothing is stored for it and
        nothing is invented: every moment comes from a row (a past
        appointment, a shared journal line, a care log entry, a handoff,
        the baby's arrival, a vaccine given, a lesson read, a quiz both
        parents answered, a name both liked, a talk marked as had) or from
        the sourced weekly content for a week or age the family has
        already passed (fruit sizes, "most babies by" lines, each with
        `sources`). Content lines describe what most children do by an age,
        never what this child did.

        Privacy. The book is the same for both parents. Journal lines
        appear only when their author shared them with the partner or the
        family (a private entry never appears, not even to its author) or
        marked them as a first and shared them. Appointments appear only
        with visibility family. Mood, labs and session notes never appear.
        A grandparent or nanny gets a caregiver edition: the baby's arrival
        and age lines, pregnancy weeks only with `pregnancy_updates`, and
        handoffs they took part in only with `care_log`; never journal
        lines, appointments, vaccines, lessons, quizzes, names or talks.

        `next` says what writes the next page ("when you both like the
        same name"), so an early family sees its first pages and an
        invitation instead of an empty book. Dates follow the family's demo
        clock; nothing after today appears.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/portraits:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    get:
      operationId: listPortraits
      tags: [portraits]
      summary: The family's portrait series, the bump by week and each child by month
      description: |
        Family-shared, like the care log: both parents see every portrait. A
        grandparent or nanny sees the children's portraits with baby_passport
        and the bump with pregnancy_updates; with neither, 403. Newest moment
        first: children by age in months, descending, then the bump by
        pregnancy week, descending. Metadata only; a photo's pixels come from
        getPortraitImage. Seeded demo portraits are kind illustration and have
        no image: the web draws them.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortraitList"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createPortrait
      tags: [portraits]
      summary: Upload this month's portrait of a child, or this week's bump photo
      description: |
        Parents only (403 for a grandparent or nanny). With childId and month
        (age in whole months) it is that child's portrait; without childId,
        week (pregnancy week) makes it a bump photo. Any other combination is
        400. One portrait per slot: uploading to a taken slot replaces it,
        seeded illustration or photo alike.
        The body is the raw image, resized in the browser to at most 1600 px
        and encoded as JPEG. The server accepts image/jpeg and image/png
        (checked from the bytes, not the header; anything else is 400), at
        most 1.5 MB (413 too_large, cut off while reading) and at most 4096
        px a side. It decodes and re-encodes the image as JPEG, so EXIF,
        location and any other metadata never reach the database. Stored in
        the database with the family and deleted with it, and when the
        visitor starts a new demo from the same browser.
      parameters:
        - name: childId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: month
          in: query
          required: false
          description: The child's age in whole months on the photo.
          schema:
            type: integer
            minimum: 0
            maximum: 72
        - name: week
          in: query
          required: false
          description: The pregnancy week of a bump photo.
          schema:
            type: integer
            minimum: 4
            maximum: 42
      requestBody:
        required: true
        content:
          image/*:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portrait"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Error
          content:
            application/json:
              schema:
