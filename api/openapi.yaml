openapi: 3.0.3
info:
  title: Parenting Planner API
  version: 0.1.0
  description: |
    Contract between web/ and api/. Both sides generate code from this file
    (`make gen`); never edit generated code by hand. Change this file first,
    in its own PR or together with both implementations.

    Auth: there is no login. POST /demo/sessions creates a demo family and
    sets an httpOnly session cookie that scopes every other call to that family.
servers:
  - url: /api
security:
  - session: []
tags:
  - name: demo
  - name: family
  - name: plan
  - name: wellbeing
  - name: recovery
  - name: supplies
  - name: directory
  - name: passport
  - name: health
  - name: care
  - name: invitations
  - name: content
  - name: today
  - name: tasks
  - name: thanks
  - name: calendar
  - name: simulator
  - name: learn
  - name: together
  - name: virtualbaby
  - name: couplelab
  - name: timecapsule
  - name: shifts
  - name: carelog
  - name: live
  - name: billing
  - name: notifications
  - name: postcard
  - name: leave
  - name: money
  - name: insurance
  - name: screening
  - name: offers
  - name: admin
  - name: account
  - name: story
  - name: portraits
  - name: missions
  - name: badges
  - name: childcare
paths:
  /healthz:
    get:
      operationId: healthz
      security: []
      responses:
        "200":
          description: The API and its database are up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /demo/sessions:
    post:
      operationId: createDemoSession
      tags: [demo]
      security: []
      summary: Start a demo with a fresh copy of a synthetic family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDemoSessionRequest"
      responses:
        "201":
          description: Family created; the session cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Error. Too many new demos from one address (rate_limited); Retry-After is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /demo/custom-sessions:
    post:
      operationId: createCustomSession
      tags: [demo]
      security: []
      summary: Start with a new family built from the visitor's own details
      description: |
        "Try it with your own details": creates a new family for this visitor
        from what they typed, through the same seed and rules path as the demo
        families, and sets the same session cookie as createDemoSession. The
        family's template is `custom`. No auth; nothing is stored beyond the
        typed fields, and each call makes a separate family.

        Dates are checked against the stage (400 `bad_details` otherwise):
        - pregnancy: dueDate is required, from 14 days ago to 280 days ahead.
        - postpartum, infant, toddler, preschool, school_age: childBirthDate is
          required, not in the future, and the child's age must fit the stage:
          postpartum under 3 months, infant 3 to 11 months, toddler 12 to 35
          months, preschool 36 to 59 months, school_age 60 months to 9 years.
        - planning, trying: no dates.
        A date that does not belong to the stage is ignored and not stored, and
        childName is ignored before birth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomFamilyInput"
      responses:
        "201":
          description: Family created; the session cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Error. Too many new demos from one address (rate_limited); Retry-After is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family:
    get:
      operationId: getFamily
      tags: [family]
      summary: The family of the current session, with parents, caregivers and children
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      operationId: deleteFamily
      tags: [account]
      summary: Delete the session's family and everything stored for it
      description: |
        Account deletion for the demo, where the account is the family behind
        the session cookie. Deletes the family and every row that belongs to
        it (parents, children, caregivers, health records, check-ins, notes,
        bookings, sessions and the audit log) and clears the pp_session
        cookie. Other families are untouched. The old cookie gets 401
        afterwards. Nothing is soft-deleted. Backups: see "Deletion and
        backups" in docs/data-model.md.
        Only a parent's session may do this; a caregiver's session gets 403.
      responses:
        "204":
          description: Deleted; the session cookie is cleared.
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family/demo-time-skips:
    post:
      operationId: createDemoTimeSkip
      tags: [demo]
      summary: Skip the session's family ahead one week (demo time)
      description: |
        Moves this family's demo clock forward 7 days. From then on every date
        the API computes for the family (plan, due items, gestational week,
        timeline) uses the shifted day, from the same stored data. Only this
        family moves; other demo families keep the real date. Starting a new
        demo creates a new family at real time, which is the reset. The UI
        must label the shifted date as demo time. A caregiver's session gets 403.
      responses:
        "200":
          description: The family as of its new demo date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family/upgrade-intents:
    post:
      operationId: createUpgradeIntent
      tags: [family]
      summary: Record that the family wants a paid plan
      description: |
        There are no payments. This stores which tier the family asked for and
        when; it shows as "upgrade requested" on the family. Either parent of the
        session's family may send it. A second request replaces the first.
        A caregiver's session gets 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeIntentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeIntent"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family/childcare-options:
    get:
      operationId: listChildcareOptions
      tags: [childcare]
      summary: The childcare options the family is tracking, newest first
      description: |
        Daycares, nannies and family care the parents are looking at, with
        where each one stands (researching to accepted or declined), waitlist
        position and dates. Family-wide: both parents see and edit the same
        list. A caregiver's session gets 403. An offered option with a
        decideBy date puts "Decide on a childcare offer" on both parents' plans.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildcareOptionList"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createChildcareOption
      tags: [childcare]
      summary: Start tracking a childcare option
      description: Either parent may add one. A caregiver's session gets 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChildcareOptionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildcareOption"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family/childcare-options/{optionId}:
    parameters:
      - $ref: "#/components/parameters/ChildcareOptionId"
    get:
      operationId: getChildcareOption
      tags: [childcare]
      summary: One childcare option
      description: A caregiver's session gets 403.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildcareOption"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: updateChildcareOption
      tags: [childcare]
      summary: Replace a childcare option with the values sent
      description: |
        A full replace: optional fields left out are cleared. Send the whole
        option, for example with a new status and waitlist position.
        A caregiver's session gets 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChildcareOptionInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildcareOption"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteChildcareOption
      tags: [childcare]
      summary: Stop tracking a childcare option
      description: A caregiver's session gets 403.
      responses:
        "204":
          description: Deleted
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/plan:
    get:
      operationId: getMemberPlan
      tags: [plan]
      summary: This week's plan for one parent
      description: |
        Items come from the guideline rules engine, evaluated against the family
        data this parent is allowed to see. Each item says why it applies and
        cites its source.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/weekly-plan:
    get:
      operationId: getMemberWeeklyPlan
      tags: [plan]
      summary: A short written plan for this parent's week
      description: |
        A note written for the acting parent from the data they may see: their
        due plan items, their own recent mood and sleep, diary topics the
        partner shared with them, and the family's stage. The other parent
        gets a different plan. Private records (diary, mood, labs, session
        notes) that were not shared with this parent never feed it. The text
        never diagnoses. Urgent symptoms and self-harm mentions are not
        written here; they go to the fixed urgent-help screen. When the AI
        call fails, fallback is true and the sections are built from the rule
        plan.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyPlan"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/journey:
    get:
      operationId: getMemberJourney
      tags: [journey]
      summary: The family's path from planning to age 9, where they are now and what comes next
      description: |
        Every stage from planning to age 9 in order, each marked past, current
        or future, with its dates when the family's due date or child's birth
        date fixes them. `current` is the "you are here" marker, computed from
        the family's stage, due date and youngest child's birth date. The
        upcoming items are the first few items of this parent's plan from the
        rules engine (the same items and order as getMemberPlan), so the two
        parents can see different items.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journey"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/passport:
    get:
      operationId: getPassport
      tags: [passport]
      summary: The health passport of the family as the acting parent may see it
      description: |
        One entry per person: the acting parent, the other parent and the
        child (when there is one). The acting parent sees all of their own
        records and everything recorded for the child. For the other parent
        only records shared with the acting parent come back (visibility
        partner or family, the rule in access.CanParentRead); private and
        care_team records are left out, and their count is not revealed.
        Reading labs and allergies is audited like any sensitive read.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passport"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/export:
    get:
      operationId: getMemberExport
      tags: [account]
      summary: Download everything the acting parent may see, as one JSON file
      description: |
        Data export for one parent. Contains the family, the passport, mood
        check-ins, psychologist bookings, session notes and plan progress,
        read with the same access rules as the screens: all of the acting
        parent's own records, records the other parent shared with them, and
        nothing the other parent kept private. The read is audited. The
        response is sent as a file download (Content-Disposition attachment).
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberExport"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/plan/{ruleId}/status:
    put:
      operationId: setPlanItemProgress
      tags: [plan]
      summary: The acting parent marks a plan item as booked or done
      description: |
        Records progress on one plan item for this parent. A booked or done item
        stays on the plan, shown as settled, so nothing disappears unseen.
      parameters:
        - $ref: "#/components/parameters/MemberId"
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
          example: glucose-screen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanItemProgressInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanItem"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/mood-checkins:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    post:
      operationId: createMoodCheckin
      tags: [wellbeing]
      summary: The acting parent records how they feel today
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoodCheckinInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoodCheckin"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listMoodCheckins
      tags: [wellbeing]
      summary: Check-ins from the last 30 days that the acting parent may see
      description: Their own check-ins plus the other parent's check-ins shared with them.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoodCheckinList"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /members/{memberId}/immunizations:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    post:
      operationId: createImmunization
      tags: [health]
      summary: The acting parent logs a vaccine dose given to them or to a child
      description: |
        The subject is the acting parent, or the child named by childId
        (404 when the child is not in the family). Another parent's id is
        never accepted.
        The plan and the journey read doses on the next request, so a logged
        dose removes the matching rule item. When dose is left out and a dose
        of this vaccine is scheduled for the subject, the earliest scheduled
        dose is the one marked as given.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImmunizationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaccineDose"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /members/{memberId}/growth-measurements:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    post:
      operationId: createGrowthMeasurement
      tags: [health]
      summary: The acting parent records a child's weight, length and head size
      description: |
        Parents only (404 for a caregiver id). childId must be a child of
        the family (404 otherwise); measuredOn not after today (400). The
        passport lists it on the next read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrowthMeasurementInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrowthPoint"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /members/{memberId}/growth-measurements/{measurementId}:
    parameters:
      - $ref: "#/components/parameters/MemberId"
      - $ref: "#/components/parameters/GrowthMeasurementId"
    patch:
      operationId: updateGrowthMeasurement
      tags: [health]
      summary: Correct a growth measurement
      description: |
        Parents only. Replaces the date and values with the body; the child
        stays (childId in the body is ignored). 404 when the measurement is
        not in the family.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrowthMeasurementInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrowthPoint"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteGrowthMeasurement
      tags: [health]
      summary: Remove a growth measurement
      description: Parents only. 404 when the measurement is not in the family.
      responses:
        "204":
          description: Deleted
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
