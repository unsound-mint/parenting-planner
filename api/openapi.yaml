        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createCalendarEvent
      tags: [calendar]
      summary: A parent adds an appointment, class or reminder
      description: |
        Mother or partner only; a grandparent or nanny gets 403. The acting
        parent owns the event. attendeeIds may name other family members,
