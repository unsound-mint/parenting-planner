            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/recovery-guidance:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    get:
      operationId: getRecoveryGuidance
      tags: [recovery]
      summary: Fourth-trimester guidance and the postnatal check window
      description: |
        For a family with a baby. The text depends only on the days since the birth, not on
        anything the mother logged. Every point is backed by sources (ACOG, NHS, CDC) with
        the date they were checked. Both parents may read it; a caregiver gets 404. 409
        no_child when no baby is on record yet.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryGuidance"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/preferences:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    get:
      operationId: getMemberPreferences
      tags: [family]
      summary: The acting parent's own settings
      description: |
        Per parent. essentialsOnly is the "Essentials only" mode: a parent who finds
        tracking every nap and diaper stressful hides detailed tracking (care log details
        and charts) and keeps the essentials (next feed estimate, medicines, appointments).
        Screens that show detailed tracking must read it and respect it. Caregivers get 404.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPreferences"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: updateMemberPreferences
      tags: [family]
      summary: Change the acting parent's own settings
      description: |
        The parent changes only their own setting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberPreferences"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPreferences"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/supplies:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    get:
      operationId: getSupplies
      tags: [supplies]
      summary: What the family has at home, the shopping list and a size suggestion
      description: |
        Parents, and a grandparent or nanny with the care_log permission (others get 403).
        Each item carries a status and, for diapers, wipes and formula, an estimate of how
        many days are left, worked out from the care log of the last 7 days. The estimate
        needs at least 3 logged events; otherwise daysLeft is absent. It is labelled as an
        estimate in the UI. sizes is absent when no child is on record.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplies"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/supply-items:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    post:
      operationId: createSupplyItem
      tags: [supplies]
      summary: A parent adds something the family keeps at home
      description: |
        Parents only; a caregiver gets 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplyItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplyItem"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/supply-items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/MemberId"
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateSupplyItem
      tags: [supplies]
      summary: A parent changes the amount or details of an item
      description: |
        The whole editable state is sent. Parents only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplyItemUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplyItem"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteSupplyItem
      tags: [supplies]
      summary: A parent removes an item
      description: |
        Parents only. Its open shopping rows stay as plain names.
      responses:
        "204":
          description: Deleted
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/shopping-items:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    post:
      operationId: createShoppingItem
      tags: [supplies]
      summary: Add something to the shared shopping list
      description: |
        Parents, and a caregiver with the care_log permission. supplyItemId links the row to
        an item; adding a second open row for the same item returns the existing one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShoppingItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingItem"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/shopping-items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/MemberId"
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateShoppingItem
      tags: [supplies]
      summary: Tick or untick a shopping list row
      description: |
        Parents, and a caregiver with the care_log permission. Ticking a row linked to an
        item with a restockQuantity adds that quantity to the item once; unticking takes
        it back. A caregiver's tick is audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShoppingItemUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingItem"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteShoppingItem
      tags: [supplies]
      summary: Remove a row from the shopping list
      description: |
        Parents only.
      responses:
        "204":
          description: Deleted
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/missions:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    get:
      operationId: listMissions
      tags: [missions]
      summary: Missions for the family's stage, with who took what
      description: |
        Practical jobs for either parent, written mostly for the one who is not pregnant. Both parents see all of them. A mission taken by either parent shows who took it. Missions put back with swapMission are left out. Parents only; a grandparent or nanny gets 404.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionList"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/missions/{missionKey}/take:
    parameters:
      - $ref: "#/components/parameters/MemberId"
      - $ref: "#/components/parameters/MissionKey"
    post:
      operationId: takeMission
      tags: [missions]
      summary: The acting parent takes a mission
      description: |
        Creates a plan task assigned to the acting parent (title, why and source from the mission), so it shows in the plan and the load map. 404 for an unknown key, 409 mission_taken when it is already taken, 409 wrong_stage when it is not offered at this stage. A mission that was put back can be taken again.
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/missions/{missionKey}/done:
    post:
      parameters:
        - $ref: "#/components/parameters/MemberId"
        - $ref: "#/components/parameters/MissionKey"
      operationId: finishMission
      tags: [missions]
      summary: Finish a taken mission, with an optional one-line note
      description: |
        Ticks the mission's plan task and may earn stickers (see listStickers). Calling it again only updates the note. 409 not_taken when nobody took it.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionDone"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/missions/{missionKey}/swap:
    post:
      parameters:
        - $ref: "#/components/parameters/MemberId"
        - $ref: "#/components/parameters/MissionKey"
      operationId: swapMission
      tags: [missions]
      summary: Put a mission back
      description: |
        Takes the mission off the list for this family, and removes its plan task if it was taken. 409 mission_done when it is already finished.
      responses:
        "204":
          description: Done
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/stickers:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    get:
      operationId: listStickers
      tags: [badges]
      summary: The acting parent's sticker book
      description: |
        Stickers earned for finished lessons and paths, finished missions, practice with the virtual baby, and finishing the same path as the other parent. There are no points, ranks or streaks, and none for health data. Open slots are returned with earned false so the book can show them. new is true until markStickerSeen is called, so the earn animation plays once. Computed from stored state on every read. Parents only; a grandparent or nanny gets 404.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StickerBook"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/stickers/{stickerKey}/seen:
    post:
      parameters:
        - $ref: "#/components/parameters/MemberId"
        - name: stickerKey
          in: path
          required: true
          schema:
            type: string
      operationId: markStickerSeen
      tags: [badges]
      summary: The earn animation has played for a sticker
      description: |
        Clears new on the acting parent's sticker. 404 when they have not earned it.
      responses:
        "204":
          description: Done
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/virtual-baby:
    get:
      operationId: getVirtualBaby
      tags: [virtualbaby]
      summary: The family's Virtual Baby practice sessions and stickers
      description: |
        Parents only; a grandparent or nanny gets 404. Sessions belong to the
        family: both parents see every session and who handled each moment.
        Newest first, the active session (if any) first; at most 10. Stickers
        are earned for taking part (a topic practised, both parents took a
        turn, the 48 hours finished), never for which choice someone made.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualBaby"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/virtual-baby-sessions:
    post:
      operationId: createVirtualBabySession
      tags: [virtualbaby]
      summary: Start a Virtual Baby session (one evening or the 48-hour challenge)
      description: |
        Parents only. One active session per family: 409 session_active while
        another is not finished. The simulated clock is not real time: the web
        app runs it only while the page is open, so nothing ever arrives at
        night.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VirtualBabySessionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualBabySession"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/virtual-baby-sessions/{sessionId}:
    patch:
      operationId: updateVirtualBabySession
      tags: [virtualbaby]
      summary: End a Virtual Baby session early
      description: |
        Parents only. Ending a finished session again returns it unchanged.
        404 not_found for a session of another family.
      parameters:
        - $ref: "#/components/parameters/MemberId"
        - $ref: "#/components/parameters/VirtualBabySessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VirtualBabySessionUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualBabySession"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/virtual-baby-sessions/{sessionId}/moments:
    post:
      operationId: createVirtualBabyMoment
      tags: [virtualbaby]
      summary: Respond to the baby's current moment
      description: |
        Parents only. The acting parent (memberId) is recorded as the one who
        handled it, so partners can take turns. seq must be the session's next
        moment: 409 moment_taken if it was already handled (the other parent
        was faster) or the session is finished. 400 unknown_choice for a choice
        that is not offered. Returns kind feedback with its source and the
        session after the answer. The last moment finishes the session.
      parameters:
        - $ref: "#/components/parameters/MemberId"
        - $ref: "#/components/parameters/VirtualBabySessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VirtualBabyMomentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualBabyMomentResult"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    MissionKey:
      name: missionKey
      in: path
      required: true
      schema:
        type: string
        maxLength: 60
    MemberId:
      name: memberId
      in: path
      required: true
      description: |
        The acting person. There is no login, so the UI says who is using
        the app; the API checks that this person belongs to the session's
        family. Usually a parent (mother or partner). A grandparent or nanny
        id (family.caregivers) is accepted only where the operation says so:
        operations written for parents return 404 for a caregiver id, and
        operations open to caregivers return 403 forbidden when their role
        or permissions do not allow the action.
      schema:
        type: string
        format: uuid

    VirtualBabySessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    CareLogEntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    GrowthMeasurementId:
      name: measurementId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PortraitId:
      name: portraitId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ChildcareOptionId:
      name: optionId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    InvitationToken:
      name: token
      in: path
      required: true
      description: The secret from the invitation link.
      schema:
        type: string
        minLength: 16
        maxLength: 128

    LessonId:
      name: lessonId
      in: path
      required: true
      schema:
        type: string
        maxLength: 80

    BabyNameId:
      name: nameId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    BudgetItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    RoundId:
      name: roundId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    FeedToken:
      name: token
      in: path
      required: true
      description: The secret from a calendar subscription link.
      schema:
        type: string
        minLength: 16
        maxLength: 128

    OfferId:
      name: offerId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: pp_session


  schemas:
    MissionList:
      type: object
      required: [stage, items]
      properties:
        stage:
          type: string
          enum: [planning, first_trimester, second_trimester, third_trimester, newborn, baby, toddler]
          description: The mission stage the family is in now.
        items:
          type: array
          description: In suggestion order; open missions first is the client's choice.
          items:
            $ref: "#/components/schemas/Mission"

    Mission:
      type: object
      required: [key, stage, title, why, category, forPartner, state]
      properties:
        key:
          type: string
        stage:
          type: string
          enum: [planning, first_trimester, second_trimester, third_trimester, newborn, baby, toddler]
        title:
          type: string
        why:
          type: string
          description: One or two warm sentences on why this helps.
        category:
          type: string
          enum: [meals, home, gear, care, learning, rest, together]
        forPartner:
          type: boolean
          description: Written for the parent who is not pregnant. Either parent can take any mission.
        state:
          type: string
          enum: [open, taken, done]
        takenBy:
          type: string
          format: uuid
          description: The parent who took it.
        taskId:
          type: string
          format: uuid
          description: The plan task created when it was taken.
        dueOn:
          type: string
          format: date
          description: When it is most useful, if it matters. Never a deadline to be ashamed of.
        note:
          type: string
          description: The one-line note written when it was finished.
        doneAt:
          type: string
          format: date-time
        doneBy:
          type: string
          format: uuid
        source:
          $ref: "#/components/schemas/Source"

    MissionDone:
      type: object
      properties:
        note:
          type: string
          maxLength: 140

    StickerBook:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: In book order (groups learning, together, missions, practice).
          items:
            $ref: "#/components/schemas/Sticker"

    Sticker:
      type: object
      required: [key, title, blurb, art, group, earned, new]
      properties:
        key:
          type: string
        title:
          type: string
        blurb:
          type: string
          description: What earns it. Shown on open slots too.
        art:
          type: string
          description: Names the web illustration.
        group:
          type: string
          enum: [learning, together, missions, practice]
        pathId:
          type: string
          description: The learning path of a path or together sticker.
        earned:
          type: boolean
        earnedAt:
          type: string
          format: date-time
        new:
          type: boolean
          description: Earned and the earn animation has not played yet.
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: not_found
        message:
          type: string

    DemoTemplate:
      type: string
      description: "Which synthetic family to copy: planning (trying for a first baby), pregnancy (second trimester), newborn (baby about 7 weeks old), preschool (child aged 4). Add a value here when its seed exists. `custom` marks a family built from the visitor's own details (createCustomSession); createDemoSession rejects it with 400."
      enum: [planning, pregnancy, newborn, preschool, custom]

    CreateDemoSessionRequest:
      type: object
      required: [template]
      properties:
        template:
          $ref: "#/components/schemas/DemoTemplate"

    CustomFamilyInput:
      type: object
      required: [stage, motherName, partnerName]
      properties:
        stage:
          $ref: "#/components/schemas/Stage"
        dueDate:
          type: string
          format: date
          description: Required for pregnancy.
        childBirthDate:
          type: string
          format: date
          description: Required once the child is born (postpartum and later).
        childName:
          type: string
          minLength: 1
          maxLength: 40
          description: Optional; "Baby" when left out.
        motherName:
          type: string
          minLength: 1
          maxLength: 40
        partnerName:
          type: string
          minLength: 1
          maxLength: 40

    Stage:
      type: string
      description: Where the family is on the journey from planning to age 9.
      enum: [planning, trying, pregnancy, postpartum, infant, toddler, preschool, school_age]

    ParentRole:
      type: string
      enum: [mother, partner]

    Tier:
      type: string
      description: |
        The plan the family is on, for both parents. Demo families start on
        free; a completed Stripe test checkout sets it (see subscription).
      enum: [free, plus, concierge]

    PaidTier:
      type: string
      enum: [plus, concierge]

    ChildcareKind:
      type: string
      description: daycare = a center; nanny = care at home; family = a relative or a home-based family daycare.
      enum: [daycare, nanny, family]

    ChildcareStatus:
      type: string
      description: Where the family stands with this option, in the order it usually goes.
      enum: [researching, toured, applied, waitlisted, offered, accepted, declined]

    ChildcareOptionInput:
      type: object
      required: [name, kind, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Little Harbor Early Learning
        kind:
          $ref: "#/components/schemas/ChildcareKind"
        contact:
          type: string
          maxLength: 300
          description: Free text, such as a person, phone number or email.
        monthlyCost:
          type: integer
          minimum: 0
          maximum: 100000
          description: Cost per month in whole US dollars.
        status:
          $ref: "#/components/schemas/ChildcareStatus"
        waitlistPosition:
          type: integer
          minimum: 1
          maximum: 10000
        appliedOn:
          type: string
          format: date
        decideBy:
          type: string
          format: date
          description: The date the family must answer by, such as the deadline to accept an offered place.
        notes:
          type: string
          maxLength: 2000

    ChildcareOption:
      type: object
      required: [id, name, kind, status, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/ChildcareKind"
        contact:
          type: string
        monthlyCost:
          type: integer
          description: Cost per month in whole US dollars.
        status:
          $ref: "#/components/schemas/ChildcareStatus"
        waitlistPosition:
          type: integer
        appliedOn:
          type: string
          format: date
        decideBy:
          type: string
          format: date
        notes:
          type: string
        updatedAt:
          type: string
          format: date-time

    ChildcareOptionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChildcareOption"

    UpgradeIntentInput:
      type: object
      required: [tier]
      properties:
        tier:
          $ref: "#/components/schemas/PaidTier"

    UpgradeIntent:
      type: object
      required: [tier, requestedAt]
      properties:
        tier:
          $ref: "#/components/schemas/PaidTier"
        requestedAt:
          type: string
          format: date-time

    Family:
      type: object
      required: [id, template, stage, parents, caregivers, children]
      properties:
        id:
          type: string
          format: uuid
        template:
          $ref: "#/components/schemas/DemoTemplate"
        demoDaysAhead:
          type: integer
          minimum: 0
          description: |
            Days this family's demo clock has been skipped ahead of the real
            date (createDemoTimeSkip). Absent or 0 means real time; anything else must be
            shown as demo time.
        sessionMemberId:
          type: string
          format: uuid
          description: |
            Set when the session belongs to one person: a caregiver who accepted
            an invitation. That session acts only as this member (other ids are
            404) and cannot manage the family (skip demo time, upgrade, delete,
            demo admin: 403). Absent for a demo session, which acts as either
            parent.
        stage:
          $ref: "#/components/schemas/Stage"
        dueDate:
          type: string
          format: date
          description: Set during pregnancy.
        gestationalWeek:
          type: integer
          description: Completed weeks of pregnancy today, derived from dueDate.
        tier:
          $ref: "#/components/schemas/Tier"
        subscription:
          $ref: "#/components/schemas/Subscription"
        upgradeRequest:
          $ref: "#/components/schemas/UpgradeIntent"
        pregnancyLoss:
          $ref: "#/components/schemas/PregnancyLoss"
        parents:
          type: array
          items:
            $ref: "#/components/schemas/Parent"
        caregivers:
          type: array
          description: |
            Other people who help with the child and can be opened as their own
            view (the demo role switcher). Empty when the family has none.
          items:
            $ref: "#/components/schemas/Caregiver"
        children:
          type: array
          items:
            $ref: "#/components/schemas/Child"

    Parent:
      type: object
      required: [id, role, displayName]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ParentRole"
        displayName:
          type: string

    CaregiverRole:
      type: string
      description: |
        What each person may see. mother and partner see everything their own
        data and the sharing rules allow. A grandparent or nanny sees the baby's
        care: the child's schedule, feeding, sleep, visits and milestones, and
        what the parents chose to share for the family. They never see a
        parent's health data (labs, mood check-ins, diary, session notes) and
        cannot create or change those records.
      enum: [grandparent, nanny]

    Caregiver:
      type: object
      required: [id, role, displayName, permissions]
      properties:
        id:
          type: string
          format: uuid
          description: Used in /family/{id} on the web side, like a parent id.
        role:
          $ref: "#/components/schemas/CaregiverRole"
        displayName:
          type: string
        permissions:
          type: array
          description: What this caregiver was granted; the web hides navigation they may not use.
          items:
            $ref: "#/components/schemas/CaregiverPermission"

    Child:
      type: object
      required: [id, name, birthDate, ageMonths]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        birthDate:
          type: string
          format: date
        ageMonths:
          type: integer

    Plan:
      type: object
      required: [memberId, generatedAt, items]
      properties:
        memberId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
        items:
          type: array
          description: Sorted by status (overdue, due, upcoming), then due date.
          items:
            $ref: "#/components/schemas/PlanItem"

    JourneyStage:
      type: string
      description: |
        A step on the timeline shown to parents, from planning to age 9. Finer
        than the family's stored Stage: birth, newborn and first year are
        separate steps.
      enum: [planning, pregnancy, birth, newborn, first_year, toddler, preschool, school_age]

    JourneySpanStatus:
      type: string
      enum: [past, current, future]

    JourneySpan:
      type: object
      required: [stage, status]
      properties:
        stage:
          $ref: "#/components/schemas/JourneyStage"
        status:
          $ref: "#/components/schemas/JourneySpanStatus"
        startsOn:
          type: string
          format: date
          description: First day of this stage for this family. Absent when no due date or birth date fixes it (planning families).
        endsOn:
          type: string
          format: date
          description: Last day of this stage for this family. Absent when unknown. Birth is a single day, so startsOn equals endsOn.

    JourneyPosition:
      type: object
      description: The "you are here" marker. Numbers only; the web formats them.
      required: [stage]
      properties:
        stage:
          $ref: "#/components/schemas/JourneyStage"
        gestationalWeek:
          type: integer
          description: Set in pregnancy; the same value as Family.gestationalWeek.
        childId:
          type: string
          format: uuid
          description: Set after birth; the youngest child, whose age places the family.
        childAgeWeeks:
          type: integer
          description: Set after birth; completed weeks since the youngest child's birth.
        childAgeMonths:
          type: integer
          description: Set after birth; the same value as Child.ageMonths.

    Journey:
      type: object
      required: [memberId, generatedAt, current, stages, upcoming]
      properties:
        memberId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
        current:
          $ref: "#/components/schemas/JourneyPosition"
        stages:
          type: array
          description: All eight stages in order, from planning to school age (to age 9).
          items:
            $ref: "#/components/schemas/JourneySpan"
        upcoming:
          type: array
          description: The next things for this parent, from the rules engine, most urgent first. Up to 5; fewer when the rules have less to say at this stage.
          maxItems: 5
          items:
            $ref: "#/components/schemas/PlanItem"

    PlanItemStatus:
      type: string
      enum: [overdue, due, upcoming]

    PlanCategory:
      type: string
      enum: [screening, vaccine, visit, mental_health, logistics, couple, learning]

    PlanItem:
      type: object
      required: [ruleId, title, detail, status, category, reason, source]
      properties:
        ruleId:
          type: string
          example: glucose-screen
        title:
          type: string
        detail:
          type: string
          description: What to do, in plain language.
        status:
          $ref: "#/components/schemas/PlanItemStatus"
        category:
          $ref: "#/components/schemas/PlanCategory"
        dueBy:
          type: string
          format: date
        reason:
          type: string
          description: Why this applies to this parent now, based on their data.
        source:
          $ref: "#/components/schemas/Source"
        progress:
          $ref: "#/components/schemas/PlanItemProgress"

    PlanItemProgress:
      type: string
      description: What the parent has done about an item. Absent until they record something.
      enum: [booked, done]

    PlanItemProgressInput:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/PlanItemProgress"

    WeeklyPlan:
      type: object
      required: [memberId, generatedAt, fallback, intro, sections]
      properties:
        memberId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
        fallback:
          type: boolean
          description: True when the rule-based plan was used because the AI call failed.
        intro:
          type: string
          description: One or two warm sentences that open the note.
        sections:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyPlanSection"

    WeeklyPlanSection:
      type: object
      required: [title, points]
      properties:
        title:
          type: string
          example: For you
        points:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyPlanPoint"

    WeeklyPlanPoint:
      type: object
      required: [text, reason]
      properties:
        text:
          type: string
          description: What to do, in one or two plain sentences. Never a diagnosis. Any medical point must carry a source.
        reason:
          type: string
          description: The data behind the point, for example "You slept 5.5 hours on average this week."
        ruleId:
          type: string
          description: The rule plan item this point comes from, when it has one.
        source:
          $ref: "#/components/schemas/Source"

    SafetyReferenceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SafetyEntry"

    SafetyEntry:
      type: object
      required: [id, category, topic, name, aliases, pregnancy, sources]
      properties:
        id:
          type: string
          example: soft-cheese
        category:
          type: string
          enum: [food, medicine]
        topic:
          type: string
          description: The group a filter chip is built from ("Dairy and eggs", "Pain and fever").
        name:
          type: string
        aliases:
          type: array
          description: Brand names and other words people search for.
          items:
            type: string
        pregnancy:
          $ref: "#/components/schemas/SafetyAdvice"
        breastfeeding:
          $ref: "#/components/schemas/SafetyAdvice"
        ask:
          type: string
          description: Present on every medicine entry; the screen ends the entry with it.
          example: Ask your pharmacist, OB or midwife, or other clinician before you take it.
        learn:
          $ref: "#/components/schemas/SafetyLearnLink"
        sources:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Source"

    SafetyAdvice:
      type: object
      required: [status, why]
      properties:
        status:
          type: string
          description: ok = generally considered OK, limit = limit it or take care, avoid = generally advised against, ask = ask your OB, midwife or pharmacist.
          enum: [ok, limit, avoid, ask]
          # Plain Ok/Limit/Ask collide with other Go identifiers in httpapi.
          x-enum-varnames: [SafetyOk, SafetyLimit, SafetyAvoid, SafetyAsk]
        why:
          type: string
          description: One plain line. Never a personal approval.

    SafetyLearnLink:
      type: object
      description: A nutrition lesson that covers the same topic, opened with /learn?path=...&lesson=...
      required: [pathId, lessonId]
      properties:
        pathId:
          type: string
        lessonId:
          type: string

    StageNow:
      type: object
      required: [stage, period, headline, detail, playIdea, note, sources]
      properties:
        stage:
          $ref: "#/components/schemas/JourneyStage"
        period:
          type: string
          description: The age or phase this line covers, for a label ("Week 8 of life", "18 months", "Planning").
          example: Week 8 of life
        headline:
          type: string
          description: One warm sentence about what is happening now.
        detail:
          type: string
          description: What most children do by this age, or what to prepare. Never a diagnosis.
        playIdea:
          type: string
          description: One simple play or bonding idea for this period.
        note:
          type: string
          description: Children vary; talk to the pediatrician (or doctor) about worries. Show it with the milestone.
        sources:
          type: array
          description: Pages the text paraphrases, each opened on its checked date. The first is the page to link.
          minItems: 1
          items:
            $ref: "#/components/schemas/Source"

    Source:
      type: object
      required: [title, url, checkedAt]
      properties:
        title:
          type: string
        url:
          type: string
        checkedAt:
          type: string
          format: date
          description: When someone last confirmed the guideline still says this.

    Visibility:
      type: string
      description: |
        Who besides the author may see a sensitive record.
        private = author only; partner = author and the other parent;
        care_team = author and their professionals, not the partner; family = both parents.
      enum: [private, partner, care_team, family]

    MoodCheckinInput:
      type: object
      required: [mood, energy, sleepHours, visibility]
      properties:
        mood:
          type: integer
          minimum: 1
          maximum: 5
          description: 1 = very low, 5 = very good.
        energy:
          type: integer
          minimum: 1
          maximum: 5
        sleepHours:
          type: number
          minimum: 0
          maximum: 24
          description: Hours slept in the last 24 hours.
        note:
          type: string
          maxLength: 500
        visibility:
          $ref: "#/components/schemas/Visibility"

    MoodCheckin:
      type: object
      required: [id, authorId, recordedAt, mood, energy, sleepHours, visibility]
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        recordedAt:
          type: string
          format: date-time
        mood:
          type: integer
        energy:
          type: integer
        sleepHours:
          type: number
        note:
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"

    MoodCheckinList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/MoodCheckin"

    MoodPatternKind:
      type: string
      description: |
        low_mood = mood at or below 2 on several days; low_mood_and_sleep = the
        same days also had under 6 hours of sleep.
      enum: [low_mood, low_mood_and_sleep]

    MoodPattern:
      type: object
      required: [kind, startedOn, days, checkinIds, message, providerType, source]
      properties:
        kind:
          $ref: "#/components/schemas/MoodPatternKind"
        startedOn:
          type: string
          format: date
          description: Date of the first check-in in the pattern.
        days:
          type: integer
          description: Number of check-in days in the pattern.
        checkinIds:
          type: array
          description: The acting parent's check-ins that make up the pattern, oldest first.
          items:
            type: string
            format: uuid
        message:
          type: string
          description: Plain, kind and non-diagnostic. Describes what the check-ins show and suggests talking to someone.
        providerType:
          $ref: "#/components/schemas/ProviderType"
        source:
          $ref: "#/components/schemas/Source"

    MoodPatternList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MoodPattern"


    ProviderType:
      type: string
      description: What kind of care the provider offers.
      enum: [perinatal_therapist, psychologist, doula, lactation_consultant, sleep_consultant, child_therapist, tutor]

    UsState:
      type: string
      description: Two-letter US state code.
      pattern: "^[A-Z]{2}$"
      example: CA

    Provider:
      type: object
      required: [id, name, type, city, state, languages, nextAvailable, priceUsd, summary]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: "#/components/schemas/ProviderType"
        city:
          type: string
        state:
          $ref: "#/components/schemas/UsState"
        languages:
          type: array
          items:
            type: string
          example: [English, Spanish]
        nextAvailable:
          type: string
          format: date
        priceUsd:
          type: integer
          description: Price of one session in US dollars.
        summary:
          type: string
          description: One plain sentence on what this provider helps with.

    ProviderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Provider"

    BookingRequestInput:
      type: object
      required: [providerId]
      properties:
        providerId:
          type: string
          format: uuid
        note:
          type: string
          maxLength: 500
          description: Optional message for the provider.

    BookingRequestStatus:
      type: string
      description: Only requested exists for now; the demo never confirms a booking.
      enum: [requested]

    BookingRequest:
      type: object
      required: [id, memberId, providerId, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
          description: The parent who made the request.
        providerId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/BookingRequestStatus"
        note:
          type: string
        createdAt:
          type: string
          format: date-time

    BookingRequestList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/BookingRequest"

    Passport:
      type: object
      required: [memberId, people]
      properties:
        memberId:
          type: string
          format: uuid
          description: The acting parent.
        people:
          type: array
          description: The acting parent first, then the other parent, then the child.
          items:
            $ref: "#/components/schemas/PassportPerson"

    MemberExport:
      type: object
      description: |
        One parent's data export. Lists are complete (no time window), newest
        first. Modules added later add their own optional field here.
      required: [memberId, exportedAt, family, passport, moodCheckins, psychologistBookings, sessionNotes, planProgress]
      properties:
        memberId:
          type: string
          format: uuid
          description: The parent who exported.
        exportedAt:
          type: string
          format: date-time
        family:
          $ref: "#/components/schemas/Family"
        passport:
          $ref: "#/components/schemas/Passport"
        moodCheckins:
          type: array
          items:
            $ref: "#/components/schemas/MoodCheckin"
        psychologistBookings:
          type: array
          description: The acting parent's own bookings.
          items:
            $ref: "#/components/schemas/PsychologistBooking"
        sessionNotes:
          type: array
          description: The acting parent's own notes after sessions.
          items:
            $ref: "#/components/schemas/SessionNote"
        planProgress:
          type: array
          description: What the acting parent recorded on their plan items.
          items:
            $ref: "#/components/schemas/ExportedPlanProgress"

    ExportedPlanProgress:
      type: object
      required: [ruleId, status, updatedAt]
      properties:
        ruleId:
          type: string
        status:
          $ref: "#/components/schemas/PlanItemProgress"
        updatedAt:
          type: string
          format: date-time

    PassportPerson:
      type: object
      required: [id, kind, name, isActingParent, labs, vaccines, allergies, growth, careTeam, screenings, screeningOptions]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [parent, child]
        name:
          type: string
        role:
          $ref: "#/components/schemas/ParentRole"
        ageMonths:
          type: integer
          description: Set for the child.
        isActingParent:
          type: boolean
        labs:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/LabResult"
        vaccines:
          type: array
          description: Ordered by date, given or due.
          items:
            $ref: "#/components/schemas/VaccineDose"
        allergies:
          type: array
          items:
            $ref: "#/components/schemas/Allergy"
        growth:
          type: array
          description: Child only, oldest first. Empty for parents.
          items:
            $ref: "#/components/schemas/GrowthPoint"
        careTeam:
          type: array
          items:
            $ref: "#/components/schemas/CareTeamMember"
        screenings:
          type: array
          description: Screenings on record (lab records without a single value), newest first.
          items:
            $ref: "#/components/schemas/Screening"
        screeningOptions:
          type: array
          description: |
            The screening catalog for this person's stage, grouped, to pick from
            when logging. Ends with a group holding kind other (free text).
          items:
            $ref: "#/components/schemas/ScreeningOptionGroup"

    LabResult:
      type: object
      required: [id, name, value, unit, takenOn, visibility]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Ferritin
        value:
          type: number
        unit:
          type: string
          example: ng/mL
        refLow:
          type: number
          description: Lower end of the reference range, when the lab gives one.
        refHigh:
          type: number
          description: Upper end of the reference range, when the lab gives one.
        takenOn:
          type: string
          format: date
        visibility:
          $ref: "#/components/schemas/Visibility"
        flag:
          $ref: "#/components/schemas/LabFlag"

    LabFlag:
      type: object
      description: |
        Set only when the value is outside the reference range stored with the
        result (below refLow or above refHigh; a value equal to a bound is in
        range). Computed by the server from database state. The wording is
        fixed and never diagnostic: it only says to discuss the value with a
        doctor.
      required: [direction, message, basis, reason]
      properties:
        direction:
          type: string
          enum: [low, high]
        message:
          type: string
          example: Outside the usual range. Discuss with your doctor.
        basis:
          type: string
          description: Where the range comes from.
          example: Reference range reported with this lab result
        reason:
          type: string
          description: Why this value is flagged, as a sentence built from the value and the stored range. Never diagnostic.
          example: Because 24 ng/mL is below 30 to 100 ng/mL, the reference range entered with this result. The flag only compares the two numbers; it is not a diagnosis.

    VaccineKey:
      type: string
      description: The vaccine keys the rules read.
      enum: [tdap, td, flu, covid19, rsv, hepb, hepa, dtap, mmr, varicella, hib, pcv, ipv, rotavirus]

    ImmunizationInput:
      type: object
      required: [vaccine, givenOn]
      properties:
        childId:
          type: string
          format: uuid
          description: Set to log the dose for this child; leave out for the acting parent.
        vaccine:
          $ref: "#/components/schemas/VaccineKey"
        dose:
          type: string
          minLength: 1
          maxLength: 60
          example: Dose 1 of 5
        givenOn:
          type: string
          format: date
          description: Not in the future (400).

    ScreeningKind:
      type: string
      description: |
        A key from the screening catalog (PassportPerson.screeningOptions,
        api/internal/health/catalog.go), or other with a free-text name.
        The plan reads some keys: glucose_screen and gbs in pregnancy,
        vision_screen for a child.
      pattern: "^[a-z0-9_]{1,40}$"
      example: glucose_screen

    ScreeningInput:
      type: object
      required: [kind, takenOn, visibility]
      properties:
        childId:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ScreeningKind"
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Required when kind is other; ignored otherwise.
          example: Thyroid ultrasound
        takenOn:
          type: string
          format: date
          description: Not in the future (400).
        visibility:
          $ref: "#/components/schemas/Visibility"

    ScreeningEdit:
      type: object
      required: [kind, takenOn, visibility]
      properties:
        kind:
          $ref: "#/components/schemas/ScreeningKind"
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Required when kind is other; ignored otherwise.
        takenOn:
          type: string
          format: date
          description: Not in the future (400).
        visibility:
          $ref: "#/components/schemas/Visibility"

    ScreeningOption:
      type: object
      required: [kind, name]
      properties:
        kind:
          $ref: "#/components/schemas/ScreeningKind"
        name:
          type: string
          example: Glucose screening

    ScreeningOptionGroup:
      type: object
      description: A group of screenings commonly offered at one stage, to pick from when logging. A list to log against, not a recommendation.
      required: [label, options]
      properties:
        label:
          type: string
          example: Pregnancy
        options:
          type: array
          items:
            $ref: "#/components/schemas/ScreeningOption"

    Screening:
      type: object
      required: [id, kind, name, takenOn, visibility]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: The catalog name, or the free text for kind other.
          example: Glucose screening
        childId:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ScreeningKind"
        takenOn:
          type: string
          format: date
        visibility:
          $ref: "#/components/schemas/Visibility"

    LabResultInput:
      type: object
      required: [name, value, unit, takenOn, visibility]
      properties:
        childId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: Ferritin
        value:
          type: number
        unit:
          type: string
          minLength: 1
          maxLength: 20
          example: ng/mL
        refLow:
          type: number
        refHigh:
          type: number
        takenOn:
          type: string
          format: date
          description: Not in the future (400).
        visibility:
          $ref: "#/components/schemas/Visibility"

    VaccineStatus:
      type: string
      enum: [done, overdue, due, upcoming]

    VaccineDose:
      type: object
      required: [id, name, dose, status, visibility]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: DTaP
        dose:
          type: string
          example: Dose 2 of 5
        status:
          $ref: "#/components/schemas/VaccineStatus"
        givenOn:
          type: string
          format: date
          description: Set when status is done.
        dueOn:
          type: string
          format: date
          description: Set when status is not done.
        visibility:
          $ref: "#/components/schemas/Visibility"

    AllergyCertainty:
      type: string
      description: confirmed = diagnosed by a clinician; suspected = noticed at home, not yet tested.
      enum: [suspected, confirmed]

    Allergy:
      type: object
      required: [id, substance, certainty, visibility]
      properties:
        id:
          type: string
          format: uuid
        substance:
          type: string
          example: Peanut
        certainty:
          $ref: "#/components/schemas/AllergyCertainty"
        reaction:
          type: string
          example: Hives within minutes
        notedOn:
          type: string
          format: date
        visibility:
          $ref: "#/components/schemas/Visibility"

    GrowthPoint:
      type: object
      required: [id, measuredOn, ageMonths, ageDays, weightKg, heightCm]
      properties:
        id:
          type: string
          format: uuid
        measuredOn:
          type: string
          format: date
        ageMonths:
          type: integer
        ageDays:
          type: integer
          description: Days since birth on the visit day, for labelling the first weeks.
        weightKg:
          type: number
        heightCm:
          type: number
          description: Length lying down under 2 years, standing height after.
        headCm:
          type: number
          description: Head circumference, when it was measured.
        weightPercentile:
          type: integer
          minimum: 1
          maximum: 99
          description: Against the WHO or CDC chart for the child's age and sex, computed by the server.
        heightPercentile:
          type: integer
          minimum: 1
          maximum: 99

    GrowthMeasurementInput:
      type: object
      required: [childId, measuredOn, weightKg, heightCm]
      properties:
        childId:
          type: string
          format: uuid
        measuredOn:
          type: string
          format: date
        weightKg:
          type: number
          minimum: 0.3
          maximum: 80
        heightCm:
          type: number
          minimum: 20
          maximum: 200
        headCm:
          type: number
          minimum: 20
          maximum: 65

    CareRole:
      type: string
      enum: [obstetrician, pediatrician, primary_care, psychologist, lactation_consultant, midwife, dentist]

    CareTeamMember:
      type: object
      required: [id, name, role, clinic]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Dr. Maya Reyes
        role:
          $ref: "#/components/schemas/CareRole"
        clinic:
          type: string
        phone:
          type: string

    CareTeamInput:
      type: object
      required: [name, role]
      properties:
        childId:
          type: string
          format: uuid
          description: Set to add the clinician for this child; leave out for the acting parent.
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: Dr. Maya Reyes
        role:
          $ref: "#/components/schemas/CareRole"
        clinic:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 40

    CareTeamEdit:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        role:
          $ref: "#/components/schemas/CareRole"
        clinic:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 40

    AllergyInput:
      type: object
      required: [substance, certainty, visibility]
      properties:
        childId:
          type: string
          format: uuid
        substance:
          type: string
          minLength: 1
          maxLength: 80
          example: Peanut
        certainty:
          $ref: "#/components/schemas/AllergyCertainty"
        reaction:
          type: string
          maxLength: 160
        visibility:
          $ref: "#/components/schemas/Visibility"

    AllergyEdit:
      type: object
      required: [substance, certainty, visibility]
      properties:
        substance:
          type: string
          minLength: 1
          maxLength: 80
        certainty:
          $ref: "#/components/schemas/AllergyCertainty"
        reaction:
          type: string
          maxLength: 160
        visibility:
          $ref: "#/components/schemas/Visibility"

    LabResultEdit:
      type: object
      required: [name, value, unit, takenOn, visibility]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        value:
          type: number
        unit:
          type: string
          minLength: 1
          maxLength: 20
        refLow:
          type: number
          description: Leave out when the report gives no lower bound.
        refHigh:
          type: number
          description: Leave out when the report gives no upper bound.
        takenOn:
          type: string
          format: date
          description: Not in the future (400).
        visibility:
          $ref: "#/components/schemas/Visibility"

    ImmunizationEdit:
      type: object
      required: [vaccine, givenOn]
      properties:
        vaccine:
          $ref: "#/components/schemas/VaccineKey"
        dose:
          type: string
          minLength: 1
          maxLength: 60
        givenOn:
          type: string
          format: date
          description: Not in the future (400).

    AgendaTopic:
      type: object
      required: [id, text, addedAt]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          description: The topic the parent chose, never the entry text.
        addedAt:
          type: string
          format: date-time
        diaryEntryId:
          type: string
          format: uuid
          description: Set when the topic came from one of the parent's diary entries (DiaryEntry.agendaTopic).

    Psychologist:
      type: object
      required: [id, name, credentials, focus]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        credentials:
          type: string
          example: PhD, licensed clinical psychologist
        focus:
          type: string
          example: Perinatal and postpartum mental health

    PsychologistBooking:
      type: object
      required: [id, provider, startsAt, durationMinutes, noteWritten]
      properties:
        id:
          type: string
          format: uuid
        provider:
          $ref: "#/components/schemas/Psychologist"
        startsAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        noteWritten:
          type: boolean
          description: True once the parent has written a session note for this booking.

    PsychologistAgenda:
      type: object
      required: [topics]
      properties:
        topics:
          type: array
          description: |
            In the order the parent saved with updatePsychologistAgenda.
            Topics that appeared since then follow, oldest first; with no
            saved order the whole list is oldest first, so the
            longest-waiting topic is on top. Removed topics are left out.
          items:
            $ref: "#/components/schemas/AgendaTopic"
        nextSession:
          $ref: "#/components/schemas/PsychologistBooking"
        noteDue:
          allOf:
            - $ref: "#/components/schemas/PsychologistBooking"
          description: The latest session that has started and has no note yet.
        suggestions:
          type: array
          description: |
            Topics the parent might add, from themes that come up in two or
            more of their own diary entries of the last 7 days (sleep, the
            birth, work...). Computed from the acting parent's own entries
            only, whatever their visibility, and returned only to them.
            Wording names the theme, never quotes an entry. At most one,
            absent or empty when there is none. Adding one is
            updateDiaryEntry on diaryEntryId with agendaTopic = text.
          maxItems: 1
          items:
            $ref: "#/components/schemas/AgendaSuggestion"

    AgendaSuggestion:
      type: object
      required: [text, reason, diaryEntryId]
      properties:
        text:
          type: string
          example: Sleep lately
        reason:
          type: string
          description: Why it is suggested, counting entries only.
          example: You wrote about sleep in 2 entries this week.
        diaryEntryId:
          type: string
          format: uuid
          description: The newest of the parent's matching entries that has no agenda topic yet; the topic goes on this entry.

    PsychologistAgendaUpdate:
      type: object
      required: [topicIds]
      properties:
        topicIds:
          type: array
          description: Every topic to keep, in order. Leave a topic out to remove it.
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid

    Slot:
      type: object
      required: [id, startsAt, durationMinutes]
      properties:
        id:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer

    PsychologistSlots:
      type: object
      required: [provider, items]
      properties:
        provider:
          $ref: "#/components/schemas/Psychologist"
        items:
          type: array
          description: Earliest first.
          items:
            $ref: "#/components/schemas/Slot"

    PsychologistBookingInput:
      type: object
      required: [slotId]
      properties:
        slotId:
          type: string
          format: uuid

    SessionNoteInput:
      type: object
      required: [bookingId, text]
      properties:
        bookingId:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 1000

    SessionNote:
      type: object
      required: [id, bookingId, writtenAt, text]
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        writtenAt:
          type: string
          format: date-time
        text:
          type: string

    PersonRole:
      type: string
      description: Any person who can act in the family, parents and caregivers.
      enum: [mother, partner, grandparent, nanny]

    CaregiverPermission:
      type: string
      description: |
        What a grandparent or nanny may see or do; parents have all of
        these. Nothing else can be granted: a parent's diary, mood
        check-ins, labs, session notes, appointment questions, plans and
        booking requests are never visible to a caregiver.
        care_log = read and write feeds, sleep and diapers, give and take
        handoffs; baby_passport = the limited baby card (profile,
        pediatrician, allergies, emergency contacts, no medical history);
        schedule = their own shifts and events they attend in the calendar
        and Today; family_plan = the shared task list and tasks offered to
        them; pregnancy_updates = the weekly pregnancy card and pregnancy
        guides.
      enum: [care_log, baby_passport, schedule, family_plan, pregnancy_updates]

    FamilyUpdate:
      type: object
      minProperties: 1
      properties:
        stage:
          $ref: "#/components/schemas/Stage"
        dueDate:
          type: string
          format: date

    BabyArrivalInput:
      type: object
      required: [name, birthDate]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        birthDate:
          type: string
          format: date
          description: Today or up to 30 days ago; a future date is 400.

    Subscription:
      type: object
      required: [tier, status, startedAt]
      description: The family's paid plan. One subscription unlocks both parents.
      properties:
        tier:
          $ref: "#/components/schemas/PaidTier"
        status:
          $ref: "#/components/schemas/SubscriptionStatus"
        startedAt:
          type: string
          format: date-time
        currentPeriodEnd:
          type: string
          format: date-time

    SubscriptionStatus:
      type: string
      enum: [active, past_due, canceled]

    InvitationStatus:
      type: string
      description: expired is computed from expiresAt; accepted and revoked are stored.
      enum: [pending, accepted, revoked, expired]

    InvitationInput:
      type: object
      required: [role, displayName, permissions]
      properties:
        role:
          $ref: "#/components/schemas/CaregiverRole"
        displayName:
          type: string
          minLength: 1
          maxLength: 60
          example: Grandma Rose
        permissions:
          type: array
          uniqueItems: true
          description: |
            The toggles. The UI starts from the defaults per role: nanny
            care_log, baby_passport, schedule; grandparent the same plus
            pregnancy_updates.
          items:
            $ref: "#/components/schemas/CaregiverPermission"

    Invitation:
      type: object
      required: [id, role, displayName, permissions, status, invitedById, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/CaregiverRole"
        displayName:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/CaregiverPermission"
        status:
          $ref: "#/components/schemas/InvitationStatus"
        invitedById:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
          description: The caregiver created on accept. Set once accepted.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time

    CreatedInvitation:
      type: object
      required: [invitation, token, path]
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        token:
          type: string
          description: Returned only here; the server keeps only its hash.
        path:
          type: string
          description: Web path of the accept page, to put after the site origin.
          example: /invite/3q2-xS0...

    InvitationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/Invitation"

    InvitationPreview:
      type: object
      required: [role, displayName, permissions, status, invitedByName, expiresAt]
      properties:
        role:
          $ref: "#/components/schemas/CaregiverRole"
        displayName:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/CaregiverPermission"
        status:
          $ref: "#/components/schemas/InvitationStatus"
        invitedByName:
          type: string
          example: Emily
        expiresAt:
          type: string
          format: date-time

    InvitationAcceptance:
      type: object
      required: [family, memberId]
      properties:
        family:
          $ref: "#/components/schemas/Family"
        memberId:
          type: string
          format: uuid
          description: The new caregiver; act as this person.

    AccessLogEntry:
      type: object
      required: [id, actorName, action, entity, at]
      properties:
        id:
          type: string
        actorId:
          type: string
          format: uuid
          description: Absent when the person was removed.
        actorName:
          type: string
        actorRole:
          $ref: "#/components/schemas/PersonRole"
        action:
          type: string
          description: create, read, update, delete, accept or revoke.
          example: read
        entity:
          type: string
          description: snake_case entity name, as in the audit log.
          example: child_passport
        entityId:
          type: string
        at:
          type: string
          format: date-time

    AccessLogList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/AccessLogEntry"

    GuideKind:
      type: string
      description: article = stage content; birth_prep = a birth preparation module; loss_support = support after a pregnancy loss, returned only while Family.pregnancyLoss is set.
      enum: [article, birth_prep, loss_support]

    GuideAudience:
      type: string
      enum: [mother, partner, caregiver]

    Guide:
      type: object
      required: [id, kind, title, summary, steps, stages, audience, locked, source]
      properties:
        id:
          type: string
          description: Stable slug from the content catalog.
          example: birth-prep-breathing
        kind:
          $ref: "#/components/schemas/GuideKind"
        title:
          type: string
        summary:
          type: string
        steps:
          type: array
          description: The body as short steps or paragraphs.
          items:
            type: string
        minutes:
          type: integer
          description: Time to read or practice.
        stages:
          type: array
          items:
            $ref: "#/components/schemas/Stage"
        weekFrom:
          type: integer
          description: First gestational week it applies to (pregnancy content).
        weekTo:
          type: integer
        ageMonthsFrom:
          type: integer
          description: First child age in months it applies to (after birth).
        ageMonthsTo:
          type: integer
        audience:
          type: array
          items:
            $ref: "#/components/schemas/GuideAudience"
        locked:
          type: boolean
          description: True for birth prep before week 32.
        unlocksAtWeek:
          type: integer
          example: 32
        source:
          $ref: "#/components/schemas/Source"
        ruleId:
          type: string
          description: The plan rule this guide explains, same format as PlanItem.ruleId. Absent when no rule covers it. A guide whose rule is already a plan item is not shown again as a lesson.
