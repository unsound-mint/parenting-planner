openapi: 3.0.3
info:
  title: Parenting Planner API
  version: 0.1.0
  description: |
    Contract between web/ and api/. Both sides generate code from this file
    (`make gen`); never edit generated code by hand. Change this file first,
    in its own PR or together with both implementations.

    Auth: there is no login. POST /demo/sessions creates a demo family and
    sets an httpOnly session cookie that scopes every other call to that family.
servers:
  - url: /api
security:
  - session: []
tags:
  - name: demo
  - name: family
  - name: plan
  - name: wellbeing
  - name: directory
  - name: passport

  - name: care
  - name: invitations
paths:
  /healthz:
    get:
      operationId: healthz
      security: []
      responses:
        "200":
          description: The API and its database are up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /demo/sessions:
    post:
      operationId: createDemoSession
      tags: [demo]
      security: []
      summary: Start a demo with a fresh copy of a synthetic family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDemoSessionRequest"
      responses:
        "201":
          description: Family created; the session cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /demo/reset:
    post:
      operationId: resetDemo
      tags: [demo]
      summary: Replace the session's family with a fresh seeded copy
      description: Seeds a new copy from the same template, switches the session cookie to it and deletes the old copy. Invitations, tasks and check-ins made so far are gone.
      responses:
        "201":
          description: Fresh family; the session cookie is replaced.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family:
    get:
      operationId: getFamily
      tags: [family]
      summary: The family of the current session, with parents, caregivers and children
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family/upgrade-intents:
    post:
      operationId: createUpgradeIntent
      tags: [family]
      summary: Record that the family wants a paid plan
      description: |
        There are no payments. This stores which tier the family asked for and
        when; it shows as "upgrade requested" on the family. Either parent of the
        session's family may send it. A second request replaces the first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeIntentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeIntent"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/plan:
    get:
      operationId: getMemberPlan
      tags: [plan]
      summary: This week's plan for one parent
      description: |
        Items come from the guideline rules engine, evaluated against the family
        data this parent is allowed to see. Each item says why it applies and
        cites its source.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/weekly-plan:
    get:
      operationId: getMemberWeeklyPlan
      tags: [plan]
      summary: A short written plan for this parent's week
      description: |
        A note written for the acting parent from the data they may see: their
        due plan items, their own recent mood and sleep, diary topics the
        partner shared with them, and the family's stage. The other parent
        gets a different plan. Private records (diary, mood, labs, session
        notes) that were not shared with this parent never feed it. The text
        never diagnoses. Urgent symptoms and self-harm mentions are not
        written here; they go to the fixed urgent-help screen. When the AI
        call fails, fallback is true and the sections are built from the rule
        plan.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyPlan"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/passport:
    get:
      operationId: getPassport
      tags: [passport]
      summary: The health passport of the family as the acting parent may see it
      description: |
        One entry per person: the acting parent, the other parent and the
        child (when there is one). The acting parent sees all of their own
        records and everything recorded for the child. For the other parent
        only records shared with the acting parent come back (visibility
        partner or family, the rule in access.CanParentRead); private and
        care_team records are left out, and their count is not revealed.
        Reading labs and allergies is audited like any sensitive read.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passport"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/plan/{ruleId}/status:
    put:
      operationId: setPlanItemProgress
      tags: [plan]
      summary: The acting parent marks a plan item as booked or done
      description: |
        Records progress on one plan item for this parent. A booked or done item
        stays on the plan, shown as settled, so nothing disappears unseen.
      parameters:
        - $ref: "#/components/parameters/MemberId"
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
          example: glucose-screen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanItemProgressInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanItem"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/mood-checkins:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    post:
      operationId: createMoodCheckin
      tags: [wellbeing]
      summary: The acting parent records how they feel today
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoodCheckinInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoodCheckin"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listMoodCheckins
      tags: [wellbeing]
      summary: Check-ins from the last 30 days that the acting parent may see
      description: Their own check-ins plus the other parent's check-ins shared with them.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoodCheckinList"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /members/{memberId}/invitations:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    post:
      operationId: createInvitation
      tags: [invitations]
      summary: A parent invites a grandparent or nanny; the response holds the one-time token
      description: No email is sent in the demo. The web app builds the link from the token. The token is returned only here and expires after 7 days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listInvitations
      tags: [invitations]
      summary: Invitations of the family, newest first (no tokens)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/MemberId"
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: revokeInvitation
      tags: [invitations]
      summary: Revoke an invitation that has not been accepted
      responses:
        "204":
          description: Revoked
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [invitations]
      security: []
      summary: Accept an invitation with its token
      description: Creates the caregiver and sets the session cookie for the family. A token works once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "201":
          description: Accepted; the session cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Caregiver"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Expired, revoked or already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /providers:
    get:
      operationId: listProviders
      tags: [directory]
      summary: Providers in the ecosystem directory, optionally filtered
      description: |
        Every provider is synthetic demo data. The directory is the same for
        every family and holds no personal records, so any parent in the session
        may read it. Sorted by next available date, soonest first.
      parameters:
        - name: type
          in: query
          required: false
          description: Only providers of this type.
          schema:
            $ref: "#/components/schemas/ProviderType"
        - name: state
          in: query
          required: false
          description: Only providers licensed in this US state (two-letter code).
          schema:
            $ref: "#/components/schemas/UsState"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderList"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/booking-requests:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    post:
      operationId: createBookingRequest
      tags: [directory]
      summary: The acting parent asks a provider for an appointment
      description: |
        Saves a request with status requested; nothing is sent to a real
        provider. A request is sensitive: it can reveal that a parent is seeking
        care, so only the parent who made it can see it, never the partner.
        Asking the same provider twice returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingRequestInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingRequest"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listBookingRequests
      tags: [directory]
      summary: The acting parent's own booking requests
      description: Only requests made by this parent, newest first. The partner's requests are never included.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingRequestList"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/mood-patterns:
    get:
      operationId: listMoodPatterns
      tags: [wellbeing]
      summary: Patterns detected in the acting parent's own recent check-ins
      description: |
        Detected from the acting parent's own check-ins of the last 7 days, for
        example low mood on three days. Check-ins are private by default, so a
        pattern is computed only from the acting parent's own entries and is
        returned only to them. Nothing from the other parent's check-ins is
        used, even when those were shared. Empty list when there is no pattern.
        Wording is never diagnostic (docs/product.md, principle 3).
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoodPatternList"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/psychologist-agenda:
    get:
      operationId: getPsychologistAgenda
      tags: [care]
      summary: Topics for the acting parent's next psychologist session
      description: |
        Topics only, as the parent chose them. Private text such as diary
        entries is never part of the agenda. The agenda belongs to the acting parent: the other parent can neither read
        it nor see that a session is booked.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PsychologistAgenda"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/psychologist-slots:
    get:
      operationId: listPsychologistSlots
      tags: [care]
      summary: Open session times with the demo psychologist, next 14 days
      description: |
        Synthetic provider and slots; there is no real provider integration.
        Slots already booked by the acting parent are left out. Booking
        availability is not shared between parents.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PsychologistSlots"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/psychologist-bookings:
    post:
      operationId: createPsychologistBooking
      tags: [care]
      summary: The acting parent books one open slot
      description: |
        The booking is stored for the acting parent only and is private to them.
        Returns 409 slot_taken if the slot is gone.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PsychologistBookingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PsychologistBooking"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/session-notes:
    post:
      operationId: createSessionNote
      tags: [care]
      summary: The acting parent writes a short note after a session
      description: |
        Always private to the author; there is no visibility field and the
        server never widens it. The note feeds the author's next weekly plan.
        The booking must belong to the acting parent and must have started.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionNoteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionNote"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    MemberId:
      name: memberId
      in: path
      required: true
      description: |
        The acting parent. There is no login, so the UI says which parent is
        using the app; the API checks that this parent belongs to the session's family.
      schema:
        type: string
        format: uuid

  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: pp_session


  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: not_found
        message:
          type: string

    DemoTemplate:
      type: string
      description: Which synthetic family to copy. Add a value here when its seed exists.
      enum: [pregnancy]

    CreateDemoSessionRequest:
      type: object
      required: [template]
      properties:
        template:
          $ref: "#/components/schemas/DemoTemplate"

    Stage:
      type: string
      description: Where the family is on the journey from planning to age 9.
      enum: [planning, trying, pregnancy, postpartum, infant, toddler, preschool, school_age]

    ParentRole:
      type: string
      enum: [mother, partner]

    Tier:
      type: string
      description: The plan the family is on. Demo families start on free; there is no billing.
      enum: [free, plus, concierge]

    PaidTier:
      type: string
      enum: [plus, concierge]

    UpgradeIntentInput:
      type: object
      required: [tier]
      properties:
        tier:
          $ref: "#/components/schemas/PaidTier"

    UpgradeIntent:
      type: object
      required: [tier, requestedAt]
      properties:
        tier:
          $ref: "#/components/schemas/PaidTier"
        requestedAt:
          type: string
          format: date-time

    Family:
      type: object
      required: [id, template, stage, parents, caregivers, children]
      properties:
        id:
          type: string
          format: uuid
        template:
          $ref: "#/components/schemas/DemoTemplate"
        stage:
          $ref: "#/components/schemas/Stage"
        dueDate:
          type: string
          format: date
          description: Set during pregnancy.
        gestationalWeek:
          type: integer
          description: Completed weeks of pregnancy today, derived from dueDate.
        tier:
          $ref: "#/components/schemas/Tier"
        upgradeRequest:
          $ref: "#/components/schemas/UpgradeIntent"
        parents:
          type: array
          items:
            $ref: "#/components/schemas/Parent"
        caregivers:
          type: array
          description: |
            Other people who help with the child and can be opened as their own
            view (the demo role switcher). Empty when the family has none.
          items:
            $ref: "#/components/schemas/Caregiver"
        children:
          type: array
          items:
            $ref: "#/components/schemas/Child"

    Parent:
      type: object
      required: [id, role, displayName]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ParentRole"
        displayName:
          type: string

    CaregiverRole:
      type: string
      description: |
        What each person may see. mother and partner see everything their own
        data and the sharing rules allow. A grandparent or nanny sees the baby's
        care: the child's schedule, feeding, sleep, visits and milestones, and
        what the parents chose to share for the family. They never see a
        parent's health data (labs, mood check-ins, diary, session notes) and
        cannot create or change those records.
      enum: [grandparent, nanny]

    CaregiverPermission:
      type: string
      description: What a caregiver may see. The parents choose these when they invite.
      enum: [feeding, sleep, allergies, schedule, visits, milestones]

    InvitationInput:
      type: object
      required: [role, displayName, permissions]
      properties:
        role:
          $ref: "#/components/schemas/CaregiverRole"
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CaregiverPermission"

    Invitation:
      type: object
      required: [id, role, displayName, permissions, status, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/CaregiverRole"
        displayName:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/CaregiverPermission"
        status:
          type: string
          enum: [pending, accepted, revoked, expired]
        expiresAt:
          type: string
          format: date-time
        token:
          type: string
          description: Only in the response to createInvitation.

    InvitationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"

    AcceptInvitationRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200

    Caregiver:
      type: object
      required: [id, role, displayName]
      properties:
        id:
          type: string
          format: uuid
          description: Used in /family/{id} on the web side, like a parent id.
        role:
          $ref: "#/components/schemas/CaregiverRole"
        displayName:
          type: string
        permissions:
          type: array
          description: What this caregiver may see.
          items:
            $ref: "#/components/schemas/CaregiverPermission"

    Child:
      type: object
      required: [id, name, birthDate, ageMonths]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        birthDate:
          type: string
          format: date
        ageMonths:
          type: integer

    Plan:
      type: object
      required: [memberId, generatedAt, items]
      properties:
        memberId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
        items:
          type: array
          description: Sorted by status (overdue, due, upcoming), then due date.
          items:
            $ref: "#/components/schemas/PlanItem"

    PlanItemStatus:
      type: string
      enum: [overdue, due, upcoming]

    PlanCategory:
      type: string
      enum: [screening, vaccine, visit, mental_health, logistics, couple, learning]

    PlanItem:
      type: object
      required: [ruleId, title, detail, status, category, reason, source]
      properties:
        ruleId:
          type: string
          example: glucose-screen
        title:
          type: string
        detail:
          type: string
          description: What to do, in plain language.
        status:
          $ref: "#/components/schemas/PlanItemStatus"
        category:
          $ref: "#/components/schemas/PlanCategory"
        dueBy:
          type: string
          format: date
        reason:
          type: string
          description: Why this applies to this parent now, based on their data.
        source:
          $ref: "#/components/schemas/Source"
        progress:
          $ref: "#/components/schemas/PlanItemProgress"

    PlanItemProgress:
      type: string
      description: What the parent has done about an item. Absent until they record something.
      enum: [booked, done]

    PlanItemProgressInput:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/PlanItemProgress"

    WeeklyPlan:
      type: object
      required: [memberId, generatedAt, fallback, intro, sections]
      properties:
        memberId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
        fallback:
          type: boolean
          description: True when the rule-based plan was used because the AI call failed.
        intro:
          type: string
          description: One or two warm sentences that open the note.
        sections:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyPlanSection"

    WeeklyPlanSection:
      type: object
      required: [title, points]
      properties:
        title:
          type: string
          example: For you
        points:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyPlanPoint"

    WeeklyPlanPoint:
      type: object
      required: [text, reason]
      properties:
        text:
          type: string
          description: What to do, in one or two plain sentences. Never a diagnosis. Any medical point must carry a source.
        reason:
          type: string
          description: The data behind the point, for example "You slept 5.5 hours on average this week."
        ruleId:
          type: string
          description: The rule plan item this point comes from, when it has one.
        source:
          $ref: "#/components/schemas/Source"

    Source:
      type: object
      required: [title, url, checkedAt]
      properties:
        title:
          type: string
        url:
          type: string
        checkedAt:
          type: string
          format: date
          description: When someone last confirmed the guideline still says this.

    Visibility:
      type: string
      description: |
        Who besides the author may see a sensitive record.
        private = author only; partner = author and the other parent;
        care_team = author and their professionals, not the partner; family = both parents.
      enum: [private, partner, care_team, family]

    MoodCheckinInput:
      type: object
      required: [mood, energy, sleepHours, visibility]
      properties:
        mood:
          type: integer
          minimum: 1
          maximum: 5
          description: 1 = very low, 5 = very good.
        energy:
          type: integer
          minimum: 1
          maximum: 5
        sleepHours:
          type: number
          minimum: 0
          maximum: 24
          description: Hours slept in the last 24 hours.
        note:
          type: string
          maxLength: 500
        visibility:
          $ref: "#/components/schemas/Visibility"

    MoodCheckin:
      type: object
      required: [id, authorId, recordedAt, mood, energy, sleepHours, visibility]
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        recordedAt:
          type: string
          format: date-time
        mood:
          type: integer
        energy:
          type: integer
        sleepHours:
          type: number
        note:
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"

    MoodCheckinList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/MoodCheckin"

    MoodPatternKind:
      type: string
      description: |
        low_mood = mood at or below 2 on several days; low_mood_and_sleep = the
        same days also had under 6 hours of sleep.
      enum: [low_mood, low_mood_and_sleep]

    MoodPattern:
      type: object
      required: [kind, startedOn, days, checkinIds, message, providerType, source]
      properties:
        kind:
          $ref: "#/components/schemas/MoodPatternKind"
        startedOn:
          type: string
          format: date
          description: Date of the first check-in in the pattern.
        days:
          type: integer
          description: Number of check-in days in the pattern.
        checkinIds:
          type: array
          description: The acting parent's check-ins that make up the pattern, oldest first.
          items:
            type: string
            format: uuid
        message:
          type: string
          description: Plain, kind and non-diagnostic. Describes what the check-ins show and suggests talking to someone.
        providerType:
          $ref: "#/components/schemas/ProviderType"
        source:
          $ref: "#/components/schemas/Source"

    MoodPatternList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MoodPattern"


    ProviderType:
      type: string
      description: What kind of care the provider offers.
      enum: [perinatal_therapist, psychologist, doula, lactation_consultant, sleep_consultant, child_therapist, tutor]

    UsState:
      type: string
      description: Two-letter US state code.
      pattern: "^[A-Z]{2}$"
      example: CA

    Provider:
      type: object
      required: [id, name, type, city, state, languages, nextAvailable, priceUsd, summary]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: "#/components/schemas/ProviderType"
        city:
          type: string
        state:
          $ref: "#/components/schemas/UsState"
        languages:
          type: array
          items:
            type: string
          example: [English, Spanish]
        nextAvailable:
          type: string
          format: date
        priceUsd:
          type: integer
          description: Price of one session in US dollars.
        summary:
          type: string
          description: One plain sentence on what this provider helps with.

    ProviderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Provider"

    BookingRequestInput:
      type: object
      required: [providerId]
      properties:
        providerId:
          type: string
          format: uuid
        note:
          type: string
          maxLength: 500
          description: Optional message for the provider.

    BookingRequestStatus:
      type: string
      description: Only requested exists for now; the demo never confirms a booking.
      enum: [requested]

    BookingRequest:
      type: object
      required: [id, memberId, providerId, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
          description: The parent who made the request.
        providerId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/BookingRequestStatus"
        note:
          type: string
        createdAt:
          type: string
          format: date-time

    BookingRequestList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/BookingRequest"

    Passport:
      type: object
      required: [memberId, people]
      properties:
        memberId:
          type: string
          format: uuid
          description: The acting parent.
        people:
          type: array
          description: The acting parent first, then the other parent, then the child.
          items:
            $ref: "#/components/schemas/PassportPerson"

    PassportPerson:
      type: object
      required: [id, kind, name, isActingParent, labs, vaccines, allergies, growth, careTeam]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [parent, child]
        name:
          type: string
        role:
          $ref: "#/components/schemas/ParentRole"
        ageMonths:
          type: integer
          description: Set for the child.
        isActingParent:
          type: boolean
        labs:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/LabResult"
        vaccines:
          type: array
          description: Ordered by date, given or due.
          items:
            $ref: "#/components/schemas/VaccineDose"
        allergies:
          type: array
          items:
            $ref: "#/components/schemas/Allergy"
        growth:
          type: array
          description: Child only, oldest first. Empty for parents.
          items:
            $ref: "#/components/schemas/GrowthPoint"
        careTeam:
          type: array
          items:
            $ref: "#/components/schemas/CareTeamMember"

    LabResult:
      type: object
      required: [id, name, value, unit, takenOn, visibility]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Ferritin
        value:
          type: number
        unit:
          type: string
          example: ng/mL
        refLow:
          type: number
          description: Lower end of the reference range, when the lab gives one.
        refHigh:
          type: number
          description: Upper end of the reference range, when the lab gives one.
        takenOn:
          type: string
          format: date
        visibility:
          $ref: "#/components/schemas/Visibility"

    VaccineStatus:
      type: string
      enum: [done, overdue, due, upcoming]

    VaccineDose:
      type: object
      required: [id, name, dose, status, visibility]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: DTaP
        dose:
          type: string
          example: Dose 2 of 5
        status:
          $ref: "#/components/schemas/VaccineStatus"
        givenOn:
          type: string
          format: date
          description: Set when status is done.
        dueOn:
          type: string
          format: date
          description: Set when status is not done.
        visibility:
          $ref: "#/components/schemas/Visibility"

    AllergyCertainty:
      type: string
      description: confirmed = diagnosed by a clinician; suspected = noticed at home, not yet tested.
      enum: [suspected, confirmed]

    Allergy:
      type: object
      required: [id, substance, certainty, visibility]
      properties:
        id:
          type: string
          format: uuid
        substance:
          type: string
          example: Peanut
        certainty:
          $ref: "#/components/schemas/AllergyCertainty"
        reaction:
          type: string
          example: Hives within minutes
        notedOn:
          type: string
          format: date
        visibility:
          $ref: "#/components/schemas/Visibility"

    GrowthPoint:
      type: object
      required: [measuredOn, ageMonths, weightKg, heightCm]
      properties:
        measuredOn:
          type: string
          format: date
        ageMonths:
          type: integer
        weightKg:
          type: number
        heightCm:
          type: number
        weightPercentile:
          type: integer
          minimum: 1
          maximum: 99
          description: Against the WHO or CDC chart for the child's age and sex, computed by the server.
        heightPercentile:
          type: integer
          minimum: 1
          maximum: 99

    CareRole:
      type: string
      enum: [obstetrician, pediatrician, primary_care, psychologist, lactation_consultant, midwife, dentist]

    CareTeamMember:
      type: object
      required: [id, name, role, clinic]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Dr. Maya Reyes
        role:
          $ref: "#/components/schemas/CareRole"
        clinic:
          type: string
        phone:
          type: string

    AgendaTopic:
      type: object
      required: [id, text, addedAt]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          description: The topic the parent chose, never the entry text.
        addedAt:
          type: string
          format: date-time

    Psychologist:
      type: object
      required: [id, name, credentials, focus]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        credentials:
          type: string
          example: PhD, licensed clinical psychologist
        focus:
          type: string
          example: Perinatal and postpartum mental health

    PsychologistBooking:
      type: object
      required: [id, provider, startsAt, durationMinutes, noteWritten]
      properties:
        id:
          type: string
          format: uuid
        provider:
          $ref: "#/components/schemas/Psychologist"
        startsAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        noteWritten:
          type: boolean
          description: True once the parent has written a session note for this booking.

    PsychologistAgenda:
      type: object
      required: [topics]
      properties:
        topics:
          type: array
          description: Oldest first, so the longest-waiting topic is on top.
          items:
            $ref: "#/components/schemas/AgendaTopic"
        nextSession:
          $ref: "#/components/schemas/PsychologistBooking"
        noteDue:
          allOf:
            - $ref: "#/components/schemas/PsychologistBooking"
          description: The latest session that has started and has no note yet.

    Slot:
      type: object
      required: [id, startsAt, durationMinutes]
      properties:
        id:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer

    PsychologistSlots:
      type: object
      required: [provider, items]
      properties:
        provider:
          $ref: "#/components/schemas/Psychologist"
        items:
          type: array
          description: Earliest first.
          items:
            $ref: "#/components/schemas/Slot"

    PsychologistBookingInput:
      type: object
      required: [slotId]
      properties:
        slotId:
          type: string
          format: uuid

    SessionNoteInput:
      type: object
      required: [bookingId, text]
      properties:
        bookingId:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 1000

    SessionNote:
      type: object
      required: [id, bookingId, writtenAt, text]
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        writtenAt:
          type: string
          format: date-time
        text:
          type: string
