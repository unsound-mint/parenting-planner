                $ref: "#/components/schemas/Error"

components:
  parameters:
    MemberId:
      name: memberId
      in: path
      required: true
      description: |
        The acting person. There is no login, so the UI says who is using
        the app; the API checks that this person belongs to the session's
        family. Usually a parent (mother or partner). A grandparent or nanny
        id (family.caregivers) is accepted only where the operation says so:
        operations written for parents return 404 for a caregiver id, and
        operations open to caregivers return 403 forbidden when their role
        or permissions do not allow the action.
      schema:
        type: string
        format: uuid

    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    InvitationToken:
      name: token
      in: path
      required: true
      description: The secret from the invitation link.
      schema:
        type: string
        minLength: 16
        maxLength: 128

    RoundId:
      name: roundId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    FeedToken:
      name: token
      in: path
      required: true
      description: The secret from a calendar subscription link.
      schema:
        type: string
        minLength: 16
        maxLength: 128

    OfferId:
      name: offerId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: pp_session


  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: not_found
        message:
          type: string

    DemoTemplate:
      type: string
      description: "Which synthetic family to copy: planning (trying for a first baby), pregnancy (second trimester), newborn (baby about 7 weeks old), preschool (child aged 4). Add a value here when its seed exists. `custom` marks a family built from the visitor's own details (createCustomSession); createDemoSession rejects it with 400."
      enum: [planning, pregnancy, newborn, preschool, custom]

    CreateDemoSessionRequest:
      type: object
      required: [template]
      properties:
        template:
          $ref: "#/components/schemas/DemoTemplate"

    CustomFamilyInput:
      type: object
      required: [stage, motherName, partnerName]
      properties:
        stage:
          $ref: "#/components/schemas/Stage"
        dueDate:
          type: string
          format: date
          description: Required for pregnancy.
        childBirthDate:
          type: string
          format: date
          description: Required once the child is born (postpartum and later).
        childName:
          type: string
          minLength: 1
          maxLength: 40
          description: Optional; "Baby" when left out.
        motherName:
          type: string
          minLength: 1
          maxLength: 40
        partnerName:
          type: string
          minLength: 1
          maxLength: 40

    Stage:
      type: string
      description: Where the family is on the journey from planning to age 9.
      enum: [planning, trying, pregnancy, postpartum, infant, toddler, preschool, school_age]

    ParentRole:
      type: string
      enum: [mother, partner]

    Tier:
      type: string
      description: |
        The plan the family is on, for both parents. Demo families start on
        free; a completed Stripe test checkout sets it (see subscription).
      enum: [free, plus, concierge]

    PaidTier:
      type: string
      enum: [plus, concierge]

    UpgradeIntentInput:
      type: object
      required: [tier]
      properties:
        tier:
          $ref: "#/components/schemas/PaidTier"

    UpgradeIntent:
      type: object
      required: [tier, requestedAt]
      properties:
        tier:
          $ref: "#/components/schemas/PaidTier"
        requestedAt:
          type: string
          format: date-time

    Family:
      type: object
      required: [id, template, stage, parents, caregivers, children]
      properties:
        id:
          type: string
          format: uuid
        template:
          $ref: "#/components/schemas/DemoTemplate"
        demoDaysAhead:
          type: integer
          minimum: 0
          description: |
            Days this family's demo clock has been skipped ahead of the real
            date (createDemoTimeSkip). Absent or 0 means real time; anything else must be
            shown as demo time.
        stage:
          $ref: "#/components/schemas/Stage"
        dueDate:
          type: string
          format: date
          description: Set during pregnancy.
        gestationalWeek:
          type: integer
          description: Completed weeks of pregnancy today, derived from dueDate.
        tier:
          $ref: "#/components/schemas/Tier"
        subscription:
          $ref: "#/components/schemas/Subscription"
        upgradeRequest:
          $ref: "#/components/schemas/UpgradeIntent"
        pregnancyLoss:
          $ref: "#/components/schemas/PregnancyLoss"
        parents:
          type: array
          items:
            $ref: "#/components/schemas/Parent"
        caregivers:
          type: array
          description: |
            Other people who help with the child and can be opened as their own
            view (the demo role switcher). Empty when the family has none.
          items:
            $ref: "#/components/schemas/Caregiver"
        children:
          type: array
          items:
            $ref: "#/components/schemas/Child"

    Parent:
      type: object
      required: [id, role, displayName]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ParentRole"
        displayName:
          type: string

    CaregiverRole:
      type: string
      description: |
        What each person may see. mother and partner see everything their own
        data and the sharing rules allow. A grandparent or nanny sees the baby's
        care: the child's schedule, feeding, sleep, visits and milestones, and
        what the parents chose to share for the family. They never see a
        parent's health data (labs, mood check-ins, diary, session notes) and
        cannot create or change those records.
      enum: [grandparent, nanny]

    Caregiver:
      type: object
      required: [id, role, displayName, permissions]
      properties:
        id:
          type: string
          format: uuid
          description: Used in /family/{id} on the web side, like a parent id.
        role:
          $ref: "#/components/schemas/CaregiverRole"
        displayName:
          type: string
        permissions:
          type: array
          description: What this caregiver was granted; the web hides navigation they may not use.
          items:
            $ref: "#/components/schemas/CaregiverPermission"

    Child:
      type: object
      required: [id, name, birthDate, ageMonths]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        birthDate:
          type: string
          format: date
        ageMonths:
          type: integer

    Plan:
      type: object
      required: [memberId, generatedAt, items]
      properties:
        memberId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
        items:
          type: array
          description: Sorted by status (overdue, due, upcoming), then due date.
          items:
            $ref: "#/components/schemas/PlanItem"

    JourneyStage:
      type: string
      description: |
        A step on the timeline shown to parents, from planning to age 9. Finer
        than the family's stored Stage: birth, newborn and first year are
        separate steps.
      enum: [planning, pregnancy, birth, newborn, first_year, toddler, preschool, school_age]

    JourneySpanStatus:
      type: string
      enum: [past, current, future]

    JourneySpan:
      type: object
      required: [stage, status]
      properties:
        stage:
          $ref: "#/components/schemas/JourneyStage"
        status:
          $ref: "#/components/schemas/JourneySpanStatus"
        startsOn:
          type: string
          format: date
          description: First day of this stage for this family. Absent when no due date or birth date fixes it (planning families).
        endsOn:
          type: string
          format: date
          description: Last day of this stage for this family. Absent when unknown. Birth is a single day, so startsOn equals endsOn.

    JourneyPosition:
      type: object
      description: The "you are here" marker. Numbers only; the web formats them.
      required: [stage]
      properties:
        stage:
          $ref: "#/components/schemas/JourneyStage"
        gestationalWeek:
          type: integer
          description: Set in pregnancy; the same value as Family.gestationalWeek.
        childId:
          type: string
          format: uuid
          description: Set after birth; the youngest child, whose age places the family.
        childAgeWeeks:
          type: integer
          description: Set after birth; completed weeks since the youngest child's birth.
        childAgeMonths:
          type: integer
          description: Set after birth; the same value as Child.ageMonths.

    Journey:
      type: object
      required: [memberId, generatedAt, current, stages, upcoming]
      properties:
        memberId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
        current:
          $ref: "#/components/schemas/JourneyPosition"
        stages:
          type: array
          description: All eight stages in order, from planning to school age (to age 9).
          items:
            $ref: "#/components/schemas/JourneySpan"
        upcoming:
          type: array
          description: The next things for this parent, from the rules engine, most urgent first. Up to 5; fewer when the rules have less to say at this stage.
          maxItems: 5
          items:
            $ref: "#/components/schemas/PlanItem"

    PlanItemStatus:
      type: string
      enum: [overdue, due, upcoming]

    PlanCategory:
      type: string
      enum: [screening, vaccine, visit, mental_health, logistics, couple, learning]

    PlanItem:
      type: object
      required: [ruleId, title, detail, status, category, reason, source]
      properties:
        ruleId:
          type: string
          example: glucose-screen
        title:
          type: string
        detail:
          type: string
          description: What to do, in plain language.
        status:
          $ref: "#/components/schemas/PlanItemStatus"
        category:
          $ref: "#/components/schemas/PlanCategory"
        dueBy:
          type: string
          format: date
        reason:
          type: string
          description: Why this applies to this parent now, based on their data.
        source:
          $ref: "#/components/schemas/Source"
        progress:
          $ref: "#/components/schemas/PlanItemProgress"

    PlanItemProgress:
      type: string
      description: What the parent has done about an item. Absent until they record something.
      enum: [booked, done]

    PlanItemProgressInput:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/PlanItemProgress"

    WeeklyPlan:
      type: object
      required: [memberId, generatedAt, fallback, intro, sections]
      properties:
        memberId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
        fallback:
          type: boolean
          description: True when the rule-based plan was used because the AI call failed.
        intro:
          type: string
          description: One or two warm sentences that open the note.
        sections:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyPlanSection"

    WeeklyPlanSection:
      type: object
      required: [title, points]
      properties:
        title:
          type: string
          example: For you
        points:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyPlanPoint"

    WeeklyPlanPoint:
      type: object
      required: [text, reason]
      properties:
        text:
          type: string
          description: What to do, in one or two plain sentences. Never a diagnosis. Any medical point must carry a source.
        reason:
          type: string
          description: The data behind the point, for example "You slept 5.5 hours on average this week."
        ruleId:
          type: string
          description: The rule plan item this point comes from, when it has one.
        source:
          $ref: "#/components/schemas/Source"

    Source:
      type: object
      required: [title, url, checkedAt]
      properties:
        title:
          type: string
        url:
          type: string
        checkedAt:
          type: string
          format: date
          description: When someone last confirmed the guideline still says this.

    Visibility:
      type: string
      description: |
        Who besides the author may see a sensitive record.
        private = author only; partner = author and the other parent;
        care_team = author and their professionals, not the partner; family = both parents.
      enum: [private, partner, care_team, family]

    MoodCheckinInput:
      type: object
      required: [mood, energy, sleepHours, visibility]
      properties:
        mood:
          type: integer
          minimum: 1
          maximum: 5
          description: 1 = very low, 5 = very good.
        energy:
          type: integer
          minimum: 1
          maximum: 5
        sleepHours:
          type: number
          minimum: 0
          maximum: 24
          description: Hours slept in the last 24 hours.
        note:
          type: string
          maxLength: 500
        visibility:
          $ref: "#/components/schemas/Visibility"

    MoodCheckin:
      type: object
      required: [id, authorId, recordedAt, mood, energy, sleepHours, visibility]
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        recordedAt:
          type: string
          format: date-time
        mood:
          type: integer
        energy:
          type: integer
        sleepHours:
          type: number
        note:
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"

    MoodCheckinList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/MoodCheckin"

    MoodPatternKind:
      type: string
      description: |
        low_mood = mood at or below 2 on several days; low_mood_and_sleep = the
        same days also had under 6 hours of sleep.
      enum: [low_mood, low_mood_and_sleep]

    MoodPattern:
      type: object
      required: [kind, startedOn, days, checkinIds, message, providerType, source]
      properties:
        kind:
          $ref: "#/components/schemas/MoodPatternKind"
        startedOn:
          type: string
          format: date
          description: Date of the first check-in in the pattern.
        days:
          type: integer
          description: Number of check-in days in the pattern.
        checkinIds:
          type: array
          description: The acting parent's check-ins that make up the pattern, oldest first.
          items:
            type: string
            format: uuid
        message:
          type: string
          description: Plain, kind and non-diagnostic. Describes what the check-ins show and suggests talking to someone.
        providerType:
          $ref: "#/components/schemas/ProviderType"
        source:
          $ref: "#/components/schemas/Source"

    MoodPatternList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MoodPattern"


    ProviderType:
      type: string
      description: What kind of care the provider offers.
      enum: [perinatal_therapist, psychologist, doula, lactation_consultant, sleep_consultant, child_therapist, tutor]

    UsState:
      type: string
      description: Two-letter US state code.
      pattern: "^[A-Z]{2}$"
      example: CA

    Provider:
      type: object
      required: [id, name, type, city, state, languages, nextAvailable, priceUsd, summary]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: "#/components/schemas/ProviderType"
        city:
          type: string
        state:
          $ref: "#/components/schemas/UsState"
        languages:
          type: array
          items:
            type: string
          example: [English, Spanish]
        nextAvailable:
          type: string
          format: date
        priceUsd:
          type: integer
          description: Price of one session in US dollars.
        summary:
          type: string
          description: One plain sentence on what this provider helps with.

    ProviderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Provider"

    BookingRequestInput:
      type: object
      required: [providerId]
      properties:
        providerId:
          type: string
          format: uuid
        note:
          type: string
          maxLength: 500
          description: Optional message for the provider.

    BookingRequestStatus:
      type: string
      description: Only requested exists for now; the demo never confirms a booking.
      enum: [requested]

    BookingRequest:
      type: object
      required: [id, memberId, providerId, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
          description: The parent who made the request.
        providerId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/BookingRequestStatus"
        note:
          type: string
        createdAt:
          type: string
          format: date-time

    BookingRequestList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/BookingRequest"

    Passport:
      type: object
      required: [memberId, people]
      properties:
        memberId:
          type: string
          format: uuid
          description: The acting parent.
        people:
          type: array
          description: The acting parent first, then the other parent, then the child.
          items:
            $ref: "#/components/schemas/PassportPerson"

    PassportPerson:
      type: object
      required: [id, kind, name, isActingParent, labs, vaccines, allergies, growth, careTeam]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [parent, child]
        name:
          type: string
        role:
          $ref: "#/components/schemas/ParentRole"
        ageMonths:
          type: integer
          description: Set for the child.
        isActingParent:
          type: boolean
        labs:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/LabResult"
        vaccines:
          type: array
          description: Ordered by date, given or due.
          items:
            $ref: "#/components/schemas/VaccineDose"
        allergies:
          type: array
          items:
            $ref: "#/components/schemas/Allergy"
        growth:
          type: array
          description: Child only, oldest first. Empty for parents.
          items:
            $ref: "#/components/schemas/GrowthPoint"
        careTeam:
          type: array
          items:
            $ref: "#/components/schemas/CareTeamMember"

    LabResult:
      type: object
      required: [id, name, value, unit, takenOn, visibility]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Ferritin
        value:
          type: number
        unit:
          type: string
          example: ng/mL
        refLow:
          type: number
          description: Lower end of the reference range, when the lab gives one.
        refHigh:
          type: number
          description: Upper end of the reference range, when the lab gives one.
        takenOn:
          type: string
          format: date
        visibility:
          $ref: "#/components/schemas/Visibility"
        flag:
          $ref: "#/components/schemas/LabFlag"

    LabFlag:
      type: object
      description: |
        Set only when the value is outside the reference range stored with the
        result (below refLow or above refHigh; a value equal to a bound is in
        range). Computed by the server from database state. The wording is
        fixed and never diagnostic: it only says to discuss the value with a
        doctor.
      required: [direction, message, basis]
      properties:
        direction:
          type: string
          enum: [low, high]
        message:
          type: string
          example: Outside the usual range. Discuss with your doctor.
        basis:
          type: string
          description: Where the range comes from.
          example: Reference range reported with this lab result

    VaccineStatus:
      type: string
      enum: [done, overdue, due, upcoming]

    VaccineDose:
      type: object
      required: [id, name, dose, status, visibility]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: DTaP
        dose:
          type: string
          example: Dose 2 of 5
        status:
          $ref: "#/components/schemas/VaccineStatus"
        givenOn:
          type: string
          format: date
          description: Set when status is done.
        dueOn:
          type: string
          format: date
          description: Set when status is not done.
        visibility:
          $ref: "#/components/schemas/Visibility"

    AllergyCertainty:
      type: string
      description: confirmed = diagnosed by a clinician; suspected = noticed at home, not yet tested.
      enum: [suspected, confirmed]

    Allergy:
      type: object
      required: [id, substance, certainty, visibility]
      properties:
        id:
          type: string
          format: uuid
        substance:
          type: string
          example: Peanut
        certainty:
          $ref: "#/components/schemas/AllergyCertainty"
        reaction:
          type: string
          example: Hives within minutes
        notedOn:
          type: string
          format: date
        visibility:
          $ref: "#/components/schemas/Visibility"

    GrowthPoint:
      type: object
      required: [measuredOn, ageMonths, weightKg, heightCm]
      properties:
        measuredOn:
          type: string
          format: date
        ageMonths:
          type: integer
        weightKg:
          type: number
        heightCm:
          type: number
        weightPercentile:
          type: integer
          minimum: 1
          maximum: 99
          description: Against the WHO or CDC chart for the child's age and sex, computed by the server.
        heightPercentile:
          type: integer
          minimum: 1
          maximum: 99

    CareRole:
      type: string
      enum: [obstetrician, pediatrician, primary_care, psychologist, lactation_consultant, midwife, dentist]

    CareTeamMember:
      type: object
      required: [id, name, role, clinic]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Dr. Maya Reyes
        role:
          $ref: "#/components/schemas/CareRole"
        clinic:
          type: string
        phone:
          type: string

    AgendaTopic:
      type: object
      required: [id, text, addedAt]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          description: The topic the parent chose, never the entry text.
        addedAt:
          type: string
          format: date-time
        diaryEntryId:
          type: string
          format: uuid
          description: Set when the topic came from one of the parent's diary entries (DiaryEntry.agendaTopic).

    Psychologist:
      type: object
      required: [id, name, credentials, focus]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        credentials:
          type: string
          example: PhD, licensed clinical psychologist
        focus:
          type: string
          example: Perinatal and postpartum mental health

    PsychologistBooking:
      type: object
      required: [id, provider, startsAt, durationMinutes, noteWritten]
      properties:
        id:
          type: string
          format: uuid
        provider:
          $ref: "#/components/schemas/Psychologist"
        startsAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        noteWritten:
          type: boolean
          description: True once the parent has written a session note for this booking.

    PsychologistAgenda:
      type: object
      required: [topics]
      properties:
        topics:
          type: array
          description: Oldest first, so the longest-waiting topic is on top.
          items:
            $ref: "#/components/schemas/AgendaTopic"
        nextSession:
          $ref: "#/components/schemas/PsychologistBooking"
        noteDue:
          allOf:
            - $ref: "#/components/schemas/PsychologistBooking"
          description: The latest session that has started and has no note yet.

    Slot:
      type: object
      required: [id, startsAt, durationMinutes]
      properties:
        id:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer

    PsychologistSlots:
      type: object
      required: [provider, items]
      properties:
        provider:
          $ref: "#/components/schemas/Psychologist"
        items:
          type: array
          description: Earliest first.
          items:
            $ref: "#/components/schemas/Slot"

    PsychologistBookingInput:
      type: object
      required: [slotId]
      properties:
        slotId:
          type: string
          format: uuid

    SessionNoteInput:
      type: object
      required: [bookingId, text]
      properties:
        bookingId:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 1000

    SessionNote:
      type: object
      required: [id, bookingId, writtenAt, text]
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        writtenAt:
          type: string
          format: date-time
        text:
          type: string

    PersonRole:
      type: string
      description: Any person who can act in the family, parents and caregivers.
      enum: [mother, partner, grandparent, nanny]

    CaregiverPermission:
      type: string
      description: |
        What a grandparent or nanny may see or do; parents have all of
        these. Nothing else can be granted: a parent's diary, mood
        check-ins, labs, session notes, appointment questions, plans and
        booking requests are never visible to a caregiver.
        care_log = read and write feeds, sleep and diapers, give and take
        handoffs; baby_passport = the limited baby card (profile,
        pediatrician, allergies, emergency contacts, no medical history);
        schedule = their own shifts and events they attend in the calendar
        and Today; family_plan = the shared task list and tasks offered to
        them; pregnancy_updates = the weekly pregnancy card and pregnancy
        guides.
      enum: [care_log, baby_passport, schedule, family_plan, pregnancy_updates]

    FamilyUpdate:
      type: object
      minProperties: 1
      properties:
        stage:
          $ref: "#/components/schemas/Stage"
        dueDate:
          type: string
          format: date

    BabyArrivalInput:
      type: object
      required: [name, birthDate]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        birthDate:
          type: string
          format: date
          description: Today or up to 30 days ago; a future date is 400.

    Subscription:
      type: object
      required: [tier, status, startedAt]
      description: The family's paid plan. One subscription unlocks both parents.
      properties:
        tier:
          $ref: "#/components/schemas/PaidTier"
        status:
          $ref: "#/components/schemas/SubscriptionStatus"
        startedAt:
          type: string
          format: date-time
        currentPeriodEnd:
          type: string
          format: date-time

    SubscriptionStatus:
      type: string
      enum: [active, past_due, canceled]

    InvitationStatus:
      type: string
      description: expired is computed from expiresAt; accepted and revoked are stored.
      enum: [pending, accepted, revoked, expired]

    InvitationInput:
      type: object
      required: [role, displayName, permissions]
      properties:
        role:
          $ref: "#/components/schemas/CaregiverRole"
        displayName:
          type: string
          minLength: 1
          maxLength: 60
          example: Grandma Rose
        permissions:
          type: array
          uniqueItems: true
          description: |
            The toggles. The UI starts from the defaults per role: nanny
            care_log, baby_passport, schedule; grandparent the same plus
            pregnancy_updates.
          items:
            $ref: "#/components/schemas/CaregiverPermission"

    Invitation:
      type: object
      required: [id, role, displayName, permissions, status, invitedById, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/CaregiverRole"
        displayName:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/CaregiverPermission"
        status:
          $ref: "#/components/schemas/InvitationStatus"
        invitedById:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
          description: The caregiver created on accept. Set once accepted.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time

    CreatedInvitation:
      type: object
      required: [invitation, token, path]
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        token:
          type: string
          description: Returned only here; the server keeps only its hash.
        path:
          type: string
          description: Web path of the accept page, to put after the site origin.
          example: /invite/3q2-xS0...

    InvitationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/Invitation"

    InvitationPreview:
      type: object
      required: [role, displayName, permissions, status, invitedByName, expiresAt]
      properties:
        role:
          $ref: "#/components/schemas/CaregiverRole"
        displayName:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/CaregiverPermission"
        status:
          $ref: "#/components/schemas/InvitationStatus"
        invitedByName:
          type: string
          example: Emily
        expiresAt:
          type: string
          format: date-time

    InvitationAcceptance:
      type: object
      required: [family, memberId]
      properties:
        family:
          $ref: "#/components/schemas/Family"
        memberId:
          type: string
          format: uuid
          description: The new caregiver; act as this person.

    AccessLogEntry:
      type: object
      required: [id, actorName, action, entity, at]
      properties:
        id:
          type: string
        actorId:
          type: string
          format: uuid
          description: Absent when the person was removed.
        actorName:
          type: string
        actorRole:
          $ref: "#/components/schemas/PersonRole"
        action:
          type: string
          description: create, read, update, delete, accept or revoke.
          example: read
        entity:
          type: string
          description: snake_case entity name, as in the audit log.
          example: child_passport
        entityId:
          type: string
        at:
          type: string
          format: date-time

    AccessLogList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/AccessLogEntry"

    GuideKind:
      type: string
      description: article = stage content; birth_prep = a birth preparation module; loss_support = support after a pregnancy loss, returned only while Family.pregnancyLoss is set.
      enum: [article, birth_prep, loss_support]

    GuideAudience:
      type: string
      enum: [mother, partner, caregiver]

    Guide:
      type: object
      required: [id, kind, title, summary, steps, stages, audience, locked, source]
      properties:
        id:
          type: string
          description: Stable slug from the content catalog.
          example: birth-prep-breathing
        kind:
          $ref: "#/components/schemas/GuideKind"
        title:
          type: string
        summary:
          type: string
        steps:
          type: array
          description: The body as short steps or paragraphs.
          items:
            type: string
        minutes:
          type: integer
          description: Time to read or practice.
        stages:
          type: array
          items:
            $ref: "#/components/schemas/Stage"
        weekFrom:
          type: integer
          description: First gestational week it applies to (pregnancy content).
        weekTo:
          type: integer
        ageMonthsFrom:
          type: integer
          description: First child age in months it applies to (after birth).
        ageMonthsTo:
          type: integer
        audience:
          type: array
          items:
            $ref: "#/components/schemas/GuideAudience"
        locked:
          type: boolean
          description: True for birth prep before week 32.
        unlocksAtWeek:
          type: integer
          example: 32
        source:
          $ref: "#/components/schemas/Source"

    GuideList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Most relevant first.
          items:
            $ref: "#/components/schemas/Guide"

    BabySize:
      type: object
      required: [comparison, lengthCm, weightG]
      properties:
        comparison:
          type: string
          example: a pineapple
        lengthCm:
          type: number
        weightG:
          type: number

    PregnancyWeek:
      type: object
      required: [week, isCurrentWeek, whyItMatters, tasks, questions, birthPrep, source]
      properties:
        week:
          type: integer
        isCurrentWeek:
          type: boolean
        size:
          # Optional: present only when the catalog has a sourced size for this week.
          $ref: "#/components/schemas/BabySize"
        development:
          type: string
          description: What is developing this week, in plain words. Present only when sourced.
        whyItMatters:
          type: string
          description: Why this week matters for the parents, never a diagnosis.
        tasks:
          type: array
          description: For the acting person's role.
          items:
            type: string
        questions:
          type: array
          description: Suggested questions; the UI can add one with createAppointmentQuestion.
          items:
            type: string
        birthPrep:
          type: array
          description: Birth prep modules for this week (from week 28), locked until the family reaches week 32.
          items:
            $ref: "#/components/schemas/Guide"
        source:
          $ref: "#/components/schemas/Source"

    PregnancyWeekSummary:
      type: object
      required: [week, sizeComparison, headline]
      properties:
        week:
          type: integer
        sizeComparison:
          type: string
          example: a pineapple
        headline:
          type: string
          description: The first sentence of whyItMatters.

    Today:
      type: object
      required: [memberId, role, date, stage, planItems, tasks, events, pendingHandoffs, guides]
      properties:
        memberId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/PersonRole"
        date:
          type: string
          format: date
        stage:
          $ref: "#/components/schemas/Stage"
        pregnancyWeek:
          $ref: "#/components/schemas/PregnancyWeekSummary"
        planItems:
          type: array
          description: Up to 3 overdue or due plan items. Parents only; empty for caregivers.
          items:
            $ref: "#/components/schemas/PlanItem"
        tasks:
          type: array
          description: The person's tasks due within 7 days or overdue, then tasks offered to them.
          items:
            $ref: "#/components/schemas/Task"
        events:
          type: array
          description: Today and tomorrow, as listCalendarEvents scope mine (parents also get family events).
          items:
            $ref: "#/components/schemas/CalendarEvent"
        nextShift:
          $ref: "#/components/schemas/CalendarEvent"
        careSummary:
          $ref: "#/components/schemas/CareSummary"
        pendingHandoffs:
          type: array
          description: Handoffs to the acting person not accepted yet.
          items:
            $ref: "#/components/schemas/Handoff"
        guides:
          type: array
          description: Up to 2 guides from listGuides.
          items:
            $ref: "#/components/schemas/Guide"


    TaskKind:
      type: string
      description: |
        task = the shared plan; paperwork = the seeded US paperwork
        checklist; hospital_bag = an item on one of the three bag lists.
      enum: [task, paperwork, hospital_bag]

    TaskInputKind:
      type: string
      description: Paperwork is seeded, never created by hand.
      enum: [task, hospital_bag]

    HospitalBag:
      type: string
      description: Which of the three hospital bag lists an item is on.
      enum: [mother, partner, baby]

    TaskDueAnchor:
      type: string
      description: What a computed deadline counts from.
      enum: [due_date, birth_date]

    TaskInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        dueOn:
          type: string
          format: date
        kind:
          $ref: "#/components/schemas/TaskInputKind"
        bag:
          $ref: "#/components/schemas/HospitalBag"
        detail:
          type: string
          maxLength: 500

    TaskUpdate:
      type: object
      required: [done]
      properties:
        done:
          type: boolean

    TaskReassignmentInput:
      type: object
      required: [toMemberId]
      properties:
        toMemberId:
          type: string
          format: uuid
          description: The parent the task is offered to. Must be in the family and not the acting parent. May also be a caregiver with family_plan.

    Task:
      type: object
      required: [id, title, assigneeId, kind, done]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        dueOn:
          type: string
          format: date
        assigneeId:
          type: string
          format: uuid
          description: The parent who owns the task now.
        pendingAssigneeId:
          type: string
          format: uuid
          description: Set while the task is offered to the other parent and not yet accepted.
        kind:
          $ref: "#/components/schemas/TaskKind"
        bag:
          $ref: "#/components/schemas/HospitalBag"
        detail:
          type: string
          description: What to do and how, in plain words.
        done:
          type: boolean
        doneAt:
          type: string
          format: date-time
        doneById:
          type: string
          format: uuid
        dueAnchor:
          $ref: "#/components/schemas/TaskDueAnchor"
        dueOffsetDays:
          type: integer
          description: |
            With dueAnchor, dueOn = anchor date + this many days (negative
            = before). Absent when dueOn is a plain date or the anchor is
            not known yet (birth_date before birth: dueOn is then counted
            from the due date as an estimate).
        source:
          $ref: "#/components/schemas/Source"

    TaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Soonest due first, undated last.
          items:
            $ref: "#/components/schemas/Task"

    CalendarScope:
      type: string
      description: Default family for parents; caregivers may only use mine.
      enum: [mine, partner, family]

    CalendarEventKind:
      type: string
      description: |
        appointment, class, reminder and other are stored events; shift is
        one occurrence of an active shift; task is a task due date;
        psychologist_session is the owner's own booking, always private.
      enum: [appointment, class, reminder, other, shift, task, psychologist_session]

    CalendarEventInputKind:
      type: string
      enum: [appointment, class, reminder, other]

    CalendarVisibility:
      type: string
      description: private = owner only; family = both parents, and attendees.
      enum: [private, family]

    CalendarEventInput:
      type: object
      required: [kind, title, startsAt, visibility]
      properties:
        kind:
          $ref: "#/components/schemas/CalendarEventInputKind"
        title:
          type: string
          minLength: 1
          maxLength: 120
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        allDay:
          type: boolean
        location:
          type: string
          maxLength: 200
        attendeeIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        visibility:
          $ref: "#/components/schemas/CalendarVisibility"

    CalendarEvent:
      type: object
      required: [id, kind, title, startsAt, allDay, attendeeIds, visibility]
      properties:
        id:
          type: string
          description: |
            Stable per occurrence. A uuid for stored events and appointments;
            "<shiftId>:<date>" for a shift occurrence; the task id for a task.
        kind:
          $ref: "#/components/schemas/CalendarEventKind"
        title:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        allDay:
          type: boolean
        location:
          type: string
        ownerId:
          type: string
          format: uuid
          description: The person it belongs to (shift owner, task assignee). Absent for family-wide events.
        attendeeIds:
          type: array
          items:
            type: string
            format: uuid
        visibility:
          $ref: "#/components/schemas/CalendarVisibility"
        shiftId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid

    CalendarEventList:
      type: object
      required: [from, to, items]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        items:
          type: array
          description: Earliest first.
          items:
            $ref: "#/components/schemas/CalendarEvent"

    AppointmentQuestionInput:
      type: object
      required: [text, visibility]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 300
        appointmentId:
          type: string
          format: uuid
          description: Default the next upcoming appointment the acting parent may see.
        visibility:
          $ref: "#/components/schemas/Visibility"

    AppointmentQuestionUpdate:
      type: object
      required: [answered]
      properties:
        answered:
          type: boolean
        answer:
          type: string
          maxLength: 1000

    AppointmentQuestion:
      type: object
      required: [id, authorId, text, askedForAppointmentId, carriedOver, answered, visibility, createdAt]
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        text:
          type: string
        appointmentId:
          type: string
          format: uuid
          description: The appointment it is under now. Absent when unanswered and no later appointment exists yet.
        askedForAppointmentId:
          type: string
          format: uuid
          description: The appointment it was first added to.
        carriedOver:
          type: boolean
          description: True when appointmentId differs from askedForAppointmentId.
        answered:
          type: boolean
        answer:
          type: string
        answeredAt:
          type: string
          format: date-time
        visibility:
          $ref: "#/components/schemas/Visibility"
        createdAt:
          type: string
          format: date-time

    AppointmentQuestionList:
      type: object
      required: [appointments, items]
      properties:
        appointments:
          type: array
          description: Upcoming appointments that have questions, soonest first.
          items:
            $ref: "#/components/schemas/CalendarEvent"
        items:
          type: array
          description: Unanswered first, then by appointment, then oldest first.
          items:
            $ref: "#/components/schemas/AppointmentQuestion"


    SimulatorSkill:
      type: string
      enum: [feeding, soothing, safe_sleep, diapering, warning_signs, teamwork]

    SimulatorMode:
      type: string
      enum: [scenario, practice]

    SkillScore:
      type: object
      required: [skill, answered, correct, weak]
      properties:
        skill:
          $ref: "#/components/schemas/SimulatorSkill"
        answered:
          type: integer
        correct:
          type: integer
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: Percent correct. Absent before the first answer.
        weak:
          type: boolean
          description: True when score is below 70.

    ShiftSuggestion:
      type: object
      required: [title, days, startTime, endTime]
      description: The shift a scenario suggests committing to; post it to createShift as is or edited.
      properties:
        title:
          type: string
          example: Night feeds
        days:
          type: array
          items:
            $ref: "#/components/schemas/Weekday"
        startTime:
          type: string
          example: "22:00"
        endTime:
          type: string
          example: "02:00"

    SimulatorScenario:
      type: object
      required: [id, title, summary, skills, questionCount]
      properties:
        id:
          type: string
          example: first-night-home
        title:
          type: string
        summary:
          type: string
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SimulatorSkill"
        questionCount:
          type: integer
        suggestedShift:
          $ref: "#/components/schemas/ShiftSuggestion"

    SimulatorProgress:
      type: object
      required: [memberId, skills, weakSpots, scenarios, roundsCompleted]
      properties:
        memberId:
          type: string
          format: uuid
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillScore"
        weakSpots:
          type: array
          description: Skills with a score below 70, weakest first.
          items:
            $ref: "#/components/schemas/SimulatorSkill"
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/SimulatorScenario"
        roundsCompleted:
          type: integer

    SimulatorRoundInput:
      type: object
      required: [mode]
      properties:
        mode:
          $ref: "#/components/schemas/SimulatorMode"
        scenarioId:
          type: string
          maxLength: 80
          description: Required for mode scenario.

    SimulatorChoice:
      type: object
      required: [id, text]
      properties:
        id:
          type: string
        text:
          type: string

    SimulatorQuestion:
      type: object
      required: [id, skill, prompt, choices]
      properties:
        id:
          type: string
        skill:
          $ref: "#/components/schemas/SimulatorSkill"
        prompt:
          type: string
        choices:
          type: array
          items:
            $ref: "#/components/schemas/SimulatorChoice"
        answer:
          $ref: "#/components/schemas/SimulatorAnswerResult"

    SimulatorRoundResult:
      type: object
      required: [correct, total, skills, weakSpots]
      properties:
        correct:
          type: integer
        total:
          type: integer
        skills:
          type: array
          description: The person's overall scores after this round.
          items:
            $ref: "#/components/schemas/SkillScore"
        weakSpots:
          type: array
          items:
            $ref: "#/components/schemas/SimulatorSkill"
        suggestedShift:
          $ref: "#/components/schemas/ShiftSuggestion"

    SimulatorRound:
      type: object
      required: [id, mode, title, questions, completed, createdAt]
      properties:
        id:
          type: string
          format: uuid
        mode:
          $ref: "#/components/schemas/SimulatorMode"
        scenarioId:
          type: string
        title:
          type: string
        questions:
          type: array
          description: In the order to ask them. answer is set once answered.
          items:
            $ref: "#/components/schemas/SimulatorQuestion"
        completed:
          type: boolean
        result:
          $ref: "#/components/schemas/SimulatorRoundResult"
        createdAt:
          type: string
          format: date-time

    SimulatorAnswerInput:
      type: object
      required: [questionId, choiceId]
      properties:
        questionId:
          type: string
          maxLength: 80
        choiceId:
          type: string
          maxLength: 80

    SimulatorAnswerResult:
      type: object
      required: [questionId, choiceId, correct, correctChoiceId, explanation, skill]
      properties:
        questionId:
          type: string
        choiceId:
          type: string
        correct:
          type: boolean
        correctChoiceId:
          type: string
        explanation:
          type: string
          description: Why, in plain words. Never a diagnosis.
        skill:
          $ref: "#/components/schemas/SimulatorSkill"
        source:
          $ref: "#/components/schemas/Source"
        roundCompleted:
          type: boolean
          description: True when this was the last unanswered question; fetch the round for the result.

    Weekday:
      type: string
      enum: [mon, tue, wed, thu, fri, sat, sun]

    ShiftStatus:
      type: string
      description: |
        agreed = committed before "Baby is home", no occurrences yet;
        active = in the calendar from startsOn.
      enum: [agreed, active]

    ShiftInput:
      type: object
      required: [title, days, startTime, endTime]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
        days:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Weekday"
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Local time HH:MM.
          example: "22:00"
        endTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Local time HH:MM. Earlier than startTime means the next morning.
          example: "02:00"
        roundId:
          type: string
          format: uuid
          description: The simulator round this commitment came from.

    Shift:
      type: object
      required: [id, memberId, title, days, startTime, endTime, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
          description: Who is on duty during this shift.
        title:
          type: string
        days:
          type: array
          items:
            $ref: "#/components/schemas/Weekday"
        startTime:
          type: string
        endTime:
          type: string
        status:
          $ref: "#/components/schemas/ShiftStatus"
        startsOn:
          type: string
          format: date
          description: Set when active.
        roundId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    ShiftList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Shift"

    CareLogKind:
      type: string
      enum: [feed, sleep, diaper]

    FeedMethod:
      type: string
      enum: [breast_left, breast_right, bottle_breast_milk, bottle_formula]

    DiaperContent:
      type: string
      enum: [wet, dirty, both]

    CareLogEntryInput:
      type: object
      required: [kind, startedAt]
      properties:
        kind:
          $ref: "#/components/schemas/CareLogKind"
        childId:
          type: string
          format: uuid
          description: Default the family's only or youngest child.
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          description: For a feed or a sleep; absent while it is still going.
        feedMethod:
          $ref: "#/components/schemas/FeedMethod"
        amountMl:
          type: integer
          minimum: 0
          maximum: 400
        diaper:
          $ref: "#/components/schemas/DiaperContent"
        note:
          type: string
          maxLength: 300

    CareLogEntry:
      type: object
      required: [id, childId, authorId, kind, startedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        childId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/CareLogKind"
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        feedMethod:
          $ref: "#/components/schemas/FeedMethod"
        amountMl:
          type: integer
        diaper:
          $ref: "#/components/schemas/DiaperContent"
        note:
          type: string
        createdAt:
          type: string
          format: date-time

    OnDuty:
      type: object
      required: [memberId, since, via]
      description: Who has the baby now.
      properties:
        memberId:
          type: string
          format: uuid
        since:
          type: string
          format: date-time
        via:
          type: string
          description: handoff = the last accepted handoff; shift = the current shift occurrence, when no handoff came after its start.
          enum: [handoff, shift]

    CareSummary:
      type: object
      properties:
        lastFeed:
          $ref: "#/components/schemas/CareLogEntry"
        lastSleep:
          $ref: "#/components/schemas/CareLogEntry"
        lastDiaper:
          $ref: "#/components/schemas/CareLogEntry"
        onDuty:
          $ref: "#/components/schemas/OnDuty"

    CareLogList:
      type: object
      required: [items, latest]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/CareLogEntry"
        latest:
          $ref: "#/components/schemas/CareSummary"

    HandoffStatus:
      type: string
      enum: [pending, accepted]

    HandoffInput:
      type: object
      required: [toMemberId]
      properties:
        toMemberId:
          type: string
          format: uuid
        note:
          type: string
          maxLength: 500
          example: Fed at 14:10, 90 ml. Napping since 14:40. Diaper cream on the changing table.
        shiftId:
          type: string
          format: uuid
          description: The receiver's shift this handoff starts, when there is one.
        voiceNoteId:
          type: string
          format: uuid
          description: A voice note the acting person uploaded with createVoiceNote and has not attached yet.

    Handoff:
      type: object
      required: [id, fromMemberId, toMemberId, status, createdAt, careSummary]
      properties:
        id:
          type: string
          format: uuid
        fromMemberId:
          type: string
          format: uuid
        toMemberId:
          type: string
          format: uuid
        note:
          type: string
        shiftId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/HandoffStatus"
        createdAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
        careSummary:
          $ref: "#/components/schemas/CareSummary"
        voiceNote:
          $ref: "#/components/schemas/VoiceNote"

    HandoffList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Pending first, then newest first.
          items:
            $ref: "#/components/schemas/Handoff"

    LiveUpdateKind:
      type: string
      description: Which screens should refetch.
      enum: [family, task, shift, calendar_event, care_log, handoff, appointment_question, invitation, notification, leave_plan, diary_entry, insurance_call]

    LiveUpdate:
      type: object
      required: [kind, actorId, at]
      description: The data of one "update" event on getLiveUpdates. Never carries the record itself.
      properties:
        kind:
          $ref: "#/components/schemas/LiveUpdateKind"
        entityId:
          type: string
          description: The changed record, when there is one.
        actorId:
          type: string
          format: uuid
          description: Who made the change, so a screen can skip its own echo.
        at:
          type: string
          format: date-time

    EmergencyContact:
      type: object
      required: [name, relation, phone]
      properties:
        name:
          type: string
        relation:
          type: string
          example: Grandmother
        phone:
          type: string

    MedicalHistoryEntry:
      type: object
      required: [date, title]
      properties:
        date:
          type: string
          format: date
        title:
          type: string
          example: Newborn hearing screen passed
        detail:
          type: string

    ChildPassport:
      type: object
      required: [child, limitedView, allergies, emergencyContacts]
      properties:
        child:
          $ref: "#/components/schemas/Child"
        limitedView:
          type: boolean
          description: True for a grandparent or nanny; medicalHistory and vaccines are then absent.
        pediatrician:
          $ref: "#/components/schemas/CareTeamMember"
        allergies:
          type: array
          description: Suspected and confirmed. Empty means none known.
          items:
            $ref: "#/components/schemas/Allergy"
        emergencyContacts:
          type: array
          items:
            $ref: "#/components/schemas/EmergencyContact"
        medicalHistory:
          type: array
          description: Parents only. Newest first.
          items:
            $ref: "#/components/schemas/MedicalHistoryEntry"
        vaccines:
          type: array
          description: Parents only.
          items:
            $ref: "#/components/schemas/VaccineDose"

    CheckoutSessionInput:
      type: object
      required: [tier]
      properties:
        tier:
          $ref: "#/components/schemas/PaidTier"

    CheckoutSessionStatus:
      type: string
      description: As Stripe reports it.
      enum: [open, complete, expired]

    CheckoutSession:
      type: object
      required: [id, tier, status]
      properties:
        id:
          type: string
          description: Stripe Checkout Session id.
          example: cs_test_a1B2c3
        tier:
          $ref: "#/components/schemas/PaidTier"
        status:
          $ref: "#/components/schemas/CheckoutSessionStatus"
        url:
          type: string
          description: Stripe-hosted page to redirect to. Set while status is open.
        paid:
          type: boolean
          description: True once Stripe reports payment_status paid.

    StripeEvent:
      type: object
      required: [id, type, data]
      description: The parts of a Stripe event the server reads; Stripe sends more.
      properties:
        id:
          type: string
        type:
          type: string
          example: checkout.session.completed
        data:
          type: object
          additionalProperties: true

    WebhookReceipt:
      type: object
      required: [received]
      properties:
        received:
          type: boolean

    NotificationKind:
      type: string
      description: |
        What happened, and who receives it. The web maps a kind and
        entityId to a screen.
        task_offered = a task was offered to the recipient (entityId: task);
        task_offer_answered = the other person accepted or declined the
        recipient's offer (task); handoff_received = a handoff to the
        recipient is waiting (handoff); handoff_accepted = the recipient's
        handoff was taken (handoff); plan_item_due = one of the recipient's
        own plan items became due or overdue (entityId: ruleId);
        value_flagged = one of the recipient's own lab results (or their
        child's, for both parents) got a LabFlag (lab result id; never sent
        to caregivers or the other parent for a parent's own record); appointment_reminder = the recipient's
        appointment is tomorrow (calendar event); invitation_accepted = a
        caregiver the recipient invited joined (invitation);
        subscription_started = the family's paid plan started (both
        parents).
      enum: [task_offered, task_offer_answered, handoff_received, handoff_accepted, plan_item_due, value_flagged, appointment_reminder, invitation_accepted, subscription_started]

    Notification:
      type: object
      required: [id, kind, title, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/NotificationKind"
        title:
          type: string
          description: A fixed template filled with names and dates only, never health values or private text.
          example: Jake offered you "Install the car seat"
        entityId:
          type: string
          description: The record to open (a uuid, or a ruleId for plan_item_due).
        actorId:
          type: string
          format: uuid
          description: Who caused it, when a person did.
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time

    NotificationList:
      type: object
      required: [items, unreadCount]
      properties:
        items:
          type: array
          description: Newest first, last 30 days, at most 50.
          items:
            $ref: "#/components/schemas/Notification"
        unreadCount:
          type: integer

    NotificationReadInput:
      type: object
      properties:
        ids:
          type: array
          description: Leave out to mark all as read.
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid

    CalendarFeedScope:
      type: string
      description: mine = the person's own events and shifts; family = what scope family shows them (parents only).
      enum: [mine, family]

    CalendarFeedInput:
      type: object
      required: [scope]
      properties:
        scope:
          $ref: "#/components/schemas/CalendarFeedScope"

    CalendarFeed:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
        scope:
          $ref: "#/components/schemas/CalendarFeedScope"
        url:
          type: string
          description: The secret subscription URL (https://.../api/calendar-feeds/<token>). Only in the createCalendarFeed response.
        createdAt:
          type: string
          format: date-time
        lastFetchedAt:
          type: string
          format: date-time

    LeavePlanInput:
      type: object
      required: [state, employerEmployees, monthsEmployed, hoursLast12Months]
      description: The wizard's answers for one parent. Nothing about health.
      properties:
        state:
          $ref: "#/components/schemas/UsState"
        employerEmployees:
          type: integer
          minimum: 0
          maximum: 1000000
          description: People the employer has at or near the parent's worksite; 0 for self-employed.
        monthsEmployed:
          type: integer
          minimum: 0
          maximum: 600
          description: Months with the current employer.
        hoursLast12Months:
          type: integer
          minimum: 0
          maximum: 8784
        startsOn:
          type: string
          format: date
          description: First day of leave. Leave out to start on the due date or birth date.
        weeksWanted:
          type: integer
          minimum: 1
          maximum: 52

    LeaveEligibility:
      type: string
      description: unknown = the answers are not enough to tell; the reason says what to ask HR.
      enum: [eligible, not_eligible, unknown]

    LeaveProgramKind:
      type: string
      description: job_protection = your job is held but unpaid; paid_leave = wage replacement; both = the program does both.
      enum: [job_protection, paid_leave, both]

    LeaveProgram:
      type: object
      required: [id, name, kind, eligibility, reason, source]
      properties:
        id:
          type: string
          description: Catalog slug, for example fmla or ca_pfl.
        name:
          type: string
        kind:
          $ref: "#/components/schemas/LeaveProgramKind"
        eligibility:
          $ref: "#/components/schemas/LeaveEligibility"
        weeks:
          type: integer
          description: Weeks this parent can take under the program, when eligible.
        pay:
          type: string
          description: What it pays, in plain words, for paid programs.
        reason:
          type: string
          description: Which answers decided the eligibility.
        source:
          $ref: "#/components/schemas/Source"

    LeaveSegment:
      type: object
      required: [startsOn, endsOn, programIds, paid, jobProtected]
      description: One stretch of the timeline where the same programs apply.
      properties:
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        programIds:
          type: array
          items:
            type: string
        paid:
          type: boolean
        jobProtected:
          type: boolean

    LeaveDeadline:
      type: object
      required: [title, dueOn, source]
      properties:
        title:
          type: string
          example: Give your employer written notice
        dueOn:
          type: string
          format: date
        programId:
          type: string
        taskId:
          type: string
          format: uuid
          description: The paperwork task for the same step, when the checklist has one.
        source:
          $ref: "#/components/schemas/Source"

    ParentLeave:
      type: object
      required: [memberId, role, programs, segments, deadlines]
      properties:
        memberId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ParentRole"
        input:
          $ref: "#/components/schemas/LeavePlanInput"
        programs:
          type: array
          items:
            $ref: "#/components/schemas/LeaveProgram"
        segments:
          type: array
          description: Oldest first; together they make the parent's lane on the timeline.
          items:
            $ref: "#/components/schemas/LeaveSegment"
        deadlines:
          type: array
          description: Soonest first.
          items:
            $ref: "#/components/schemas/LeaveDeadline"

    LeavePlan:
      type: object
      required: [parents]
      properties:
        parents:
          type: array
          description: The acting parent first, then the other parent.
          items:
            $ref: "#/components/schemas/ParentLeave"

    InsuranceCallTopic:
      type: string
      enum: [coverage, claim, prior_authorization, add_baby, billing, other]

    InsuranceCallInput:
      type: object
      required: [calledAt, insurer, topic, summary, visibility]
      properties:
        calledAt:
          type: string
          format: date-time
        insurer:
          type: string
          minLength: 1
          maxLength: 80
        representative:
          type: string
          maxLength: 80
        referenceNumber:
          type: string
          maxLength: 40
          description: The call or claim reference the insurer gave.
        topic:
          $ref: "#/components/schemas/InsuranceCallTopic"
        summary:
          type: string
          minLength: 1
          maxLength: 2000
          description: What was said and promised.
        followUpOn:
          type: string
          format: date
        visibility:
          $ref: "#/components/schemas/Visibility"

    InsuranceCall:
      type: object
      required: [id, authorId, calledAt, insurer, topic, summary, visibility, createdAt]
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        calledAt:
          type: string
          format: date-time
        insurer:
          type: string
        representative:
          type: string
        referenceNumber:
          type: string
        topic:
          $ref: "#/components/schemas/InsuranceCallTopic"
        summary:
          type: string
        followUpOn:
          type: string
          format: date
        visibility:
          $ref: "#/components/schemas/Visibility"
        createdAt:
          type: string
          format: date-time

    InsuranceCallList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/InsuranceCall"

    DiaryEntryInput:
      type: object
      required: [body, visibility]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
        visibility:
          $ref: "#/components/schemas/Visibility"
        agendaTopic:
          type: string
          maxLength: 120
          description: A short topic for the author's next psychologist session, never the entry text.

    DiaryEntryUpdate:
      type: object
      required: [visibility]
      properties:
        visibility:
          $ref: "#/components/schemas/Visibility"
        agendaTopic:
          type: string
          maxLength: 120
          description: Set or change the agenda topic; an empty string removes it. Leave out to keep it.

    DiaryEntry:
      type: object
      required: [id, authorId, writtenAt, body, visibility]
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        writtenAt:
          type: string
          format: date-time
        body:
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"
        agendaTopic:
          type: string
          description: Only on the author's own entries.

    DiaryEntryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/DiaryEntry"

    ScreeningInstrument:
      type: string
      description: epds = Edinburgh Postnatal Depression Scale, for either parent around pregnancy and birth; phq9 = Patient Health Questionnaire-9.
      enum: [epds, phq9]

    ScreeningChoice:
      type: object
      required: [value, label]
      properties:
        value:
          type: integer
          minimum: 0
          maximum: 3
        label:
          type: string

    ScreeningQuestion:
      type: object
      required: [number, text, choices]
      properties:
        number:
          type: integer
          minimum: 1
        text:
          type: string
        choices:
          type: array
          description: In the order the instrument prints them; values are the instrument's scores.
          items:
            $ref: "#/components/schemas/ScreeningChoice"

    ScreeningQuestionnaire:
      type: object
      required: [instrument, title, intro, questions, suggested, source]
      properties:
        instrument:
          $ref: "#/components/schemas/ScreeningInstrument"
        title:
          type: string
        intro:
          type: string
          description: The instrument's own instruction, including the period it asks about.
        questions:
          type: array
          items:
            $ref: "#/components/schemas/ScreeningQuestion"
        suggested:
          type: boolean
          description: True when this parent's plan asks for this questionnaire now.
        source:
          $ref: "#/components/schemas/Source"

    ScreeningQuestionnaireList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScreeningQuestionnaire"

    ScreeningInput:
      type: object
      required: [instrument, answers, visibility]
      properties:
        instrument:
          $ref: "#/components/schemas/ScreeningInstrument"
        answers:
          type: array
          description: One score per question, in order.
          minItems: 1
          maxItems: 10
          items:
            type: integer
            minimum: 0
            maximum: 3
        visibility:
          $ref: "#/components/schemas/Visibility"

    ScreeningBand:
      type: string
      description: |
        green = below the instrument's cutoff; amber = near it, repeat in
        two weeks and mention it at the next visit; red = at or above it,
        talk to a doctor or midwife soon. Cutoffs come from the
        instrument's source and are never a diagnosis.
      enum: [green, amber, red]

    ScreeningResult:
      type: object
      required: [id, authorId, instrument, takenAt, score, maxScore, band, urgent, source, visibility]
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        instrument:
          $ref: "#/components/schemas/ScreeningInstrument"
        takenAt:
          type: string
          format: date-time
        score:
          type: integer
        maxScore:
          type: integer
        band:
          $ref: "#/components/schemas/ScreeningBand"
        urgent:
          type: boolean
          description: The self-harm question was answered above its lowest value. Open the fixed crisis screen. Always false for someone else's result.
        message:
          type: string
          description: Fixed wording for the band, never generated. Only on the author's own results.
        source:
          $ref: "#/components/schemas/Source"
        visibility:
          $ref: "#/components/schemas/Visibility"

    ScreeningResultList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/ScreeningResult"

    PregnancyLossInput:
      type: object
      description: Everything is optional so the flow can ask as little as possible.
      properties:
        occurredOn:
          type: string
          format: date
          description: Today or earlier; a future date is 400.

    PregnancyLoss:
      type: object
      required: [recordedAt]
      description: Set while the family is in pregnancy loss support.
      properties:
        recordedAt:
          type: string
          format: date-time
        occurredOn:
          type: string
          format: date

    PartnerOfferInput:
      type: object
      required: [partnerName, title, detail, url, stages, audience, active]
