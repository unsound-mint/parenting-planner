          maxLength: 60
        title:
          type: string
          minLength: 1
          maxLength: 80
        detail:
          type: string
          minLength: 1
          maxLength: 300
        url:
          type: string
          pattern: "^https://"
          maxLength: 500
        stages:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Stage"
        audience:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ParentRole"
        active:
          type: boolean

    PartnerOfferUpdate:
      type: object
      minProperties: 1
      properties:
        partnerName:
          type: string
          minLength: 1
          maxLength: 60
        title:
          type: string
          minLength: 1
          maxLength: 80
        detail:
          type: string
          minLength: 1
          maxLength: 300
        url:
          type: string
          pattern: "^https://"
          maxLength: 500
        stages:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Stage"
        audience:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ParentRole"
        active:
          type: boolean

    PartnerOffer:
      type: object
      required: [id, partnerName, title, detail, url, stages, audience, active]
      properties:
        id:
          type: string
          format: uuid
        partnerName:
          type: string
        title:
          type: string
        detail:
          type: string
        url:
          type: string
        stages:
          type: array
          items:
            $ref: "#/components/schemas/Stage"
        audience:
          type: array
          items:
            $ref: "#/components/schemas/ParentRole"
        active:
          type: boolean
        clicks:
          type: integer
          description: Only in listAllPartnerOffers.

    PartnerOfferList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PartnerOffer"

    ContentKind:
      type: string
      description: |
        pregnancy_week = a weekly pregnancy card (body: development);
        guide = a guide or birth prep module (body: summary);
        simulator_question = a practice question (body: the prompt);
        checklist_item = a paperwork or hospital bag catalog item (body:
        detail). Health content keeps its catalog Source.
      enum: [pregnancy_week, guide, simulator_question, checklist_item]

    ContentItem:
      type: object
      required: [kind, id, title, body, edited]
      properties:
        kind:
          $ref: "#/components/schemas/ContentKind"
        id:
          type: string
          description: The catalog slug.
        title:
          type: string
        body:
          type: string
        edited:
          type: boolean
          description: True when this demo copy changed it.
        updatedAt:
          type: string
          format: date-time
        source:
          $ref: "#/components/schemas/Source"

    ContentItemList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentItem"

    ContentItemUpdate:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        body:
          type: string
          minLength: 1
          maxLength: 4000

    AnalyticsMetric:
      type: string
      description: Each is a count of events, never of health records.
      enum: [demo_started, custom_family_started, task_created, task_done, handoff_created, care_log_entry_created, simulator_round_played, booking_requested, invitation_accepted, checkout_started, checkout_paid, partner_offer_clicked]

    AnalyticsDay:
      type: object
      required: [date, count]
      properties:
        date:
          type: string
          format: date
        count:
          type: integer

    AnalyticsSeries:
      type: object
      required: [metric, total, days]
      properties:
        metric:
          $ref: "#/components/schemas/AnalyticsMetric"
        total:
          type: integer
        days:
          type: array
          description: Oldest first, one per day in the window, zeros included.
          items:
            $ref: "#/components/schemas/AnalyticsDay"

    TemplateCount:
      type: object
      required: [template, families]
      properties:
        template:
          $ref: "#/components/schemas/DemoTemplate"
        families:
          type: integer

    Analytics:
      type: object
      required: [from, to, generatedAt, templates, series]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        generatedAt:
          type: string
          format: date-time
        templates:
          type: array
          description: Demo families started in the window, per template.
          items:
            $ref: "#/components/schemas/TemplateCount"
        series:
          type: array
          description: One per AnalyticsMetric, in enum order.
          items:
            $ref: "#/components/schemas/AnalyticsSeries"

    VoiceNote:
