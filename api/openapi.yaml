        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getVoiceNote
      tags: [carelog]
      summary: Play a voice note
      description: |
        Whoever may see the handoff it is attached to (listHandoffs: parents
        every handoff, a caregiver with care_log only handoffs to or from
        them), plus its uploader before it is attached. Anyone else gets 404.
        Returns the audio with the Content-Type it was uploaded with.
      responses:
        "200":
          description: The recording.
          content:
            audio/*:
              schema:
                type: string
                format: binary
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
