  /members/{memberId}/now:
    get:
      operationId: getStageNow
      tags: [content]
      summary: The stage hero line, a sourced "what is happening now" for planning, newborn, baby, toddler, preschool and school age
      description: |
        The hero line for every stage except pregnancy (pregnancy has the
        baby size in getPregnancyWeek). Computed from the family's stored
        stage and, after birth, the youngest child's birth date and the demo
        clock: weeks of life 1 to 12, then each month to 11 months, each
        month from 12 to 24, then half-years to 5 years and years to 9
        (a child older than 9 keeps the last entry). Planning and trying
        families get a "preparing together" line.

        Milestones are written as what most children do by an age, never as
        a standard, and `note` always says children vary and sends worries to
        the pediatrician (planning: to the doctor). `sources` are the pages
        the text paraphrases, each with the date it was checked; the first
        is the page to link.

        Any member of the family may read it: it is general reference
        content and carries no health record. 409 `pregnant` when the stage
        is pregnancy, 409 `no_child` after birth with no child on record.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageNow"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/safety-reference:
    get:
      operationId: listSafetyReference
      tags: [content]
      summary: Pregnancy and breastfeeding reference for common foods and over-the-counter medicines
      description: |
        Educational, sourced and not personal: each entry gives a calm
        general reading (ok, limit, avoid, ask) with one line why, for
        pregnancy and, where a source was opened, for breastfeeding. It
        never says something is safe for the reader and has no doses. Every
        medicine entry has `ask`, the line that sends the question to a
        pharmacist or clinician. Entries cite the pages they paraphrase with
        the date each was checked. `learn` points at an existing nutrition
        lesson so fish and fridge advice is not repeated here.

        General reference content: any member of the family may read it and
        it carries no health record. The same list for every family.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyReferenceList"
        "401":
          description: Error
          content:
            application/json:
