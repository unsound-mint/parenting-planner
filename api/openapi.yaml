        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listMoodScreenings
      tags: [screening]
      summary: Questionnaire results from the last 365 days the acting parent may see
      description: |
        Mother and partner; a grandparent or nanny gets 404. Their own results
        plus the other parent's results shared with them, newest first. For a
        result that is not their own, urgent is always false and message is
        left out: the self-harm answer is only ever shown to its author.
        Audited.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoodScreeningList"
        "401":
          description: Error
          content:
