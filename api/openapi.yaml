openapi: 3.0.3
info:
  title: Parenting Planner API
  version: 0.1.0
  description: |
    Contract between web/ and api/. Both sides generate code from this file
    (`make gen`); never edit generated code by hand. Change this file first,
    in its own PR or together with both implementations.

    Auth: there is no login. POST /demo/sessions creates a demo family and
    sets an httpOnly session cookie that scopes every other call to that family.
servers:
  - url: /api
security:
  - session: []
tags:
  - name: demo
  - name: family
  - name: plan
  - name: wellbeing
paths:
  /healthz:
    get:
      operationId: healthz
      security: []
      responses:
        "200":
          description: The API and its database are up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /demo/sessions:
    post:
      operationId: createDemoSession
      tags: [demo]
      security: []
      summary: Start a demo with a fresh copy of a synthetic family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDemoSessionRequest"
      responses:
        "201":
          description: Family created; the session cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family:
    get:
      operationId: getFamily
      tags: [family]
      summary: The family of the current session, with parents and children
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/plan:
    get:
      operationId: getMemberPlan
      tags: [plan]
      summary: This week's plan for one parent
      description: |
        Items come from the guideline rules engine, evaluated against the family
        data this parent is allowed to see. Each item says why it applies and
        cites its source.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/mood-checkins:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    post:
      operationId: createMoodCheckin
      tags: [wellbeing]
      summary: The acting parent records how they feel today
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoodCheckinInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoodCheckin"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listMoodCheckins
      tags: [wellbeing]
      summary: Check-ins from the last 30 days that the acting parent may see
      description: Their own check-ins plus the other parent's check-ins shared with them.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoodCheckinList"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/diary-entries:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    post:
      operationId: createDiaryEntry
      tags: [wellbeing]
      summary: The acting parent writes a diary entry
      description: |
        Visibility is required: the author decides who may read the entry.
        The UI defaults it to private; the server never widens it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiaryEntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryEntry"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listDiaryEntries
      tags: [wellbeing]
      summary: Diary entries from the last 30 days that the acting parent may see
      description: Their own entries plus the other parent's entries shared with them.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryEntryList"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/diary-entries/{entryId}:
    parameters:
      - $ref: "#/components/parameters/MemberId"
      - name: entryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateDiaryEntry
      tags: [wellbeing]
      summary: The author changes who may read one of their entries
      description: |
        Only the author can share or unshare an entry. Any other entry id,
        including the other parent's entry, is 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiaryEntryUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryEntry"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/tasks:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    post:
      operationId: createTask
      tags: [tasks]
      summary: The acting parent adds a family task, assigned to themselves
      description: To give it to the other parent, propose a reassignment; they must accept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listTasks
      tags: [tasks]
      summary: All of the family's tasks, soonest due first, undated last
      description: Tasks are shared by both parents, so both see the same list.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/tasks/{taskId}/reassignment:
    parameters:
      - $ref: "#/components/parameters/MemberId"
      - $ref: "#/components/parameters/TaskId"
    post:
      operationId: proposeTaskReassignment
      tags: [tasks]
      summary: The assignee offers the task to the other parent
      description: |
        The task keeps its assignee until the other parent accepts.
        409 if the acting parent is not the assignee or offers it to themselves.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskReassignmentInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/tasks/{taskId}/reassignment/accept:
    parameters:
      - $ref: "#/components/parameters/MemberId"
      - $ref: "#/components/parameters/TaskId"
    post:
      operationId: acceptTaskReassignment
      tags: [tasks]
      summary: The proposed parent takes the task over
      description: |
        Ownership moves only here. 409 if the acting parent is not the one it was offered to.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/tasks/{taskId}/reassignment/decline:
    parameters:
      - $ref: "#/components/parameters/MemberId"
      - $ref: "#/components/parameters/TaskId"
    post:
      operationId: declineTaskReassignment
      tags: [tasks]
      summary: The proposed parent declines; the task stays with its assignee
      description: |
        409 if the acting parent is not the one it was offered to.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    MemberId:
      name: memberId
      in: path
      required: true
      description: |
        The acting parent. There is no login, so the UI says which parent is
        using the app; the API checks that this parent belongs to the session's family.
      schema:
        type: string
        format: uuid

    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: pp_session


  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: not_found
        message:
          type: string

    DemoTemplate:
      type: string
      description: Which synthetic family to copy. Add a value here when its seed exists.
      enum: [pregnancy]

    CreateDemoSessionRequest:
      type: object
      required: [template]
      properties:
        template:
          $ref: "#/components/schemas/DemoTemplate"

    Stage:
      type: string
      description: Where the family is on the journey from planning to age 9.
      enum: [planning, trying, pregnancy, postpartum, infant, toddler, preschool, school_age]

    ParentRole:
      type: string
      enum: [mother, partner]

    Family:
      type: object
      required: [id, template, stage, parents, children]
      properties:
        id:
          type: string
          format: uuid
        template:
          $ref: "#/components/schemas/DemoTemplate"
        stage:
          $ref: "#/components/schemas/Stage"
        dueDate:
          type: string
          format: date
          description: Set during pregnancy.
        gestationalWeek:
          type: integer
          description: Completed weeks of pregnancy today, derived from dueDate.
        parents:
          type: array
          items:
            $ref: "#/components/schemas/Parent"
        children:
          type: array
          items:
            $ref: "#/components/schemas/Child"

    Parent:
      type: object
      required: [id, role, displayName]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ParentRole"
        displayName:
          type: string

    Child:
      type: object
      required: [id, name, birthDate, ageMonths]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        birthDate:
          type: string
          format: date
        ageMonths:
          type: integer

    Plan:
      type: object
      required: [memberId, generatedAt, items]
      properties:
        memberId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
        items:
          type: array
          description: Sorted by status (overdue, due, upcoming), then due date.
          items:
            $ref: "#/components/schemas/PlanItem"

    PlanItemStatus:
      type: string
      enum: [overdue, due, upcoming]

    PlanCategory:
      type: string
      enum: [screening, vaccine, visit, mental_health, logistics, couple, learning]

    PlanItem:
      type: object
      required: [ruleId, title, detail, status, category, reason, source]
      properties:
        ruleId:
          type: string
          example: glucose-screen
        title:
          type: string
        detail:
          type: string
          description: What to do, in plain language.
        status:
          $ref: "#/components/schemas/PlanItemStatus"
        category:
          $ref: "#/components/schemas/PlanCategory"
        dueBy:
          type: string
          format: date
        reason:
          type: string
          description: Why this applies to this parent now, based on their data.
        source:
          $ref: "#/components/schemas/Source"

    Source:
      type: object
      required: [title, url, checkedAt]
      properties:
        title:
          type: string
        url:
          type: string
        checkedAt:
          type: string
          format: date
          description: When someone last confirmed the guideline still says this.

    Visibility:
      type: string
      description: |
        Who besides the author may see a sensitive record.
        private = author only; partner = author and the other parent;
        care_team = author and their professionals, not the partner; family = both parents.
      enum: [private, partner, care_team, family]

    MoodCheckinInput:
      type: object
      required: [mood, energy, sleepHours, visibility]
      properties:
        mood:
          type: integer
          minimum: 1
          maximum: 5
          description: 1 = very low, 5 = very good.
        energy:
          type: integer
          minimum: 1
          maximum: 5
        sleepHours:
          type: number
          minimum: 0
          maximum: 24
          description: Hours slept in the last 24 hours.
        note:
          type: string
          maxLength: 500
        visibility:
          $ref: "#/components/schemas/Visibility"

    MoodCheckin:
      type: object
      required: [id, authorId, recordedAt, mood, energy, sleepHours, visibility]
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        recordedAt:
          type: string
          format: date-time
        mood:
          type: integer
        energy:
          type: integer
        sleepHours:
          type: number
        note:
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"

    MoodCheckinList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/MoodCheckin"

    DiaryEntryInput:
      type: object
      required: [body, visibility]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
        visibility:
          $ref: "#/components/schemas/Visibility"

    DiaryEntryUpdate:
      type: object
      required: [visibility]
      properties:
        visibility:
          $ref: "#/components/schemas/Visibility"

    DiaryEntry:
      type: object
      required: [id, authorId, writtenAt, body, visibility]
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        writtenAt:
          type: string
          format: date-time
        body:
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"

    DiaryEntryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/DiaryEntry"

    TaskInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        dueOn:
          type: string
          format: date

    TaskReassignmentInput:
      type: object
      required: [toMemberId]
      properties:
        toMemberId:
          type: string
          format: uuid
          description: The parent the task is offered to. Must be in the family and not the acting parent.

    Task:
      type: object
      required: [id, title, assigneeId]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        dueOn:
          type: string
          format: date
        assigneeId:
          type: string
          format: uuid
          description: The parent who owns the task now.
        pendingAssigneeId:
          type: string
          format: uuid
          description: Set while the task is offered to the other parent and not yet accepted.

    TaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Soonest due first, undated last.
          items:
            $ref: "#/components/schemas/Task"
