  /members/{memberId}/caregivers/{caregiverId}:
    patch:
      operationId: updateCaregiverPermissions
      tags: [invitations]
      summary: A parent changes what a grandparent or nanny may see
      description: |
        Mother or partner only; a grandparent or nanny gets 403. Replaces the
        caregiver's permissions at once: the next request they make is checked
        against the new list, and the same list shows on their invitation. A
        removed caregiver, or an id that is not a caregiver of this family, is
        404. Recorded in the access log as a change to the invitation.
      parameters:
        - $ref: "#/components/parameters/MemberId"
        - name: caregiverId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  uniqueItems: true
                  items:
                    $ref: "#/components/schemas/CaregiverPermission"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Caregiver"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/invitations/{invitationId}/revoke:
    post:
      operationId: revokeInvitation
      tags: [invitations]
      summary: A parent revokes an invitation or a caregiver's access
      description: |
        Mother or partner only; a grandparent or nanny gets 403. A pending
        invitation can no longer be accepted. An accepted one removes the
        caregiver's access at once: they drop out of family.caregivers and
        their member id gets 404 on every endpoint. 409
        invitation_not_active when it is already revoked or expired.
        Recorded in the access log.
      parameters:
        - $ref: "#/components/parameters/MemberId"
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /invitations/{token}:
    get:
      operationId: getInvitation
      tags: [invitations]
      security: []
      summary: What an invitation link offers, for the accept page
      description: |
        No session needed: the person opening the link is usually in
        another browser. Returns who invited them, the role and the
        permissions so the accept page can say what they will see. A
        revoked, expired or used invitation still comes back, with its
        status, so the page can explain. 404 for an unknown token.
      parameters:
        - $ref: "#/components/parameters/InvitationToken"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      tags: [invitations]
      security: []
      summary: Accept an invitation and enter the family as the new caregiver
      description: |
        No session needed. Creates the caregiver in the inviting family with
        the invited role, name and permissions, starts a new session for
        that family (sets the pp_session cookie, replacing any session this
        browser had) and returns the family and the new member id to act
        as. Single use: 409 invitation_not_pending when it was already
        accepted, revoked or has expired. Recorded in the access log and
        sends a live update of kind invitation to parents.
      parameters:
        - $ref: "#/components/parameters/InvitationToken"
      responses:
        "201":
          description: Accepted; the session cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationAcceptance"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/access-log:
    get:
      operationId: listAccessLogEntries
      tags: [invitations]
      summary: What caregivers read and changed, last 30 days
      description: |
        Mother or partner only; a grandparent or nanny gets 403. Newest
        first. Lists what grandparents and nannies did (reads of the baby
        passport, care log entries, handoffs) and invitation events
        (created, accepted, revoked). A parent's own reads of sensitive
        records are not listed, so this never reveals the other parent's
        private activity.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessLogList"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
