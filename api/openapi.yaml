openapi: 3.0.3
info:
  title: Parenting Planner API
  version: 0.1.0
  description: |
    Contract between web/ and api/. Both sides generate code from this file
    (`make gen`); never edit generated code by hand. Change this file first,
    in its own PR or together with both implementations.

    Auth: there is no login. POST /demo/sessions creates a demo family and
    sets an httpOnly session cookie that scopes every other call to that family.
servers:
  - url: /api
security:
  - session: []
tags:
  - name: demo
  - name: family
  - name: plan
  - name: wellbeing
paths:
  /healthz:
    get:
      operationId: healthz
      security: []
      responses:
        "200":
          description: The API and its database are up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /demo/sessions:
    post:
      operationId: createDemoSession
      tags: [demo]
      security: []
      summary: Start a demo with a fresh copy of a synthetic family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDemoSessionRequest"
      responses:
        "201":
          description: Family created; the session cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family:
    get:
      operationId: getFamily
      tags: [family]
      summary: The family of the current session, with parents and children
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/plan:
    get:
      operationId: getMemberPlan
      tags: [plan]
      summary: This week's plan for one parent
      description: |
        Items come from the guideline rules engine, evaluated against the family
        data this parent is allowed to see. Each item says why it applies and
        cites its source.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/mood-checkins:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    post:
      operationId: createMoodCheckin
      tags: [wellbeing]
      summary: The acting parent records how they feel today
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoodCheckinInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoodCheckin"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listMoodCheckins
      tags: [wellbeing]
      summary: Check-ins from the last 30 days that the acting parent may see
      description: Their own check-ins plus the other parent's check-ins shared with them.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoodCheckinList"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/mood-patterns:
    get:
      operationId: listMoodPatterns
      tags: [wellbeing]
      summary: Patterns detected in the acting parent's own recent check-ins
      description: |
        Detected from the acting parent's own check-ins of the last 7 days, for
        example low mood on three days. Check-ins are private by default, so a
        pattern is computed only from the acting parent's own entries and is
        returned only to them. Nothing from the other parent's check-ins is
        used, even when those were shared. Empty list when there is no pattern.
        Wording is never diagnostic (docs/product.md, principle 3).
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoodPatternList"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    MemberId:
      name: memberId
      in: path
      required: true
      description: |
        The acting parent. There is no login, so the UI says which parent is
        using the app; the API checks that this parent belongs to the session's family.
      schema:
        type: string
        format: uuid

  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: pp_session


  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: not_found
        message:
          type: string

    DemoTemplate:
      type: string
      description: Which synthetic family to copy. Add a value here when its seed exists.
      enum: [pregnancy]

    CreateDemoSessionRequest:
      type: object
      required: [template]
      properties:
        template:
          $ref: "#/components/schemas/DemoTemplate"

    Stage:
      type: string
      description: Where the family is on the journey from planning to age 9.
      enum: [planning, trying, pregnancy, postpartum, infant, toddler, preschool, school_age]

    ParentRole:
      type: string
      enum: [mother, partner]

    Family:
      type: object
      required: [id, template, stage, parents, children]
      properties:
        id:
          type: string
          format: uuid
        template:
          $ref: "#/components/schemas/DemoTemplate"
        stage:
          $ref: "#/components/schemas/Stage"
        dueDate:
          type: string
          format: date
          description: Set during pregnancy.
        gestationalWeek:
          type: integer
          description: Completed weeks of pregnancy today, derived from dueDate.
        parents:
          type: array
          items:
            $ref: "#/components/schemas/Parent"
        children:
          type: array
          items:
            $ref: "#/components/schemas/Child"

    Parent:
      type: object
      required: [id, role, displayName]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ParentRole"
        displayName:
          type: string

    Child:
      type: object
      required: [id, name, birthDate, ageMonths]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        birthDate:
          type: string
          format: date
        ageMonths:
          type: integer

    Plan:
      type: object
      required: [memberId, generatedAt, items]
      properties:
        memberId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
        items:
          type: array
          description: Sorted by status (overdue, due, upcoming), then due date.
          items:
            $ref: "#/components/schemas/PlanItem"

    PlanItemStatus:
      type: string
      enum: [overdue, due, upcoming]

    PlanCategory:
      type: string
      enum: [screening, vaccine, visit, mental_health, logistics, couple, learning]

    PlanItem:
      type: object
      required: [ruleId, title, detail, status, category, reason, source]
      properties:
        ruleId:
          type: string
          example: glucose-screen
        title:
          type: string
        detail:
          type: string
          description: What to do, in plain language.
        status:
          $ref: "#/components/schemas/PlanItemStatus"
        category:
          $ref: "#/components/schemas/PlanCategory"
        dueBy:
          type: string
          format: date
        reason:
          type: string
          description: Why this applies to this parent now, based on their data.
        source:
          $ref: "#/components/schemas/Source"

    Source:
      type: object
      required: [title, url, checkedAt]
      properties:
        title:
          type: string
        url:
          type: string
        checkedAt:
          type: string
          format: date
          description: When someone last confirmed the guideline still says this.

    Visibility:
      type: string
      description: |
        Who besides the author may see a sensitive record.
        private = author only; partner = author and the other parent;
        care_team = author and their professionals, not the partner; family = both parents.
      enum: [private, partner, care_team, family]

    MoodCheckinInput:
      type: object
      required: [mood, energy, sleepHours, visibility]
      properties:
        mood:
          type: integer
          minimum: 1
          maximum: 5
          description: 1 = very low, 5 = very good.
        energy:
          type: integer
          minimum: 1
          maximum: 5
        sleepHours:
          type: number
          minimum: 0
          maximum: 24
          description: Hours slept in the last 24 hours.
        note:
          type: string
          maxLength: 500
        visibility:
          $ref: "#/components/schemas/Visibility"

    MoodCheckin:
      type: object
      required: [id, authorId, recordedAt, mood, energy, sleepHours, visibility]
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        recordedAt:
          type: string
          format: date-time
        mood:
          type: integer
        energy:
          type: integer
        sleepHours:
          type: number
        note:
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"

    MoodCheckinList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/MoodCheckin"

    MoodPatternKind:
      type: string
      description: |
        low_mood = mood at or below 2 on several days; low_mood_and_sleep = the
        same days also had under 6 hours of sleep.
      enum: [low_mood, low_mood_and_sleep]

    ProviderType:
      type: string
      description: Which kind of provider in the directory fits the pattern.
      enum: [perinatal_therapist, psychologist]

    MoodPattern:
      type: object
      required: [kind, startedOn, days, checkinIds, message, providerType, source]
      properties:
        kind:
          $ref: "#/components/schemas/MoodPatternKind"
        startedOn:
          type: string
          format: date
          description: Date of the first check-in in the pattern.
        days:
          type: integer
          description: Number of check-in days in the pattern.
        checkinIds:
          type: array
          description: The acting parent's check-ins that make up the pattern, oldest first.
          items:
            type: string
            format: uuid
        message:
          type: string
          description: Plain, kind and non-diagnostic. Describes what the check-ins show and suggests talking to someone.
        providerType:
          $ref: "#/components/schemas/ProviderType"
        source:
          $ref: "#/components/schemas/Source"

    MoodPatternList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MoodPattern"
