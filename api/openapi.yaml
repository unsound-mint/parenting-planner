  /members/{memberId}/guides:
    get:
      operationId: listGuides
      tags: [content]
      summary: Stage content for the acting person, filtered on the server
      description: |
        Every guide carries stage, week or age range and audience tags. The
        server returns only guides matching the family's stored stage, the
        current gestational week (pregnancy) or the child's age in months,
        and the acting person's role. A planning family never gets toddler
        content and the reverse.

        - Mother and partner: guides for parents and for their own role
          (some are partner-only, some mother-only).
        - Grandparent: caregiver guides; pregnancy guides only with the
          pregnancy_updates permission.
        - Nanny: caregiver guides only.

        Birth prep modules (kind birth_prep) come back from week 28 with
        locked true and unlock at week 32, counted from the due date. They
        are not returned after "Baby is home". Content is demo content,
        not medical advice; the UI says so.
      parameters:
        - $ref: "#/components/parameters/MemberId"
        - name: kind
          in: query
          required: false
          description: Only guides of this kind.
          schema:
            $ref: "#/components/schemas/GuideKind"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuideList"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/friends:
    get:
      operationId: getFriends
      tags: [friends]
      summary: Friend families, the updates shared with them, and the family's code
      description: |
        Friend families are other families this family connected with by an
        invite code, both sides agreeing. A friend sees only what a parent
        shared with friends, one item at a time (a moment, a week card, a
        note), as a copy: never the diary, mood, health records, plan or the
        child's records, and never a caregiver. Reactions are presets; there
        are no comments, no counts and no messages. On a friend's update the
        viewer sees only their own family's reactions; on their own family's
        updates they see who reacted. families lists accepted friends and
        pending requests both ways (a pending request shows names only).
        updates are the family's own and its accepted friends' from the last
        90 days, newest first. code is the family's current invite code, if
        one was made and has not expired. Mother and partner; a grandparent
        or nanny gets 404.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Friends"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/friend-code:
    post:
      operationId: createFriendCode
      tags: [friends]
      summary: Make a new invite code for friend families (replaces the old one)
      description: |
        The code lets another family send a request; it grants nothing until
        a parent here accepts. It expires after 7 days. Mother and partner;
        a grandparent or nanny gets 404.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendCode"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/friend-connections:
    post:
      operationId: createFriendConnection
      tags: [friends]
      summary: Ask to connect with the family whose code this is
      description: |
        Creates a pending request that the other family accepts or declines;
        nothing is shared before that. 404 code_not_found for an unknown or
        expired code, 409 own_code for the family's own code, 409
        already_connected when the two families already have a connection or
        a request. If the other family had already asked this one, the
        request is accepted instead. Mother and partner; a grandparent or
        nanny gets 404.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendCodeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendFamily"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/friend-connections/{connectionId}/accept:
    post:
      operationId: acceptFriendConnection
      tags: [friends]
      summary: Accept a friend family's request
      description: |
        Only the family that was asked can accept; anything else is 404.
        Mother and partner; a grandparent or nanny gets 404.
      parameters:
        - $ref: "#/components/parameters/MemberId"
        - name: connectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendFamily"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/friend-connections/{connectionId}:
    delete:
      operationId: deleteFriendConnection
      tags: [friends]
      summary: Disconnect, decline or cancel
      description: |
        Either side can end a connection or a request at any time. Each
        family's reactions on the other's updates are removed with it, and
        neither sees the other's updates again. Mother and partner; a
        grandparent or nanny gets 404.
      parameters:
        - $ref: "#/components/parameters/MemberId"
        - name: connectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: No content
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/friend-updates:
    post:
      operationId: createFriendUpdate
      tags: [friends]
      summary: Share one item with friend families
      description: |
        A copy of what the parent chose to share; it does not link to the
        record it came from. kind week gets a headline written by the server
        from the family's week or the child's age. Mother and partner; a
        grandparent or nanny gets 404.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendUpdateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendUpdate"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
