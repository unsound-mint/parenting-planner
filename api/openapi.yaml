  /billing/stripe-webhook:
    post:
      operationId: handleStripeWebhook
      tags: [billing]
      security: []
      summary: Stripe calls this when a checkout or subscription changes
      description: |
        Called by Stripe, never by the web app; no session. The server
        verifies the Stripe-Signature header against the raw body with
        the webhook secret (400 invalid_signature otherwise) before
        trusting anything. checkout.session.completed sets the family's
        tier and subscription from the session metadata;
        customer.subscription.deleted sets it back to free. Other event
        types are acknowledged and ignored. Idempotent by Stripe event id.
        Sends a live update of kind family.
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeEvent"
      responses:
        "200":
          description: Received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookReceipt"
        "400":
          description: Error
          content:
