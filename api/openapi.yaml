  /members/{memberId}/voice-notes:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    post:
      operationId: createVoiceNote
      tags: [carelog]
      summary: Upload a short voice note to attach to a handoff
      description: |
        Anyone with care_log (parents always; 403 for a caregiver without it).
        The body is the raw recording from the browser's MediaRecorder:
        audio/webm (Chrome, Firefox) or audio/mp4 (Safari); any other type is
        400. At most 1 MB (about a minute of speech): 413 too_large above
        that, checked while reading so a big upload is cut off early. Stored
        in the database with the family; a note not attached to a handoff
        within 24 hours is deleted. Attach it with HandoffInput.voiceNoteId.
      parameters:
        - name: durationSeconds
          in: query
          required: false
          description: Length of the recording as the browser measured it, for the player.
          schema:
            type: integer
            minimum: 1
            maximum: 120
      requestBody:
        required: true
        content:
          audio/*:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceNote"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

