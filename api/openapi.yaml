          format: uuid
        toMemberId:
          type: string
          format: uuid
        note:
          type: string
        shiftId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/HandoffStatus"
        createdAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
        careSummary:
          $ref: "#/components/schemas/CareSummary"
        voiceNote:
          $ref: "#/components/schemas/VoiceNote"

    HandoffList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Pending first, then newest first.
          items:
            $ref: "#/components/schemas/Handoff"

    LiveUpdateKind:
      type: string
      description: Which screens should refetch.
      enum: [family, task, shift, calendar_event, care_log, handoff, appointment_question, invitation, notification, leave_plan, diary_entry, insurance_call]

    LiveUpdate:
      type: object
      required: [kind, actorId, at]
      description: The data of one "update" event on getLiveUpdates. Never carries the record itself.
      properties:
        kind:
          $ref: "#/components/schemas/LiveUpdateKind"
        entityId:
          type: string
          description: The changed record, when there is one.
        actorId:
          type: string
          format: uuid
          description: Who made the change, so a screen can skip its own echo.
        at:
          type: string
          format: date-time

    EmergencyContact:
      type: object
      required: [name, relation, phone]
      properties:
        name:
          type: string
        relation:
          type: string
          example: Grandmother
        phone:
          type: string

    MedicalHistoryEntry:
      type: object
      required: [date, title]
      properties:
        date:
          type: string
          format: date
        title:
          type: string
          example: Newborn hearing screen passed
        detail:
          type: string

    MilestoneDomain:
      type: string
      enum: [social_emotional, language_communication, cognitive, movement_physical]

    Milestone:
      type: object
      required: [id, domain, text, observed]
      properties:
        id:
          type: string
          description: Stable key, for example 4y-language-sentences.
        domain:
          $ref: "#/components/schemas/MilestoneDomain"
        text:
          type: string
        observed:
          type: boolean
        observedOn:
          type: string
          format: date
          description: Set when observed.

    MilestoneInput:
      type: object
      required: [observed]
      properties:
        observed:
          type: boolean

    MilestoneChecklist:
      type: object
      required: [childId, checklistAgeMonths, items, source]
      properties:
        childId:
          type: string
          format: uuid
        checklistAgeMonths:
          type: integer
          description: Which CDC checklist this is (24, 36, 48 or 60).
        items:
          type: array
          items:
            $ref: "#/components/schemas/Milestone"
        source:
          $ref: "#/components/schemas/Source"

    ChildPassport:
      type: object
      required: [child, limitedView, allergies, emergencyContacts]
      properties:
        child:
          $ref: "#/components/schemas/Child"
        limitedView:
          type: boolean
          description: True for a grandparent or nanny; medicalHistory and vaccines are then absent.
        pediatrician:
          $ref: "#/components/schemas/CareTeamMember"
        allergies:
          type: array
          description: Suspected and confirmed. Empty means none known.
          items:
            $ref: "#/components/schemas/Allergy"
        emergencyContacts:
          type: array
          items:
            $ref: "#/components/schemas/EmergencyContact"
        medicalHistory:
          type: array
          description: Parents only. Newest first.
          items:
            $ref: "#/components/schemas/MedicalHistoryEntry"
        vaccines:
          type: array
          description: Parents only.
          items:
            $ref: "#/components/schemas/VaccineDose"

    CheckoutSessionInput:
      type: object
      required: [tier]
      properties:
        tier:
          $ref: "#/components/schemas/PaidTier"

    CheckoutSessionStatus:
      type: string
      description: As Stripe reports it.
      enum: [open, complete, expired]

    CheckoutSession:
      type: object
      required: [id, tier, status]
      properties:
        id:
          type: string
          description: Stripe Checkout Session id.
          example: cs_test_a1B2c3
        tier:
          $ref: "#/components/schemas/PaidTier"
        status:
          $ref: "#/components/schemas/CheckoutSessionStatus"
        url:
          type: string
          description: Stripe-hosted page to redirect to. Set while status is open.
        paid:
          type: boolean
          description: True once Stripe reports payment_status paid.

    StripeEvent:
      type: object
      required: [id, type, data]
      description: The parts of a Stripe event the server reads; Stripe sends more.
      properties:
        id:
          type: string
        type:
          type: string
          example: checkout.session.completed
        data:
          type: object
          additionalProperties: true

    WebhookReceipt:
      type: object
      required: [received]
      properties:
        received:
          type: boolean

    NotificationKind:
      type: string
      description: |
        What happened, and who receives it. The web maps a kind and
        entityId to a screen.
        task_offered = a task was offered to the recipient (entityId: task);
        task_offer_answered = the other person accepted or declined the
        recipient's offer (task); handoff_received = a handoff to the
        recipient is waiting (handoff); handoff_accepted = the recipient's
        handoff was taken (handoff); plan_item_due = one of the recipient's
        own plan items became due or overdue (entityId: ruleId);
        value_flagged = one of the recipient's own lab results (or their
        child's, for both parents) got a LabFlag (lab result id; never sent
        to caregivers or the other parent for a parent's own record); appointment_reminder = the recipient's
        appointment is tomorrow (calendar event); invitation_accepted = a
        caregiver the recipient invited joined (invitation);
        subscription_started = the family's paid plan started (both
        parents); labour_started = the other parent tapped "Going to the
        hospital" (entityId: the sender, createLabourAlert);
        love_sent = a grandparent sent love from the postcard (both parents;
        entityId and actorId: the grandparent).
      enum: [task_offered, task_offer_answered, handoff_received, handoff_accepted, plan_item_due, value_flagged, appointment_reminder, invitation_accepted, subscription_started, labour_started, love_sent]

    Notification:
      type: object
      required: [id, kind, title, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/NotificationKind"
        title:
          type: string
          description: A fixed template filled with names and dates only, never health values or private text.
          example: Jake offered you "Install the car seat"
        entityId:
          type: string
          description: The record to open (a uuid, or a ruleId for plan_item_due).
        actorId:
          type: string
          format: uuid
          description: Who caused it, when a person did.
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time

    NotificationList:
      type: object
      required: [items, unreadCount]
      properties:
        items:
          type: array
          description: Newest first, last 30 days, at most 50.
          items:
            $ref: "#/components/schemas/Notification"
        unreadCount:
          type: integer

    NotificationReadInput:
      type: object
      properties:
        ids:
          type: array
          description: Leave out to mark all as read.
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid

    Postcard:
      type: object
      required: [kind, stage, period, headline, source, loves, loveSentToday]
      properties:
        kind:
          type: string
          enum: [pregnancy, baby]
        stage:
          $ref: "#/components/schemas/Stage"
        period:
          type: string
          description: '"Week 25" or "Week 8 of life", "4 years".'
          example: Week 25
        headline:
          type: string
          description: The size line in pregnancy ("About the size of a zucchini") or the stage headline after birth.
          example: About the size of a zucchini
        comparison:
          type: string
          description: Pregnancy only. The size comparison, for the illustration.
          example: a zucchini
        detail:
          type: string
          description: One plain sentence on what is happening now. Pregnancy uses the development line of the weekly card.
        source:
          $ref: "#/components/schemas/Source"
        line:
          $ref: "#/components/schemas/PostcardLine"
        loves:
          type: array
          description: Newest first, last 7 days, at most 20. Parents see every heart received, a grandparent only their own.
          items:
            $ref: "#/components/schemas/PostcardLove"
        loveSentToday:
          type: boolean
          description: True when the acting grandparent already sent a heart on the family's today. Always false for parents.

    PostcardLine:
      type: object
      required: [text, authorName, updatedAt]
      properties:
        text:
          type: string
          maxLength: 140
        authorName:
          type: string
        updatedAt:
          type: string
          format: date-time

    PostcardLove:
      type: object
      required: [id, fromName, sentAt]
      properties:
        id:
          type: string
          format: uuid
        fromName:
          type: string
        message:
          type: string
          maxLength: 140
        sentAt:
          type: string
          format: date-time

    PostcardLineInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 140
          description: Empty clears this week's line.

    PostcardLoveInput:
      type: object
      properties:
        message:
          type: string
          maxLength: 140

    CalendarFeedScope:
      type: string
      description: mine = the person's own events and shifts; family = what scope family shows them (parents only).
      enum: [mine, family]

    CalendarFeedInput:
      type: object
      required: [scope]
      properties:
        scope:
          $ref: "#/components/schemas/CalendarFeedScope"

    CalendarFeed:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
        scope:
          $ref: "#/components/schemas/CalendarFeedScope"
        url:
          type: string
          description: The secret subscription URL (https://.../api/calendar-feeds/<token>). Only in the createCalendarFeed response.
        createdAt:
          type: string
          format: date-time
        lastFetchedAt:
          type: string
          format: date-time

    LeavePlanInput:
      type: object
      required: [state, employerEmployees, monthsEmployed, hoursLast12Months]
      description: The wizard's answers for one parent. Nothing about health.
      properties:
        state:
          $ref: "#/components/schemas/UsState"
        employerEmployees:
          type: integer
          minimum: 0
          maximum: 1000000
          description: People the employer has at or near the parent's worksite; 0 for self-employed.
        monthsEmployed:
          type: integer
          minimum: 0
          maximum: 600
          description: Months with the current employer.
        hoursLast12Months:
          type: integer
          minimum: 0
          maximum: 8784
        startsOn:
          type: string
          format: date
          description: First day of leave. Leave out to start on the due date or birth date.
        weeksWanted:
          type: integer
          minimum: 1
          maximum: 52

    LeaveEligibility:
      type: string
      description: unknown = the answers are not enough to tell; the reason says what to ask HR.
      enum: [eligible, not_eligible, unknown]

    LeaveProgramKind:
      type: string
      description: job_protection = your job is held but unpaid; paid_leave = wage replacement; both = the program does both.
      enum: [job_protection, paid_leave, both]

    LeaveProgram:
      type: object
      required: [id, name, kind, eligibility, reason, source]
      properties:
        id:
          type: string
          description: Catalog slug, for example fmla or ca_pfl.
        name:
          type: string
        kind:
          $ref: "#/components/schemas/LeaveProgramKind"
        eligibility:
          $ref: "#/components/schemas/LeaveEligibility"
        weeks:
          type: integer
          description: Weeks this parent can take under the program, when eligible.
        pay:
          type: string
          description: What it pays, in plain words, for paid programs.
        reason:
          type: string
          description: Which answers decided the eligibility.
        source:
          $ref: "#/components/schemas/Source"

    LeaveSegment:
      type: object
      required: [startsOn, endsOn, programIds, paid, jobProtected]
      description: One stretch of the timeline where the same programs apply.
      properties:
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        programIds:
          type: array
          items:
            type: string
        paid:
          type: boolean
        jobProtected:
          type: boolean

    LeaveDeadline:
      type: object
      required: [title, dueOn, source]
      properties:
        title:
          type: string
          example: Give your employer written notice
        dueOn:
          type: string
          format: date
        programId:
          type: string
        taskId:
          type: string
          format: uuid
          description: The paperwork task for the same step, when the checklist has one.
        source:
          $ref: "#/components/schemas/Source"

    ParentLeave:
      type: object
      required: [memberId, role, programs, segments, deadlines]
      properties:
        memberId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ParentRole"
        input:
          $ref: "#/components/schemas/LeavePlanInput"
        programs:
          type: array
          items:
            $ref: "#/components/schemas/LeaveProgram"
        segments:
          type: array
          description: Oldest first; together they make the parent's lane on the timeline.
          items:
            $ref: "#/components/schemas/LeaveSegment"
        deadlines:
          type: array
          description: Soonest first.
          items:
            $ref: "#/components/schemas/LeaveDeadline"

    LeavePlan:
      type: object
      required: [parents]
      properties:
        parents:
          type: array
          description: The acting parent first, then the other parent.
          items:
            $ref: "#/components/schemas/ParentLeave"

    BudgetCategory:
      type: string
      enum: [pregnancy_care, delivery, equipment, childcare, leave, food, health, other]

    BudgetCadence:
      type: string
      description: once is a single cost; monthly repeats and counts twelve times in the first-year total.
      enum: [once, monthly]

    BudgetPayer:
      type: string
      enum: [mother, partner, shared]

    BudgetItemInput:
      type: object
      required: [category, name, amountCents, cadence, payer]
      properties:
        category:
          $ref: "#/components/schemas/BudgetCategory"
        name:
          type: string
          minLength: 1
          maxLength: 80
        amountCents:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000000
          description: US cents.
        cadence:
          $ref: "#/components/schemas/BudgetCadence"
        payer:
          $ref: "#/components/schemas/BudgetPayer"

    BudgetItem:
      allOf:
        - $ref: "#/components/schemas/BudgetItemInput"
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid

    BudgetTotal:
      type: object
      required: [oneTimeCents, monthlyCents, firstYearCents]
      properties:
        oneTimeCents:
          type: integer
          format: int64
        monthlyCents:
          type: integer
          format: int64
        firstYearCents:
          type: integer
          format: int64
          description: oneTime plus twelve months.

    BudgetCategoryTotal:
      allOf:
        - $ref: "#/components/schemas/BudgetTotal"
        - type: object
          required: [category]
          properties:
            category:
              $ref: "#/components/schemas/BudgetCategory"

    BudgetPayerTotal:
      allOf:
        - $ref: "#/components/schemas/BudgetTotal"
        - type: object
          required: [payer]
          properties:
            payer:
              $ref: "#/components/schemas/BudgetPayer"

    BudgetSuggestion:
      type: object
      description: A starter line the family may add. The amount is a rough starting point, not advice.
      required: [category, name, amountCents, cadence, payer]
      properties:
        category:
          $ref: "#/components/schemas/BudgetCategory"
        name:
          type: string
        amountCents:
          type: integer
          format: int64
        cadence:
          $ref: "#/components/schemas/BudgetCadence"
        payer:
          $ref: "#/components/schemas/BudgetPayer"
        source:
          $ref: "#/components/schemas/Source"

    Budget:
      type: object
      required: [items, total, byCategory, byPayer, suggestions]
      properties:
        items:
          type: array
          description: Oldest first.
          items:
            $ref: "#/components/schemas/BudgetItem"
        total:
          $ref: "#/components/schemas/BudgetTotal"
        byCategory:
          type: array
          description: Only categories that have items, biggest first-year total first.
          items:
            $ref: "#/components/schemas/BudgetCategoryTotal"
        byPayer:
          type: array
          description: Mother, partner, shared; always all three.
          items:
            $ref: "#/components/schemas/BudgetPayerTotal"
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/BudgetSuggestion"

    BirthCostInput:
      type: object
      required: [deductibleCents, outOfPocketMaxCents, coinsurancePercent, alreadyPaidCents]
      properties:
        deductibleCents:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000000
        outOfPocketMaxCents:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000000
        coinsurancePercent:
          type: integer
          minimum: 0
          maximum: 100
          description: The share you pay after the deductible.
        alreadyPaidCents:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000000
          description: Already spent this plan year; counts toward the deductible and the out-of-pocket maximum.

    BirthCostRange:
      type: object
      required: [lowCents, highCents]
      properties:
        lowCents:
          type: integer
          format: int64
        highCents:
          type: integer
          format: int64

    BirthCostScenario:
      type: object
      required: [kind, typicalBilledCents, birth, newborn, total, hitsMaximum]
      properties:
        kind:
          type: string
          enum: [vaginal, cesarean]
        typicalBilledCents:
          type: integer
          format: int64
          description: What the source reports insurers and patients together paid, on average, for the birth stay and the newborn.
        birth:
          allOf:
            - $ref: "#/components/schemas/BirthCostRange"
          description: Your estimated share for the birth.
        newborn:
          allOf:
            - $ref: "#/components/schemas/BirthCostRange"
          description: Your estimated share for the newborn's first months.
        total:
          $ref: "#/components/schemas/BirthCostRange"
        hitsMaximum:
          type: boolean
          description: True when the high end reaches the out-of-pocket maximum, so it cannot go higher this plan year.

    BirthCostPlan:
      type: object
      required: [estimateNote, scenarios, billingLines, questions, enrollment, sources]
      properties:
        input:
          $ref: "#/components/schemas/BirthCostInput"
        estimateNote:
          type: string
          description: Fixed wording that says this is an estimate. The web shows it loudly.
        scenarios:
          type: array
          description: Empty until a parent saves their plan numbers. Vaginal, then cesarean.
          items:
            $ref: "#/components/schemas/BirthCostScenario"
        referenceOutOfPocket:
          type: object
          description: What people with employer coverage actually paid out of pocket on average, for comparison.
          required: [vaginalCents, cesareanCents, newbornCents]
          properties:
            vaginalCents:
              type: integer
              format: int64
            cesareanCents:
              type: integer
              format: int64
            newbornCents:
              type: integer
              format: int64
        billingLines:
          type: array
          description: Bills a family usually sees, so none is a surprise. Names only, no amounts.
          items:
            type: string
        questions:
          type: array
          description: Questions to ask the insurer and the hospital.
          items:
            type: string
        enrollment:
          type: object
          required: [summary, source]
          properties:
            summary:
              type: string
            source:
              $ref: "#/components/schemas/Source"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"

    InsuranceCallTopic:
      type: string
      enum: [coverage, claim, prior_authorization, add_baby, billing, other]

    InsuranceCallInput:
