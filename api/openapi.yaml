  /members/{memberId}/psychologist-bookings/{bookingId}:
    parameters:
      - $ref: "#/components/parameters/MemberId"
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updatePsychologistBooking
      tags: [care]
      summary: The acting parent moves one of their upcoming sessions to another open slot
      description: |
        Only the parent's own bookings that have not started; any other id is
        404 no_booking. 409 slot_taken when the new slot is unknown, past or
        already booked by this parent. A brief scheduled for the session moves
        with it: it is sent the day before the new time. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PsychologistBookingInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PsychologistBooking"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deletePsychologistBooking
      tags: [care]
      summary: The acting parent cancels one of their upcoming sessions
      description: |
        Only the parent's own bookings that have not started (a past session
        keeps its note); any other id is 404 no_booking. The slot opens again.
        A brief that was waiting to be sent goes back to a draft, so nothing is
        sent for a cancelled session. Audited.
      responses:
        "204":
          description: Cancelled
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/session-brief:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    get:
      operationId: getSessionBrief
      tags: [care]
      summary: The acting parent's brief for their next psychologist session
      description: |
        The brief is what the parent chooses to send their psychologist before
        a session: the agenda topics, the text of the journal entries they
        picked, an optional summary of their own mood check-ins and a note.
        Nothing reaches the psychologist until the parent schedules or sends
        it. While a draft, items and mood are built from the parent's current
        agenda and check-ins; once scheduled or sent they are the copy frozen
        at that moment. A scheduled brief counts as sent from sendAt (the day
        before the session) on the family's clock. Always 200: with nothing
        saved yet it is an empty draft. Private to the author; the partner
        reads their own brief. Audited.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionBrief"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: updateSessionBrief
      tags: [care]
      summary: The acting parent saves, schedules or sends their brief
      description: |
        status draft saves the choices and cancels a scheduled send.
        scheduled freezes the brief and sends it the day before the next
        session (when the session is less than a day away it is sent at
        once). sent freezes it and marks it sent now, for a brief the parent
        delivered themselves (the printed copy). Both need a booked session:
        409 no_session otherwise. 409 brief_sent once it has been sent. sharedEntryIds are the
        parent's own journal entries on the agenda whose text goes with the
        brief; any other id is 400 unknown_entry. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionBriefInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionBrief"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/session-notes:
    post:
      operationId: createSessionNote
      tags: [care]
      summary: The acting parent writes a short note after a session
      description: |
        Always private to the author; there is no visibility field and the
        server never widens it. The note feeds the author's next weekly plan.
        The booking must belong to the acting parent and must have started.
      parameters:
