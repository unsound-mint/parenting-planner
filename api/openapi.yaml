        sizeBytes:
          type: integer
        durationSeconds:
          type: integer
        createdAt:
          type: string
          format: date-time

    VaccineDoseUpdate:
      type: object
      required: [givenOn]
      properties:
        givenOn:
          type: string
          format: date
