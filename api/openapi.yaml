        followUpOn:
          type: string
          format: date
        visibility:
          $ref: "#/components/schemas/Visibility"

    InsuranceCall:
      type: object
      required: [id, authorId, calledAt, insurer, topic, summary, visibility, createdAt]
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        calledAt:
          type: string
          format: date-time
        insurer:
          type: string
        representative:
          type: string
        referenceNumber:
          type: string
        topic:
          $ref: "#/components/schemas/InsuranceCallTopic"
        summary:
          type: string
        followUpOn:
          type: string
          format: date
        visibility:
          $ref: "#/components/schemas/Visibility"
        createdAt:
          type: string
          format: date-time

    InsuranceCallList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/InsuranceCall"

    DiaryEntryInput:
      type: object
      required: [body, visibility]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
        visibility:
          $ref: "#/components/schemas/Visibility"
        agendaTopic:
          type: string
          maxLength: 120
          description: A short topic for the author's next psychologist session, never the entry text.
        mood:
          $ref: "#/components/schemas/DiaryMood"
        first:
          type: boolean
          description: |
            The author marks the entry as one of the baby's or the family's
            firsts (first kick, first smile). A label on the entry with the
            entry's visibility; a shared first is what a family story can show.
            Default false.

    DiaryMood:
      type: integer
      minimum: 1
      maximum: 5
      description: |
        How the author felt when writing, on the MoodCheckin.mood scale (1 =
        very low, 5 = very good). Optional; the author can change it later.
        It is part of the entry, so it has the entry's visibility: whoever may
        read the entry sees it. It is not a mood check-in and does not feed
        mood patterns, agenda topics or the plan.

    DiaryEntryUpdate:
      type: object
      required: [visibility]
      properties:
        visibility:
          $ref: "#/components/schemas/Visibility"
        agendaTopic:
          type: string
          maxLength: 120
          description: Set or change the agenda topic; an empty string removes it. Leave out to keep it.
        first:
          type: boolean
          description: Mark or unmark the entry as a first. Leave out to keep it.
        body:
          type: string
          minLength: 1
          maxLength: 5000
          description: New text for the entry. Leave out to keep it.
        mood:
          $ref: "#/components/schemas/DiaryMood"

    DiaryEntry:
      type: object
      required: [id, authorId, writtenAt, body, visibility, first]
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        writtenAt:
          type: string
          format: date-time
        body:
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"
        agendaTopic:
          type: string
          description: Only on the author's own entries.
        mood:
          $ref: "#/components/schemas/DiaryMood"
        first:
          type: boolean
          description: True when the author marked the entry as a first.

    DiaryEntryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/DiaryEntry"

    ScreeningInstrument:
      type: string
      description: epds = Edinburgh Postnatal Depression Scale, for either parent around pregnancy and birth; phq9 = Patient Health Questionnaire-9.
      enum: [epds, phq9]

    ScreeningChoice:
      type: object
      required: [value, label]
      properties:
        value:
          type: integer
          minimum: 0
          maximum: 3
        label:
          type: string

    ScreeningQuestion:
      type: object
      required: [number, text, choices]
      properties:
        number:
          type: integer
          minimum: 1
        text:
          type: string
        choices:
          type: array
          description: In the order the instrument prints them; values are the instrument's scores.
          items:
            $ref: "#/components/schemas/ScreeningChoice"

    ScreeningQuestionnaire:
      type: object
      required: [instrument, title, intro, questions, suggested, source]
      properties:
        instrument:
          $ref: "#/components/schemas/ScreeningInstrument"
        title:
          type: string
        intro:
          type: string
          description: The instrument's own instruction, including the period it asks about.
        questions:
          type: array
          items:
            $ref: "#/components/schemas/ScreeningQuestion"
        suggested:
          type: boolean
          description: True when this parent's plan asks for this questionnaire now.
        source:
          $ref: "#/components/schemas/Source"

    ScreeningQuestionnaireList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScreeningQuestionnaire"

    MoodScreeningInput:
      type: object
      required: [instrument, answers, visibility]
      properties:
        instrument:
          $ref: "#/components/schemas/ScreeningInstrument"
        answers:
          type: array
          description: One score per question, in order.
          minItems: 1
          maxItems: 10
          items:
            type: integer
            minimum: 0
            maximum: 3
        visibility:
          $ref: "#/components/schemas/Visibility"

    ScreeningBand:
      type: string
      description: |
        green = below the instrument's cutoff; amber = near it, repeat in
        two weeks and mention it at the next visit; red = at or above it,
        talk to a doctor or midwife soon. Cutoffs come from the
        instrument's source and are never a diagnosis.
      enum: [green, amber, red]

    MoodScreeningResult:
      type: object
      required: [id, authorId, instrument, takenAt, score, maxScore, band, urgent, source, visibility]
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        instrument:
          $ref: "#/components/schemas/ScreeningInstrument"
        takenAt:
          type: string
          format: date-time
        score:
          type: integer
        maxScore:
          type: integer
        band:
          $ref: "#/components/schemas/ScreeningBand"
        urgent:
          type: boolean
          description: The self-harm question was answered above its lowest value. Open the fixed crisis screen. Always false for someone else's result.
        message:
          type: string
          description: Fixed wording for the band, never generated. Only on the author's own results.
        source:
          $ref: "#/components/schemas/Source"
        visibility:
          $ref: "#/components/schemas/Visibility"

    MoodScreeningList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/MoodScreeningResult"

    MoodScreeningUpdate:
      type: object
      required: [visibility]
      properties:
        visibility:
          $ref: "#/components/schemas/Visibility"

    MoodScreeningDraftInput:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          description: Scores given so far, in question order. May be empty.
          maxItems: 10
          items:
            type: integer
            minimum: 0
            maximum: 3

    MoodScreeningDraft:
      type: object
      required: [instrument, answers, updatedAt]
      properties:
        instrument:
          $ref: "#/components/schemas/ScreeningInstrument"
        answers:
          type: array
          description: Scores given so far, in question order; the next question is answers.length + 1.
          items:
            type: integer
            minimum: 0
            maximum: 3
        updatedAt:
          type: string
          format: date-time

    MoodScreeningDraftList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MoodScreeningDraft"

    PregnancyLossInput:
      type: object
      description: Everything is optional so the flow can ask as little as possible.
      properties:
        occurredOn:
          type: string
          format: date
          description: Today or earlier; a future date is 400.

    PregnancyLoss:
      type: object
      required: [recordedAt]
      description: Set while the family is in pregnancy loss support.
      properties:
        recordedAt:
          type: string
          format: date-time
        occurredOn:
          type: string
          format: date

    PartnerOfferInput:
      type: object
      required: [partnerName, title, detail, url, stages, audience, active]
      properties:
        partnerName:
          type: string
          minLength: 1
          maxLength: 60
        title:
          type: string
          minLength: 1
          maxLength: 80
        detail:
          type: string
          minLength: 1
          maxLength: 300
        url:
          type: string
          pattern: "^https://"
          maxLength: 500
        stages:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Stage"
        audience:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ParentRole"
        active:
          type: boolean

    PartnerOfferUpdate:
      type: object
      minProperties: 1
      properties:
        partnerName:
          type: string
          minLength: 1
          maxLength: 60
        title:
          type: string
          minLength: 1
          maxLength: 80
        detail:
          type: string
          minLength: 1
          maxLength: 300
        url:
          type: string
          pattern: "^https://"
          maxLength: 500
        stages:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Stage"
        audience:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ParentRole"
        active:
          type: boolean

    PartnerOffer:
      type: object
      required: [id, partnerName, title, detail, url, stages, audience, active]
      properties:
        id:
          type: string
          format: uuid
        partnerName:
          type: string
        title:
          type: string
        detail:
          type: string
        url:
          type: string
        stages:
          type: array
          items:
            $ref: "#/components/schemas/Stage"
        audience:
          type: array
          items:
            $ref: "#/components/schemas/ParentRole"
        active:
          type: boolean
        clicks:
          type: integer
          description: Only in listAllPartnerOffers.

    PartnerOfferList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PartnerOffer"

    ContentKind:
      type: string
      description: |
        pregnancy_week = a weekly pregnancy card (body: development);
        guide = a guide or birth prep module (body: summary);
        simulator_question = a practice question (body: the prompt);
        checklist_item = a paperwork or hospital bag catalog item (body:
        detail). Health content keeps its catalog Source.
      enum: [pregnancy_week, guide, simulator_question, checklist_item]

    ContentItem:
      type: object
      required: [kind, id, title, body, edited]
      properties:
        kind:
          $ref: "#/components/schemas/ContentKind"
        id:
          type: string
          description: The catalog slug.
        title:
          type: string
        body:
          type: string
        edited:
          type: boolean
          description: True when this demo copy changed it.
        updatedAt:
          type: string
          format: date-time
        source:
          $ref: "#/components/schemas/Source"

    ContentItemList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentItem"

    ContentItemUpdate:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        body:
          type: string
          minLength: 1
          maxLength: 4000

    AnalyticsMetric:
      type: string
      description: Each is a count of events, never of health records.
      enum: [demo_started, custom_family_started, task_created, task_done, handoff_created, care_log_entry_created, simulator_round_played, booking_requested, invitation_accepted, checkout_started, checkout_paid, partner_offer_clicked]

    AnalyticsDay:
      type: object
      required: [date, count]
      properties:
        date:
          type: string
          format: date
        count:
          type: integer

    AnalyticsSeries:
      type: object
      required: [metric, total, days]
      properties:
        metric:
          $ref: "#/components/schemas/AnalyticsMetric"
        total:
          type: integer
        days:
          type: array
          description: Oldest first, one per day in the window, zeros included.
          items:
            $ref: "#/components/schemas/AnalyticsDay"

    TemplateCount:
      type: object
      required: [template, families]
      properties:
        template:
          $ref: "#/components/schemas/DemoTemplate"
        families:
          type: integer

    Analytics:
      type: object
      required: [from, to, generatedAt, templates, series]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        generatedAt:
          type: string
          format: date-time
        templates:
          type: array
          description: Demo families started in the window, per template.
          items:
            $ref: "#/components/schemas/TemplateCount"
        series:
          type: array
          description: One per AnalyticsMetric, in enum order.
          items:
            $ref: "#/components/schemas/AnalyticsSeries"

    VoiceNote:
      type: object
      required: [id, contentType, sizeBytes, createdAt]
      properties:
        id:
          type: string
          format: uuid
        contentType:
          type: string
          example: audio/webm
        sizeBytes:
          type: integer
        durationSeconds:
          type: integer
        createdAt:
          type: string
          format: date-time

    Story:
      type: object
      required: [chapters, next]
      properties:
        chapters:
          type: array
          description: Oldest first. The last one is the chapter the family is in now.
          items:
            $ref: "#/components/schemas/StoryChapter"
        next:
          type: array
          description: What writes the next pages, most likely first. At least one.
          items:
            $ref: "#/components/schemas/StoryInvitation"

    StoryChapterKind:
      type: string
      description: |
        getting_ready = planning and trying; trimester_1 to trimester_3 =
        pregnancy weeks 1 to 13, 14 to 27 and 28 to 40; newborn = the first
        12 weeks of life; first_year = 3 to 11 months; toddler = 1 to 2
        years; preschool = 3 and 4 years; school_age = 5 years and up.
      enum: [getting_ready, trimester_1, trimester_2, trimester_3, newborn, first_year, toddler, preschool, school_age]

    StoryChapter:
      type: object
      required: [kind, title, startsOn, current, stage, moments]
      properties:
        kind:
          $ref: "#/components/schemas/StoryChapterKind"
        title:
          type: string
          description: A warm chapter title, for example "The secret weeks" or "Leo is home".
          example: Getting to know you
        span:
          type: string
          description: The chapter's range in plain words, for example "Weeks 14 to 27".
          example: Weeks 14 to 27
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
          description: Absent for the chapter the family is in now.
        current:
          type: boolean
        stage:
          $ref: "#/components/schemas/Stage"
        comparison:
          type: string
          description: Pregnancy chapters only. The baby's size at the last week of the chapter the family reached, for the illustration.
          example: an eggplant
        moments:
          type: array
          description: Oldest first. May be empty only for the current chapter, which then carries the invitations in Story.next.
          items:
            $ref: "#/components/schemas/StoryMoment"

    StoryMomentKind:
      type: string
      description: |
        pregnancy_week = a key week passed, with its sourced size;
        appointment = a past visit with visibility family; journal = a
        shared journal line (first marks a "First!"); baby_home = the day
        the baby came home; care_log = feeds, sleep and changes logged,
        with count and who logged; handoff = the baby handed from one
        person to another; vaccines = doses given on one day; stage_line =
        a sourced "most babies by" line for an age passed; lesson_read =
        a lesson finished; quiz_compared = both parents answered a lesson's
        quiz; names_liked = names both parents like; couple_talk = a talk
        prompt marked as talked about.
      enum: [pregnancy_week, appointment, journal, baby_home, care_log, handoff, vaccines, stage_line, lesson_read, quiz_compared, names_liked, couple_talk]

    StoryMoment:
      type: object
      required: [id, kind, on, title, peopleIds]
      properties:
        id:
          type: string
          description: Stable within the family, for list keys.
          example: week-20
        kind:
          $ref: "#/components/schemas/StoryMomentKind"
        "on":
          type: string
          format: date
        title:
          type: string
          description: One line, written from the data.
          example: Halfway there, about the size of a banana
        detail:
          type: string
          description: A second, quieter line.
        quote:
          type: string
          description: Journal moments only, the shared text, at most 280 characters.
        first:
          type: boolean
          description: Journal moments only, the author marked it as a first.
        peopleIds:
          type: array
          description: Who did it (Family.parents and Family.caregivers ids), so each shows with their avatar. Empty for content lines.
          items:
            type: string
            format: uuid
        week:
          type: integer
          description: pregnancy_week only.
        comparison:
          type: string
          description: pregnancy_week only, the size comparison with its article.
          example: a banana
        count:
          type: integer
          description: care_log, handoff, vaccines and names_liked, how many.
        names:
          type: array
          description: names_liked only, the names both parents like, oldest first.
          items:
            type: string
        sources:
          type: array
          description: Content-derived moments (pregnancy_week, stage_line) carry the pages they paraphrase.
          items:
            $ref: "#/components/schemas/Source"

    StoryInvitation:
      type: object
      required: [kind, title]
      properties:
        kind:
          $ref: "#/components/schemas/StoryMomentKind"
        title:
          type: string
          description: Completes "The next page is written when...".
          example: you both like the same name
        "on":
          type: string
          format: date
          description: When it will happen by itself, for dated pages (the next key week).
    Portrait:
      type: object
      description: |
        One frame of the flipbook. A child's portrait has childId and month; a
        bump photo has week and no childId.
      required: [id, kind, createdAt]
      properties:
        id:
          type: string
          format: uuid
        childId:
          type: string
          format: uuid
        month:
          type: integer
          description: The child's age in whole months.
        week:
          type: integer
          description: The pregnancy week of a bump photo.
        kind:
          type: string
          enum: [photo, illustration]
          description: photo is an upload served by getPortraitImage; illustration is seeded demo art the web draws.
        width:
          type: integer
          description: Pixels, photos only.
        height:
          type: integer
          description: Pixels, photos only.
        uploadedBy:
          type: string
          format: uuid
          description: The parent who uploaded a photo.
        createdAt:
          type: string
          format: date-time

    PortraitList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Portrait"

    VirtualBabyMode:
      type: string
      description: |
        evening = six simulated hours (18:00 to midnight), a few minutes to play;
        challenge = the 48-hour challenge, two simulated days and nights played
        in short sittings.
      enum: [evening, challenge]

    VirtualBabyNeed:
      type: string
      enum: [hungry, wet, sleepy, fussy]

    VirtualBabyAction:
      type: string
      description: What a choice does, so the baby can react (offer a feed, change the diaper, lay her down, comfort her, wait, step away to calm down, carry her somewhere else).
      enum: [offer_feed, change_diaper, lay_down, comfort, wait, step_away, carry]

    VirtualBabyFit:
      type: string
      description: |
        recommended = what the guideline says; another_way = the feedback
        shows a safer or easier way. Never totalled into a score.
      enum: [recommended, another_way]

    VirtualBabySessionInput:
      type: object
      required: [mode]
      properties:
        mode:
          $ref: "#/components/schemas/VirtualBabyMode"

    VirtualBabySessionUpdate:
      type: object
      required: [finished]
      properties:
        finished:
          type: boolean
          enum: [true]
          description: End the session now.

    VirtualBabyMomentInput:
      type: object
      required: [seq, choiceId]
      properties:
        seq:
          type: integer
          minimum: 0
          description: The moment being answered, VirtualBabySession.next.seq.
        choiceId:
          type: string
          minLength: 1
          maxLength: 40

    VirtualBabyChoice:
      type: object
      required: [id, label, action]
      properties:
        id:
          type: string
        label:
          type: string
        action:
          $ref: "#/components/schemas/VirtualBabyAction"

    VirtualBabyPrompt:
      type: object
      description: The moment the baby is waiting on.
      required: [seq, minute, need, scenarioId, title, cue, choices]
      properties:
        seq:
          type: integer
        minute:
          type: integer
          description: Simulated minutes since the session started.
        need:
          $ref: "#/components/schemas/VirtualBabyNeed"
        scenarioId:
          type: string
        title:
          type: string
          example: Hands to mouth
        cue:
          type: string
          description: What the baby is doing, in one or two sentences.
        choices:
          type: array
          items:
            $ref: "#/components/schemas/VirtualBabyChoice"

    VirtualBabyFeedback:
      type: object
      required: [fit, headline, why, source]
      properties:
        fit:
          $ref: "#/components/schemas/VirtualBabyFit"
        headline:
          type: string
        why:
          type: string
        source:
          $ref: "#/components/schemas/Source"

    VirtualBabyMoment:
      type: object
      description: A moment someone handled.
      required: [seq, minute, need, scenarioId, title, choiceId, choiceLabel, action, handledBy, handledAt, feedback]
      properties:
        seq:
          type: integer
        minute:
          type: integer
        need:
          $ref: "#/components/schemas/VirtualBabyNeed"
        scenarioId:
          type: string
        title:
          type: string
        choiceId:
          type: string
        choiceLabel:
          type: string
        action:
          $ref: "#/components/schemas/VirtualBabyAction"
        handledBy:
          type: string
          format: uuid
          description: The parent who answered.
        handledAt:
          type: string
          format: date-time
        feedback:
          $ref: "#/components/schemas/VirtualBabyFeedback"

    VirtualBabyNeedClock:
      type: object
      description: |
        How a need builds up on the simulated clock: the level at minute m is
        (m - since) / every, capped at 1. The web app draws it as a meter.
      required: [need, since, every]
      properties:
        need:
          $ref: "#/components/schemas/VirtualBabyNeed"
        since:
          type: integer
          description: Simulated minute this need was last cared for.
        every:
          type: integer
          description: Simulated minutes until it is full again.

    VirtualBabyPractised:
      type: object
      description: One topic of the "what you practised" summary, counted per parent.
      required: [need, byMember]
      properties:
        need:
          $ref: "#/components/schemas/VirtualBabyNeed"
        byMember:
          type: array
          items:
            $ref: "#/components/schemas/VirtualBabyCount"

    VirtualBabyCount:
      type: object
      required: [memberId, count]
      properties:
        memberId:
          type: string
          format: uuid
        count:
          type: integer

    VirtualBabySession:
      type: object
      required: [id, mode, startedAt, startedBy, startClock, lengthMinutes, moments, needs, practised, momentCount]
      properties:
        id:
          type: string
          format: uuid
        mode:
          $ref: "#/components/schemas/VirtualBabyMode"
        startedAt:
          type: string
          format: date-time
        startedBy:
          type: string
          format: uuid
        finishedAt:
          type: string
          format: date-time
        startClock:
          type: integer
          description: Simulated time of day the session starts at, in minutes after midnight (1080 = 18:00).
        lengthMinutes:
          type: integer
          description: Simulated length (360 for an evening, 2880 for the challenge).
        momentCount:
          type: integer
          description: How many moments the session has in all.
        moments:
          type: array
          description: Handled moments, oldest first.
          items:
            $ref: "#/components/schemas/VirtualBabyMoment"
        next:
          $ref: "#/components/schemas/VirtualBabyPrompt"
        needs:
          type: array
          items:
            $ref: "#/components/schemas/VirtualBabyNeedClock"
        practised:
          type: array
          items:
            $ref: "#/components/schemas/VirtualBabyPractised"

    VirtualBabySticker:
      type: object
      required: [id, title, earnedAt, earnedBy]
      properties:
        id:
          type: string
          enum: [feeding_cues, fresh_diaper, back_to_sleep, calm_and_steady, tag_team, night_owl, forty_eight]
        title:
          type: string
        earnedAt:
          type: string
          format: date-time
        earnedBy:
          type: array
          description: The parents whose moments earned it.
          items:
            type: string
            format: uuid

    VirtualBaby:
      type: object
      required: [items, stickers]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VirtualBabySession"
        stickers:
          type: array
          description: Earned stickers, in the order they were earned.
          items:
            $ref: "#/components/schemas/VirtualBabySticker"

    VirtualBabyMomentResult:
      type: object
      required: [moment, session]
      properties:
        moment:
          $ref: "#/components/schemas/VirtualBabyMoment"
        session:
          $ref: "#/components/schemas/VirtualBabySession"

    RecoveryBleeding:
      type: string
      enum: [none, spotting, light, moderate, heavy]

    RecoveryWound:
      type: string
      description: How a perineal tear, stitches or a cesarean scar feels. not_applicable when there is none.
      enum: [not_applicable, healing_well, sore, red_or_leaking]

    RecoveryBreasts:
      type: string
      enum: [comfortable, full, sore, not_applicable]

    RecoveryPelvicFloor:
      type: string
      enum: [fine, leaking, heaviness, painful]

    RecoveryWarningSign:
      type: string
      description: Each is on CDC's urgent maternal warning sign list.
      enum: [heavy_bleeding, fever, severe_headache, chest_pain, trouble_breathing, leg_swelling_pain, self_harm_thoughts]

    RecoveryShareChoice:
      type: string
      description: Who may read a recovery check-in. Never wider than the partner.
      enum: [private, partner]

    RecoveryCheckinInput:
      type: object
      required: [visibility, bleeding, pain, wound, breasts, pelvicFloor, sleepHours]
      properties:
        visibility:
          $ref: "#/components/schemas/RecoveryShareChoice"
        bleeding:
          $ref: "#/components/schemas/RecoveryBleeding"
        pain:
          type: integer
          minimum: 0
          maximum: 10
        wound:
          $ref: "#/components/schemas/RecoveryWound"
        breasts:
          $ref: "#/components/schemas/RecoveryBreasts"
        pelvicFloor:
          $ref: "#/components/schemas/RecoveryPelvicFloor"
        sleepHours:
          type: number
          format: float
          minimum: 0
          maximum: 24
        mood:
          type: integer
          minimum: 1
          maximum: 5
          description: Same 1 to 5 scale as mood check-ins. Optional.
        warningSigns:
          type: array
          maxItems: 7
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RecoveryWarningSign"
        note:
          type: string
          maxLength: 1000

    RecoveryCheckinUpdate:
      type: object
      required: [visibility]
      properties:
        visibility:
          $ref: "#/components/schemas/RecoveryShareChoice"

    RecoveryCheckin:
      type: object
      required: [id, authorId, recordedAt, visibility, bleeding, pain, wound, breasts, pelvicFloor, sleepHours, warningSigns, urgent]
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        recordedAt:
          type: string
          format: date-time
        visibility:
          $ref: "#/components/schemas/Visibility"
        bleeding:
          $ref: "#/components/schemas/RecoveryBleeding"
        pain:
          type: integer
        wound:
          $ref: "#/components/schemas/RecoveryWound"
        breasts:
          $ref: "#/components/schemas/RecoveryBreasts"
        pelvicFloor:
          $ref: "#/components/schemas/RecoveryPelvicFloor"
        sleepHours:
          type: number
          format: float
        mood:
          type: integer
        warningSigns:
          type: array
          items:
            $ref: "#/components/schemas/RecoveryWarningSign"
        note:
          type: string
        urgent:
          type: boolean
          description: True when a warning sign is ticked or bleeding is heavy. The UI then links to the fixed Urgent help screen.

    RecoveryCheckinList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/RecoveryCheckin"

    RecoveryGuidance:
      type: object
      required: [phase, headline, points, daysSinceBirth, postnatalCheck, sources]
      properties:
        phase:
          type: string
          enum: [first_weeks, settling_in, checkup_window, later]
        headline:
          type: string
        points:
          type: array
          items:
            type: string
        daysSinceBirth:
          type: integer
        postnatalCheck:
          type: object
          description: The 6 to 8 week check (NHS) and the 12-week outer limit (ACOG).
          required: [opensOn, closesOn, latestOn, status]
          properties:
            opensOn:
              type: string
              format: date
            closesOn:
              type: string
              format: date
            latestOn:
              type: string
              format: date
            status:
              type: string
              enum: [upcoming, open, overdue]
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"

    MemberPreferences:
      type: object
      required: [essentialsOnly]
      properties:
        essentialsOnly:
          type: boolean

    SupplyCategory:
      type: string
      enum: [diapers, wipes, formula, medicine, clothing, other]

    SupplyStatus:
      type: string
      description: empty = none left; running_low = at or under the item's lowAt, or about 3 days or fewer left by the estimate.
      enum: [stocked, running_low, empty]

    SupplyItemInput:
      type: object
      required: [name, category, quantity]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        category:
          $ref: "#/components/schemas/SupplyCategory"
        quantity:
          type: integer
          minimum: 0
          maximum: 100000
        unit:
          type: string
          maxLength: 20
          description: Defaults to pcs.
        lowAt:
          type: integer
          minimum: 0
          maximum: 100000
        perUse:
          type: integer
          minimum: 1
          maximum: 20
          description: Units one logged event uses (1 diaper per change, say 3 wipes). Defaults to 1.
        size:
          type: string
          maxLength: 20
        expiresOn:
          type: string
          format: date

    SupplyItemUpdate:
      allOf:
        - $ref: "#/components/schemas/SupplyItemInput"

    SupplyItem:
      type: object
      required: [id, name, category, quantity, unit, lowAt, perUse, status, onShoppingList]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          $ref: "#/components/schemas/SupplyCategory"
        quantity:
          type: integer
        unit:
          type: string
        lowAt:
          type: integer
        perUse:
          type: integer
        size:
          type: string
        expiresOn:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/SupplyStatus"
        daysLeft:
          type: integer
          description: Estimate in whole days from the care log of the last 7 days. Absent when it cannot be estimated.
        usagePerDay:
          type: number
          format: float
          description: Estimated units used per day. Absent with daysLeft.
        onShoppingList:
          type: boolean

    ShoppingItemInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        supplyItemId:
          type: string
          format: uuid
        restockQuantity:
          type: integer
          minimum: 1
          maximum: 100000

    ShoppingItemUpdate:
      type: object
      required: [done]
      properties:
        done:
          type: boolean

    ShoppingItem:
      type: object
      required: [id, name, done, addedById]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        supplyItemId:
          type: string
          format: uuid
        restockQuantity:
          type: integer
        done:
          type: boolean
        addedById:
          type: string
          format: uuid
        doneById:
          type: string
          format: uuid
        doneAt:
          type: string
          format: date-time

    SizeSuggestion:
      type: object
      required: [childId, childName, ageMonths, clothing, diaper, basis, note]
      properties:
        childId:
          type: string
          format: uuid
        childName:
          type: string
        ageMonths:
          type: integer
        weightKg:
          type: number
          format: float
          description: The latest growth measurement in kilograms, when there is one.
        weightLb:
          type: number
          format: float
          description: The same weight in pounds. Show this first.
        clothing:
          type: string
          description: For example "3-6 months".
        diaper:
          type: string
          description: For example "Size 2".
        basis:
          type: string
          enum: [age, weight]
        note:
          type: string
          description: Always says the sizes are approximate and brands differ.

    Supplies:
      type: object
      required: [items, shopping]
      properties:
        items:
          type: array
          description: Out and low items first, then the rest by when they were added.
          items:
            $ref: "#/components/schemas/SupplyItem"
        shopping:
          type: array
          description: Open rows first, then rows ticked in the last 3 days.
          items:
            $ref: "#/components/schemas/ShoppingItem"
        sizes:
          $ref: "#/components/schemas/SizeSuggestion"
