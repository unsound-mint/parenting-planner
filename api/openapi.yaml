  /members/{memberId}/invitations:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    post:
      operationId: createInvitation
      tags: [invitations]
      summary: A parent invites a grandparent or nanny and gets a one-time link
      description: |
        Mother or partner only; a grandparent or nanny gets 403. Nothing is
        emailed: the response carries the link to share. The token is
        random, single use and expires after 7 days; only its sha256 is
        stored, so the link is returned here once and never again.
        permissions are the toggles from the invite screen; only the
        listed CaregiverPermission values exist, so a parent's diary, mood
        check-ins, labs, session notes and appointment questions can never
        be granted. Sends a live update of kind invitation to parents.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvitation"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listInvitations
      tags: [invitations]
      summary: The family's invitations, newest first
      description: |
        Mother or partner only; a grandparent or nanny gets 403. Every
        invitation of the family with its current status (expired is
        computed from expiresAt). Links are not included; see
        createInvitation.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
