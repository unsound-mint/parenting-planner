        code:
          $ref: "#/components/schemas/FriendCode"
        families:
          type: array
          items:
            $ref: "#/components/schemas/FriendFamily"
        updates:
          type: array
          items:
            $ref: "#/components/schemas/FriendUpdate"

    FriendCode:
      type: object
      required: [code, expiresAt]
      properties:
        code:
          type: string
          example: KQ7M-3XPA
        expiresAt:
          type: string
          format: date-time

    FriendCodeInput:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 8
          maxLength: 12
          description: Case and the dash do not matter.

    FriendFamily:
      type: object
      required: [connectionId, names, status, since]
      properties:
        connectionId:
          type: string
          format: uuid
        names:
          type: array
          description: The other family's parents' first names. Never caregivers.
          items:
            type: string
        status:
          type: string
          description: connected, incoming (they asked, this family may accept) or outgoing (this family asked).
          enum: [connected, incoming, outgoing]
        since:
          type: string
          format: date-time

    FriendUpdateKind:
      type: string
      description: moment = a milestone or a small moment; week = this week's card; note = a few words.
      enum: [moment, week, note]

    FriendUpdateInput:
      type: object
      required: [kind, body]
      properties:
        kind:
          $ref: "#/components/schemas/FriendUpdateKind"
        body:
          type: string
          minLength: 1
          maxLength: 280

    FriendReactionKind:
      type: string
      enum: [heart, hug, got_this]

    FriendReactionInput:
      type: object
      required: [reaction]
      properties:
        reaction:
          $ref: "#/components/schemas/FriendReactionKind"

    FriendReaction:
      type: object
      required: [name, reaction]
      properties:
        name:
          type: string
        reaction:
          $ref: "#/components/schemas/FriendReactionKind"

    FriendUpdate:
      type: object
      required: [id, mine, connectionId, familyNames, authorName, authoredByMe, kind, body, createdAt, reactions]
      properties:
        id:
          type: string
          format: uuid
        mine:
          type: boolean
          description: From the viewer's own family.
        connectionId:
          type: string
          format: uuid
          description: The friend connection it came through; nil uuid for the family's own.
        familyNames:
          type: array
          items:
            type: string
        authorName:
          type: string
        authoredByMe:
          type: boolean
          description: The acting parent wrote it, so they may remove it.
        kind:
          $ref: "#/components/schemas/FriendUpdateKind"
        headline:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        reactions:
          type: array
          description: On the family's own update, everyone's; on a friend's update, only this family's.
          items:
            $ref: "#/components/schemas/FriendReaction"
        myReaction:
          $ref: "#/components/schemas/FriendReactionKind"
    LibraryEvidence:
      type: string
      description: |
        How strong the evidence is. guideline = an official body recommends
        it; research = studies, no formal guideline; contested = experts
        disagree; theory = a historical framework (Freud, Vygotsky, Piaget),
        not medical advice; folk = a popular belief, with what evidence shows.
      enum: [guideline, research, contested, theory, folk]

    LibraryTopicSummary:
      type: object
      required: [id, title, questions, category, evidence, ages, now, soon, urgent]
      properties:
        id:
          type: string
        title:
          type: string
        questions:
          type: array
          description: How parents ask it, the most common first. Search matches these.
          items:
            type: string
        category:
          type: string
          description: health, safety, decisions, development, learning, feeding, emotions, behavior, family, sleep, admin, teeth, parent-wellbeing or social.
        evidence:
          $ref: "#/components/schemas/LibraryEvidence"
        ages:
          type: string
          description: The age span as a parent reads it, for example "Weeks 24 to 28" or "1 to 3 years".
          example: 1 to 3 years
        now:
          type: boolean
          description: The span covers the family's position.
        soon:
          type: boolean
          description: The span starts within the next three months.
        urgent:
          type: boolean
          description: The topic has urgent signs; the UI links the fixed Urgent help screen.

    LibraryTopicList:
      type: object
      required: [position, items]
      properties:
        position:
          type: string
          description: Where the family is, for example "Week 25 of pregnancy" or "4 years old".
        items:
          type: array
          items:
            $ref: "#/components/schemas/LibraryTopicSummary"

    LibraryStep:
      type: object
      required: [when, action]
      properties:
        when:
          type: string
        action:
          type: string

    LibraryTopic:
      allOf:
        - $ref: "#/components/schemas/LibraryTopicSummary"
        - type: object
          required: [whatToKnow, whatToDo, evidenceNote, sources, related]
          properties:
            whatToKnow:
              type: string
            whatToDo:
              type: array
              items:
                $ref: "#/components/schemas/LibraryStep"
            askClinicianIf:
              type: string
              description: When to ask the family's own clinician. Never a diagnosis.
            evidenceNote:
              type: string
            sources:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/Source"
            related:
              type: array
              items:
                $ref: "#/components/schemas/LibraryTopicSummary"

    GuideList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Most relevant first.
          items:
            $ref: "#/components/schemas/Guide"

    BabySize:
      type: object
      description: |
        Baby size for one week, with the sources for the length, the weight and
        the week's `development` text. Not a diagnosis; babies vary.
      required: [comparison, lengthCm, lengthMeasure, sources]
      properties:
        comparison:
          type: string
          description: A friendly size picture, not a measurement.
          example: a pineapple
        lengthCm:
          type: number
        lengthMeasure:
          type: string
          description: |
            How lengthCm is measured. It changes at week 20, so do not chart the jump as growth.
            embryo = length of the embryo (weeks 4 to 6, the source does not say how),
            crown-rump = head to bottom, crown-heel = head to heel.
          enum: [embryo, crown-rump, crown-heel]
        weightG:
          type: number
          description: Median estimated fetal weight. Absent before week 14, where no source gives one.
        weightRangeG:
          type: array
          description: 10th and 90th percentile of the weight, in grams. Present with weightG.
          minItems: 2
          maxItems: 2
          items:
            type: number
        sources:
          type: array
          description: |
            Sources for the size and for the week's `development` text:
            the NHS week page, plus the WHO fetal growth charts when weightG is present.
          items:
            $ref: "#/components/schemas/Source"

    PregnancyWeek:
      type: object
      required: [week, isCurrentWeek, whyItMatters, tasks, questions, birthPrep, source]
      properties:
        week:
          type: integer
        isCurrentWeek:
          type: boolean
        size:
          # Optional: present only when the catalog has a sourced size for this week.
          $ref: "#/components/schemas/BabySize"
        development:
          type: string
          description: What is developing this week, in plain words. Cited by the sources in size.sources.
        whyItMatters:
          type: string
          description: Why this week matters for the parents, never a diagnosis.
        tasks:
          type: array
          description: For the acting person's role.
          items:
            type: string
        questions:
          type: array
          description: Suggested questions; the UI can add one with createAppointmentQuestion.
          items:
            type: string
        birthPrep:
          type: array
          description: Birth prep modules for this week (from week 28), locked until the family reaches week 32.
          items:
            $ref: "#/components/schemas/Guide"
        source:
          $ref: "#/components/schemas/Source"

    PregnancyGrowth:
      type: object
      required: [currentWeek, weeks]
      properties:
        currentWeek:
          type: integer
          minimum: 4
          maximum: 40
          description: The family's week today, clamped to 4 to 40.
        weeks:
          type: array
          description: Weeks 4 to 40 in order.
          items:
            $ref: "#/components/schemas/PregnancyGrowthWeek"

    PregnancyGrowthWeek:
      type: object
      required: [week, size, hotspots]
      properties:
        week:
          type: integer
        size:
          $ref: "#/components/schemas/BabySize"
        hotspots:
          type: array
          description: What develops this week, at least one.
          items:
            $ref: "#/components/schemas/GrowthHotspot"

    GrowthHotspot:
      type: object
      required: [area, text, sources]
      properties:
        area:
          type: string
          description: |
            Where the hotspot sits on the baby. body is the whole baby (growth,
            proportions), cord is the umbilical cord and placenta, movement is
            kicks and wriggles.
          enum: [brain, face, eyes, ears, mouth, heart, lungs, tummy, kidneys, hands, legs, skin, bones, movement, body, cord]
        text:
          type: string
          description: One short sentence in plain words, never a diagnosis.
        sources:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Source"

    PregnancyWeekSummary:
      type: object
      required: [week, sizeComparison, headline]
      properties:
        week:
          type: integer
        sizeComparison:
          type: string
          example: a pineapple
        headline:
          type: string
          description: The first sentence of whyItMatters.

    Today:
      type: object
      required: [memberId, role, date, stage, planItems, tasks, events, pendingHandoffs, guides]
      properties:
        memberId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/PersonRole"
        date:
          type: string
          format: date
        stage:
          $ref: "#/components/schemas/Stage"
        pregnancyWeek:
          $ref: "#/components/schemas/PregnancyWeekSummary"
        planItems:
          type: array
          description: Up to 3 overdue or due plan items. Parents only; empty for caregivers.
          items:
            $ref: "#/components/schemas/PlanItem"
        tasks:
          type: array
          description: The person's tasks due within 7 days or overdue, then tasks offered to them.
          items:
            $ref: "#/components/schemas/Task"
        events:
          type: array
          description: Today and tomorrow, as listCalendarEvents scope mine (parents also get family events).
          items:
            $ref: "#/components/schemas/CalendarEvent"
        nextShift:
          $ref: "#/components/schemas/CalendarEvent"
        careSummary:
          $ref: "#/components/schemas/CareSummary"
        pendingHandoffs:
          type: array
          description: Handoffs to the acting person not accepted yet.
          items:
            $ref: "#/components/schemas/Handoff"
        guides:
          type: array
          description: Up to 2 guides from listGuides.
          items:
            $ref: "#/components/schemas/Guide"


    TaskKind:
      type: string
      description: |
        task = the shared plan; paperwork = the seeded US paperwork
        checklist; hospital_bag = an item on one of the three bag lists.
      enum: [task, paperwork, hospital_bag]

    TaskInputKind:
      type: string
      description: Paperwork is seeded, never created by hand.
      enum: [task, hospital_bag]

    HospitalBag:
      type: string
      description: Which of the three hospital bag lists an item is on.
      enum: [mother, partner, baby]

    TaskDueAnchor:
      type: string
      description: What a computed deadline counts from.
      enum: [due_date, birth_date]

    TaskInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        dueOn:
          type: string
          format: date
        kind:
          $ref: "#/components/schemas/TaskInputKind"
        bag:
          $ref: "#/components/schemas/HospitalBag"
        detail:
          type: string
          maxLength: 500

    TaskUpdate:
      type: object
      required: [done]
      properties:
        done:
          type: boolean

    TaskReassignmentInput:
      type: object
      required: [toMemberId]
      properties:
        toMemberId:
          type: string
          format: uuid
          description: The parent the task is offered to. Must be in the family and not the acting parent. May also be a caregiver with family_plan.

    Task:
      type: object
      required: [id, title, assigneeId, kind, done]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        dueOn:
          type: string
          format: date
        assigneeId:
          type: string
          format: uuid
          description: The parent who owns the task now.
        pendingAssigneeId:
          type: string
          format: uuid
          description: Set while the task is offered to the other parent and not yet accepted.
        kind:
          $ref: "#/components/schemas/TaskKind"
        bag:
          $ref: "#/components/schemas/HospitalBag"
        detail:
          type: string
          description: What to do and how, in plain words.
        done:
          type: boolean
        doneAt:
          type: string
          format: date-time
        doneById:
          type: string
          format: uuid
        dueAnchor:
          $ref: "#/components/schemas/TaskDueAnchor"
        dueOffsetDays:
          type: integer
          description: |
            With dueAnchor, dueOn = anchor date + this many days (negative
            = before). Absent when dueOn is a plain date or the anchor is
            not known yet (birth_date before birth: dueOn is then counted
            from the due date as an estimate).
        source:
          $ref: "#/components/schemas/Source"

    TaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Soonest due first, undated last.
          items:
            $ref: "#/components/schemas/Task"

    LoadMapAreaKey:
      type: string
      enum: [appointments, shopping, paperwork, hospital_bag, learning, planning, feeding, diapers, nights, care_shifts]

    LoadMapUnit:
      type: string
      description: What the counts of an area count. Hours are weekly shift hours.
      enum: [items, feeds, changes, entries, hours]

    LoadMapShare:
      type: object
      required: [memberId, count]
      properties:
        memberId:
          type: string
          format: uuid
        count:
          type: integer
          minimum: 0
        recentCount:
          type: integer
          minimum: 0
          description: Of count, how many fall in the last 7 days. Only on care log areas, so a screen can say who has picked up more this week.

    LoadMapArea:
      type: object
      required: [key, label, unit, owned, handoverTaskIds, offeredToMeTaskIds, offeredByMeTaskIds]
      properties:
        key:
          $ref: "#/components/schemas/LoadMapAreaKey"
        label:
          type: string
          example: Appointments
        unit:
          $ref: "#/components/schemas/LoadMapUnit"
        owned:
          type: array
          description: Who carries it now, one entry per person with a count above 0.
          items:
            $ref: "#/components/schemas/LoadMapShare"
        started:
          type: array
          description: Who created the items (the remembering). Only for task areas.
          items:
            $ref: "#/components/schemas/LoadMapShare"
        handoverTaskIds:
          type: array
          description: Open tasks of this area the acting parent owns that are not offered yet. Empty for care areas.
          items:
            type: string
            format: uuid
        offeredToMeTaskIds:
          type: array
          description: Tasks of this area offered to the acting parent and waiting for their answer.
          items:
            type: string
            format: uuid
        offeredByMeTaskIds:
          type: array
          description: Tasks of this area the acting parent has offered and nobody has answered yet.
          items:
            type: string
            format: uuid

    LoadMap:
      type: object
      required: [windowDays, areas]
      properties:
        windowDays:
          type: integer
          example: 14
        areas:
          type: array
          items:
            $ref: "#/components/schemas/LoadMapArea"

    ThanksBasis:
      type: string
      description: What a suggested thanks is built from.
      enum: [night_feeds, feeds, diaper_changes, bag_items, tasks_done, caregiver_care, caregiver_shift]

    ThanksSuggestion:
      type: object
      required: [key, toMemberId, basis, text]
      properties:
        key:
          type: string
          description: Stable id of the thing being thanked. Send it back as suggestionKey so it is thanked once.
          example: night_feeds:0b8f5c2e:2026-11-10
        toMemberId:
          type: string
          format: uuid
        basis:
          $ref: "#/components/schemas/ThanksBasis"
        count:
          type: integer
          minimum: 1
          description: How many things the text counts.
        on:
          type: string
          format: date
          description: The day the thing happened, when it is one day.
        text:
          type: string
          example: Thank you for the 3 night feeds on Tuesday.

    ThanksSuggestionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ThanksSuggestion"

    ThanksInput:
      type: object
      required: [toMemberId, body]
      properties:
        toMemberId:
          type: string
          format: uuid
          description: The other parent, or a grandparent or nanny of the family.
        body:
          type: string
          minLength: 1
          maxLength: 400
        suggestionKey:
          type: string
          maxLength: 120

    Thanks:
      type: object
      required: [id, fromMemberId, toMemberId, body, createdAt]
      properties:
        id:
          type: string
          format: uuid
        fromMemberId:
          type: string
          format: uuid
        toMemberId:
          type: string
          format: uuid
        body:
          type: string
        suggestionKey:
          type: string
        createdAt:
          type: string
          format: date-time

    ThanksList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/Thanks"

    CalendarScope:
      type: string
      description: Default family for parents; caregivers may only use mine.
      enum: [mine, partner, family]

    CalendarEventKind:
      type: string
      description: |
        appointment, class, reminder and other are stored events; shift is
        one occurrence of an active shift; task is a task due date;
        psychologist_session is the owner's own booking, always private.
      enum: [appointment, class, reminder, other, shift, task, psychologist_session]

    CalendarEventInputKind:
      type: string
      enum: [appointment, class, reminder, other]

    CalendarVisibility:
      type: string
      description: private = owner only; family = both parents, and attendees.
      enum: [private, family]

    CalendarEventInput:
      type: object
      required: [kind, title, startsAt, visibility]
      properties:
        kind:
          $ref: "#/components/schemas/CalendarEventInputKind"
        title:
          type: string
          minLength: 1
          maxLength: 120
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        allDay:
          type: boolean
        location:
          type: string
          maxLength: 200
        attendeeIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        visibility:
          $ref: "#/components/schemas/CalendarVisibility"
        neutralTitle:
          type: boolean
          description: |
            When true, calendar subscription links and exported .ics files show
            only the kind ("Appointment") with no location, never the title.
            Default false for class, reminder and other; the UI defaults it to
            true for appointments. In the app the owner still sees the title.

    CalendarEventUpdate:
      type: object
      description: Same fields as CalendarEventInput, all optional. kind cannot change.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        allDay:
          type: boolean
        location:
          type: string
          maxLength: 200
        attendeeIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        visibility:
          $ref: "#/components/schemas/CalendarVisibility"
        neutralTitle:
          type: boolean
          description: |
            When true, calendar subscription links and exported .ics files show
            only the kind ("Appointment") with no location, never the title.
            Default false for class, reminder and other; the UI defaults it to
            true for appointments. In the app the owner still sees the title.

    CalendarEvent:
      type: object
      required: [id, kind, title, startsAt, allDay, attendeeIds, visibility]
      properties:
        id:
          type: string
          description: |
            Stable per occurrence. A uuid for stored events and appointments;
            "<shiftId>:<date>" for a shift occurrence; the task id for a task.
        kind:
          $ref: "#/components/schemas/CalendarEventKind"
        title:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        allDay:
          type: boolean
        location:
          type: string
        ownerId:
          type: string
          format: uuid
          description: The person it belongs to (shift owner, task assignee). Absent for family-wide events.
        attendeeIds:
          type: array
          items:
            type: string
            format: uuid
        visibility:
          $ref: "#/components/schemas/CalendarVisibility"
        neutralTitle:
          type: boolean
          description: |
            When true, calendar subscription links and exported .ics files show
            only the kind ("Appointment") with no location, never the title.
            Default false for class, reminder and other; the UI defaults it to
            true for appointments. In the app the owner still sees the title.
        shiftId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid

    CalendarEventList:
      type: object
      required: [from, to, items]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        items:
          type: array
          description: Earliest first.
          items:
            $ref: "#/components/schemas/CalendarEvent"

    AppointmentQuestionInput:
      type: object
      required: [text, visibility]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 300
        appointmentId:
          type: string
          format: uuid
          description: Default the next upcoming appointment the acting parent may see.
        visibility:
          $ref: "#/components/schemas/Visibility"

    AppointmentQuestionUpdate:
      type: object
      required: [answered]
      properties:
        answered:
          type: boolean
        answer:
          type: string
          maxLength: 1000

    AppointmentQuestion:
      type: object
      required: [id, authorId, text, askedForAppointmentId, carriedOver, answered, visibility, createdAt]
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        text:
          type: string
        appointmentId:
          type: string
          format: uuid
          description: The appointment it is under now. Absent when unanswered and no later appointment exists yet.
        askedForAppointmentId:
          type: string
          format: uuid
          description: The appointment it was first added to.
        carriedOver:
          type: boolean
          description: True when appointmentId differs from askedForAppointmentId.
        answered:
          type: boolean
        answer:
          type: string
        answeredAt:
          type: string
          format: date-time
        visibility:
          $ref: "#/components/schemas/Visibility"
        createdAt:
          type: string
          format: date-time

    AppointmentQuestionList:
      type: object
      required: [appointments, items]
      properties:
        appointments:
          type: array
          description: Upcoming appointments that have questions, soonest first.
          items:
            $ref: "#/components/schemas/CalendarEvent"
        items:
          type: array
          description: Unanswered first, then by appointment, then oldest first.
          items:
            $ref: "#/components/schemas/AppointmentQuestion"


    Place:
      type: object
      required: [name, address]
      properties:
        name:
          type: string
          example: St. Anne's Birth Center
        address:
          type: string
        phone:
          type: string
        mapsUrl:
          type: string
          format: uri
          description: Opens the route in the maps app.
        travelMinutes:
          type: integer
          minimum: 0
          description: Usual drive time from the family's home, without traffic. The UI shows it as an estimate.

    BringItem:
      type: object
      required: [title, ready]
      properties:
        title:
          type: string
          example: Insurance card and photo ID
        detail:
          type: string
        ready:
          type: boolean
          description: True when the paperwork task behind it is done. Items with no task are false until the visit.
        taskId:
          type: string
          format: uuid
          description: The paperwork or plan task this item comes from.

    BirthContact:
      type: object
      required: [label, name, phone]
      properties:
        label:
          type: string
          description: Why to call, such as "Labour and delivery desk" or "Your OB".
        name:
          type: string
        phone:
          type: string
        memberId:
          type: string
          format: uuid
          description: Set when the contact is a family member (the partner, a grandparent).

    BirthPlan:
      type: object
      required: [hospital, contacts, documents]
      properties:
        hospital:
          $ref: "#/components/schemas/Place"
        contacts:
          type: array
          description: In the order to call them.
          items:
            $ref: "#/components/schemas/BirthContact"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/BringItem"
        preferencesNote:
          type: string
          description: The family's birth preferences to talk through with the care team. A note, not a plan the AI writes.

    AppointmentTravel:
      type: object
      required: [minutes, leaveBy]
      properties:
        minutes:
          type: integer
          minimum: 0
          description: Drive time plus a fixed ten minute buffer.
        leaveBy:
          type: string
          format: date-time
        mapsUrl:
          type: string
          format: uri

    AppointmentPrep:
      type: object
      required: [appointment, documents, questions]
      properties:
        appointment:
          $ref: "#/components/schemas/CalendarEvent"
        travel:
          $ref: "#/components/schemas/AppointmentTravel"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/BringItem"
        questions:
          type: array
          description: Unanswered first, then oldest first.
          items:
            $ref: "#/components/schemas/AppointmentQuestion"
        note:
          $ref: "#/components/schemas/AppointmentNote"

    AppointmentNoteInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 2000
          description: Empty deletes the note.

    AppointmentNote:
      type: object
      required: [text, updatedAt]
      description: A parent's private note after one visit. Never shared.
      properties:
        text:
          type: string
        updatedAt:
          type: string
          format: date-time

    SimulatorSkill:
      type: string
      enum: [feeding, soothing, safe_sleep, diapering, warning_signs, teamwork]

    SimulatorMode:
      type: string
      enum: [scenario, practice]

    SkillScore:
      type: object
      required: [skill, answered, correct, weak]
      properties:
        skill:
          $ref: "#/components/schemas/SimulatorSkill"
        answered:
          type: integer
        correct:
          type: integer
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: Percent correct. Absent before the first answer.
        weak:
          type: boolean
          description: True when score is below 70.

    ShiftSuggestion:
      type: object
      required: [title, days, startTime, endTime]
      description: The shift a scenario suggests committing to; post it to createShift as is or edited.
      properties:
        title:
          type: string
          example: Night feeds
        days:
          type: array
          items:
            $ref: "#/components/schemas/Weekday"
        startTime:
          type: string
          example: "22:00"
        endTime:
          type: string
          example: "02:00"

    SimulatorScenario:
      type: object
      required: [id, title, summary, skills, questionCount]
      properties:
        id:
          type: string
          example: first-night-home
        title:
          type: string
        summary:
          type: string
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SimulatorSkill"
        questionCount:
          type: integer
        suggestedShift:
          $ref: "#/components/schemas/ShiftSuggestion"

    SimulatorProgress:
      type: object
      required: [memberId, skills, weakSpots, scenarios, roundsCompleted]
      properties:
        memberId:
          type: string
          format: uuid
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillScore"
        weakSpots:
          type: array
          description: Skills with a score below 70, weakest first.
          items:
            $ref: "#/components/schemas/SimulatorSkill"
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/SimulatorScenario"
        roundsCompleted:
          type: integer

    SimulatorRoundInput:
      type: object
      required: [mode]
      properties:
        mode:
          $ref: "#/components/schemas/SimulatorMode"
        scenarioId:
          type: string
          maxLength: 80
          description: Required for mode scenario.

    SimulatorChoice:
      type: object
      required: [id, text]
      properties:
        id:
          type: string
        text:
          type: string

    SimulatorQuestion:
      type: object
      required: [id, skill, prompt, choices]
      properties:
        id:
          type: string
        skill:
          $ref: "#/components/schemas/SimulatorSkill"
        prompt:
          type: string
        choices:
          type: array
          items:
            $ref: "#/components/schemas/SimulatorChoice"
        answer:
          $ref: "#/components/schemas/SimulatorAnswerResult"

    SimulatorRoundResult:
      type: object
      required: [correct, total, skills, weakSpots]
      properties:
        correct:
          type: integer
        total:
          type: integer
        skills:
          type: array
          description: The person's overall scores after this round.
          items:
            $ref: "#/components/schemas/SkillScore"
        weakSpots:
          type: array
          items:
            $ref: "#/components/schemas/SimulatorSkill"
        suggestedShift:
          $ref: "#/components/schemas/ShiftSuggestion"

    SimulatorRound:
      type: object
      required: [id, mode, title, questions, completed, createdAt]
      properties:
        id:
          type: string
          format: uuid
        mode:
          $ref: "#/components/schemas/SimulatorMode"
        scenarioId:
          type: string
        title:
          type: string
        questions:
          type: array
          description: In the order to ask them. answer is set once answered.
          items:
            $ref: "#/components/schemas/SimulatorQuestion"
        completed:
          type: boolean
        result:
          $ref: "#/components/schemas/SimulatorRoundResult"
        createdAt:
          type: string
          format: date-time

    SimulatorAnswerInput:
      type: object
      required: [questionId, choiceId]
      properties:
        questionId:
          type: string
          maxLength: 80
        choiceId:
          type: string
          maxLength: 80

    SimulatorAnswerResult:
      type: object
      required: [questionId, choiceId, correct, correctChoiceId, explanation, skill]
      properties:
        questionId:
          type: string
        choiceId:
          type: string
        correct:
          type: boolean
        correctChoiceId:
          type: string
        explanation:
          type: string
          description: Why, in plain words. Never a diagnosis.
        skill:
          $ref: "#/components/schemas/SimulatorSkill"
        source:
          $ref: "#/components/schemas/Source"
        roundCompleted:
          type: boolean
          description: True when this was the last unanswered question; fetch the round for the result.

    LessonTiming:
      type: string
      description: |
        now = the lesson's best-read window covers this week (always now
        outside pregnancy); upcoming = before the window (locked until
        unlocksAtWeek, open after); past = the window is behind you.
      enum: [upcoming, now, past]

    LearningPathList:
      type: object
      required: [stage, items]
      properties:
        stage:
          $ref: "#/components/schemas/Stage"
        week:
          type: integer
          description: The family's completed gestational week on the demo clock. Absent outside pregnancy.
          example: 25
        items:
          type: array
          description: In catalog order. Empty when no path fits the stage.
          items:
            $ref: "#/components/schemas/LearningPath"

    LearningPath:
      type: object
      required: [id, title, why, lessons, progress]
      properties:
        id:
          type: string
          description: Stable slug from the content catalog.
          example: birth
        title:
          type: string
          example: Birth
        why:
          type: string
          description: One sentence on why the path matters.
        lessons:
          type: array
          description: In reading order.
          items:
            $ref: "#/components/schemas/Lesson"
        progress:
          type: array
          description: One row per parent (mother and partner), acting parent first.
          items:
            $ref: "#/components/schemas/PathProgress"

    PathProgress:
      type: object
      required: [memberId, started, finished]
      properties:
        memberId:
          type: string
          format: uuid
        started:
          type: integer
          description: Lessons started and not finished.
        finished:
          type: integer

    Lesson:
      type: object
      description: |
        A short read in a learning path. Field names follow Guide; a lesson is
        not a Guide because it belongs to a path and carries reading state
        and a quiz for each parent.
      required: [id, pathId, title, body, minutes, audience, locked, timing, source, extraSources, urgentHelpLink, reads, quiz]
      properties:
        id:
          type: string
          description: Stable slug from the content catalog.
          example: pain-relief
        pathId:
          type: string
          example: birth
        title:
          type: string
        body:
          type: array
          description: Paragraphs, plain text.
          items:
            type: string
        minutes:
          type: integer
          description: Reading time.
        weekFrom:
          type: integer
          description: First gestational week of the best-read window. Absent outside pregnancy.
          example: 28
        weekTo:
          type: integer
          example: 36
        audience:
          type: array
          description: Who it is written for. Both parents see every lesson; a partner-only lesson is labeled, not hidden.
          items:
            $ref: "#/components/schemas/GuideAudience"
        locked:
          type: boolean
          description: True before unlocksAtWeek. A locked lesson cannot be started.
        unlocksAtWeek:
          type: integer
          description: weekFrom minus four, at least 4. Absent outside pregnancy.
          example: 24
        timing:
          $ref: "#/components/schemas/LessonTiming"
        source:
          $ref: "#/components/schemas/Source"
        extraSources:
          type: array
          items:
            $ref: "#/components/schemas/Source"
        talkPrompt:
          type: string
          description: A question for the couple to talk about after reading.
        talkedAt:
          type: string
          format: date-time
          description: When either parent marked this lesson's talk prompt (prompt id `lesson:<lessonId>`) as talked about. Absent until then.
        urgentHelpLink:
          type: boolean
          description: True for warning-sign and hotline lessons; the UI links to the fixed Urgent help screen and never shows generated text there.
        reads:
          type: array
          description: Reading state of each parent who opened it, acting parent first.
          items:
            $ref: "#/components/schemas/LessonRead"
        quiz:
          type: array
          items:
            $ref: "#/components/schemas/QuizQuestion"

    LessonRead:
      type: object
      required: [memberId, lessonId, startedAt]
      properties:
        memberId:
          type: string
          format: uuid
        lessonId:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time

    LessonReadInput:
      type: object
      required: [finished]
      properties:
        finished:
          type: boolean

    QuizQuestion:
      type: object
      required: [id, lessonId, prompt, choices, answers]
      properties:
        id:
          type: string
          description: Stable, lessonId plus the position (pain-relief-q1).
          example: pain-relief-q1
        lessonId:
          type: string
        prompt:
          type: string
        choices:
          type: array
          description: Choice ids are a, b, c in the catalog's order.
          items:
            $ref: "#/components/schemas/SimulatorChoice"
        answers:
          type: array
          description: |
            One per parent who answered, acting parent first. The other
            parent's choiceId and correct are absent until the acting parent
            has answered too.
          items:
            $ref: "#/components/schemas/QuizAnswer"
        correctChoiceId:
          type: string
          description: Present once the acting parent has answered.
        explanation:
          type: string
          description: Why, in plain words, cited to the lesson's source. Present once the acting parent has answered.

    QuizAnswer:
      type: object
      required: [memberId, answeredAt]
      properties:
        memberId:
          type: string
          format: uuid
        choiceId:
          type: string
        correct:
          type: boolean
        answeredAt:
          type: string
          format: date-time

    QuizAnswerInput:
      type: object
      required: [questionId, choiceId]
      properties:
        questionId:
          type: string
          maxLength: 80
        choiceId:
          type: string
          maxLength: 8

    QuizResult:
      type: object
      required: [questionId, choiceId, correct, correctChoiceId, explanation, source]
      properties:
        questionId:
          type: string
        choiceId:
          type: string
        correct:
          type: boolean
        correctChoiceId:
          type: string
        explanation:
          type: string
        source:
          $ref: "#/components/schemas/Source"
        partnerAnswer:
          $ref: "#/components/schemas/QuizAnswer"

    NudgeDismissalInput:
      type: object
      required: [id]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 200

    SessionBriefStatus:
      type: string
      description: |
        draft = only the parent sees it; scheduled = frozen and sent at
        sendAt; sent = with the psychologist.
      enum: [draft, scheduled, sent]

    SessionBriefInput:
      type: object
      required: [status, includeMood, sharedEntryIds]
      properties:
        status:
          $ref: "#/components/schemas/SessionBriefStatus"
        includeMood:
          type: boolean
          description: Add the summary of the parent's own check-ins.
        sharedEntryIds:
          type: array
          maxItems: 30
          items:
            type: string
            format: uuid
        note:
          type: string
          maxLength: 1500
          description: A few words for the psychologist. Empty removes it.

    SessionBriefItem:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: The topic title.
        diaryEntryId:
          type: string
          format: uuid
        writtenAt:
          type: string
          format: date-time
          description: When the journal entry behind the topic was written.
        entryText:
          type: string
          description: The entry's text, only when the parent chose to send it.

    MoodDay:
      type: object
      required: [day, mood]
      properties:
        day:
          type: string
          format: date
          description: Eastern calendar day.
        mood:
          type: number
          description: The average of that day's check-ins, 1 to 5.

    MoodSummary:
      type: object
      required: [from, to, checkins, lowDays, days]
      description: |
        What the parent logged, described, never assessed: how many
        check-ins, on how many days mood was 2 or lower, average sleep.
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        checkins:
          type: integer
        lowDays:
          type: integer
        averageSleep:
          type: number
        days:
          type: array
          description: Oldest first, days with a check-in only.
          items:
            $ref: "#/components/schemas/MoodDay"

    SessionBrief:
      type: object
      required: [status, includeMood, sharedEntryIds, items]
      properties:
        status:
          $ref: "#/components/schemas/SessionBriefStatus"
        session:
          $ref: "#/components/schemas/PsychologistBooking"
        sendAt:
          type: string
          format: date-time
          description: When a scheduled brief goes out, the day before the session.
        sentAt:
          type: string
          format: date-time
        includeMood:
          type: boolean
        sharedEntryIds:
          type: array
          items:
            type: string
            format: uuid
        note:
          type: string
        items:
          type: array
          description: In agenda order. Frozen once scheduled or sent.
          items:
            $ref: "#/components/schemas/SessionBriefItem"
        mood:
          $ref: "#/components/schemas/MoodSummary"
        updatedAt:
          type: string
          format: date-time

    PartnerNudgeKind:
      type: string
      enum: [lesson_finished, quiz_answered, name_added]

    PartnerNudge:
      type: object
      required: [id, memberId, kind, at, text]
      properties:
        id:
          type: string
          description: Stable for the same activity; send it to createNudgeDismissal to close the nudge.
        memberId:
          type: string
          format: uuid
          description: The other parent, who did it.
        kind:
          $ref: "#/components/schemas/PartnerNudgeKind"
        at:
          type: string
          format: date-time
        lessonId:
          type: string
          description: For lesson_finished and quiz_answered.
        name:
          type: string
          description: For name_added.
        text:
          type: string
          description: Ready to show, relative to the demo clock.
          example: 'Jake finished "Pain relief: the options" yesterday. Ask him what surprised him.'

    TalkPrompt:
      type: object
      required: [id, text]
      properties:
        id:
          type: string
          description: A prompt pool id (p07) or lesson:<lessonId> for a lesson's talk prompt.
          example: p07
        text:
          type: string
        lessonId:
          type: string
          description: The lesson it comes from, when it is a lesson's prompt.
        talkedAt:
          type: string
          format: date-time
        talkedBy:
          type: string
          format: uuid
          description: The parent who marked it.

    LabChoice:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
          enum: [a, b, c, d]
        label:
          type: string

    LabAnswer:
      type: object
      required: [choiceId]
      properties:
        choiceId:
          type: string
          enum: [a, b, c, d, other]
        otherText:
          type: string
          description: What the parent wrote for "Something else".

    LabAnswerInput:
      type: object
      required: [cardId, choiceId]
      properties:
        cardId:
          type: string
          maxLength: 60
        choiceId:
          type: string
          enum: [a, b, c, d, other]
        otherText:
          type: string
          maxLength: 300

    LabReveal:
      type: object
      required: [theirs, agree, talkPrompt]
      description: Present only when both parents answered the card.
      properties:
        theirs:
          $ref: "#/components/schemas/LabAnswer"
        agree:
          type: boolean
          description: Both chose the same listed answer. "Something else" never counts as agreeing.
        talkPrompt:
          $ref: "#/components/schemas/TalkPrompt"

    LabCard:
      type: object
      required: [id, topic, situation, choices, partnerAnswered]
      properties:
        id:
          type: string
          example: night-split
        topic:
          type: string
          example: Night shifts
        situation:
          type: string
        choices:
          type: array
          items:
            $ref: "#/components/schemas/LabChoice"
        mine:
          $ref: "#/components/schemas/LabAnswer"
        partnerAnswered:
          type: boolean
          description: The other parent answered. Their choice stays hidden until the acting parent answers.
        reveal:
          $ref: "#/components/schemas/LabReveal"

    CoupleLab:
      type: object
      required: [cards]
      properties:
        cards:
          type: array
          description: In the order the screen offers them. No score or percentage is computed.
          items:
            $ref: "#/components/schemas/LabCard"

    LetterInput:
      type: object
      required: [occasion, opensOn, body, visibility]
      properties:
        occasion:
          type: string
          minLength: 1
          maxLength: 60
          example: 18th birthday
        opensOn:
          type: string
          format: date
        body:
          type: string
          minLength: 1
          maxLength: 8000
        visibility:
          type: string
          enum: [private, partner]
        childId:
          type: string
          format: uuid
          description: The child the letter is for; absent for a baby not born yet. Ignored by updateLetter.

    Letter:
      type: object
      required: [id, authorId, occasion, opensOn, visibility, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        childId:
          type: string
          format: uuid
        occasion:
          type: string
        opensOn:
          type: string
          format: date
        visibility:
          type: string
          enum: [private, partner]
        body:
          type: string
          description: Present only for the author and, when shared, the partner.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LetterList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Letter"

    Together:
      type: object
      required: [prompts, closedNudgeIds]
      properties:
        closedNudgeIds:
          type: array
          description: |
            Ids of nudges this parent closed in the last 30 days, for nudges
            the client builds itself (the quiz to compare answers uses
            the same id as the partner nudge for that quiz).
          items:
            type: string
        nudge:
          $ref: "#/components/schemas/PartnerNudge"
        prompts:
          type: array
          items:
            $ref: "#/components/schemas/TalkPrompt"

    CoupleTalkInput:
      type: object
      required: [promptId]
      properties:
        promptId:
          type: string
          maxLength: 80

    CoupleTalk:
      type: object
      required: [promptId, talkedBy, talkedAt]
      properties:
        promptId:
          type: string
        talkedBy:
          type: string
          format: uuid
        talkedAt:
          type: string
          format: date-time

    BabyNameInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40

    BabyName:
      type: object
      required: [id, name, addedBy, likedBy, bothLike, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: June
        addedBy:
          type: string
          format: uuid
        likedBy:
          type: array
          items:
            type: string
            format: uuid
        bothLike:
          type: boolean
          description: True when both parents like it.
        createdAt:
          type: string
          format: date-time

    BabyNameList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BabyName"

    Weekday:
      type: string
      enum: [mon, tue, wed, thu, fri, sat, sun]

    ShiftStatus:
      type: string
      description: |
        agreed = committed before "Baby is home", no occurrences yet;
        active = in the calendar from startsOn.
      enum: [agreed, active]

    ShiftInput:
      type: object
      required: [title, days, startTime, endTime]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
        days:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Weekday"
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Local time HH:MM.
          example: "22:00"
        endTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Local time HH:MM. Earlier than startTime means the next morning.
          example: "02:00"
        roundId:
          type: string
          format: uuid
          description: The simulator round this commitment came from.

    Shift:
      type: object
      required: [id, memberId, title, days, startTime, endTime, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
          description: Who is on duty during this shift.
        title:
          type: string
        days:
          type: array
          items:
            $ref: "#/components/schemas/Weekday"
        startTime:
          type: string
        endTime:
          type: string
        status:
          $ref: "#/components/schemas/ShiftStatus"
        startsOn:
          type: string
          format: date
          description: Set when active.
        roundId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    ShiftList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Shift"

    CareLogKind:
      type: string
      enum: [feed, sleep, diaper]

    FeedMethod:
      type: string
      description: |
        A breastfeed names its side (both = switched sides); its length is
        endedAt minus startedAt. A bottle names the milk; amountMl its amount.
      enum: [breast_left, breast_right, breast_both, bottle_breast_milk, bottle_formula]

    DiaperContent:
      type: string
      enum: [wet, dirty, both]

    CareLogEntryInput:
      type: object
      required: [kind, startedAt]
      properties:
        kind:
          $ref: "#/components/schemas/CareLogKind"
        childId:
          type: string
          format: uuid
          description: Default the family's only or youngest child.
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          description: For a feed or a sleep; absent while it is still going.
        feedMethod:
          $ref: "#/components/schemas/FeedMethod"
        amountMl:
          type: integer
          minimum: 0
          maximum: 400
        diaper:
          $ref: "#/components/schemas/DiaperContent"
        note:
          type: string
          maxLength: 300

    CareLogEntry:
      type: object
      required: [id, childId, authorId, kind, startedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        childId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/CareLogKind"
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        feedMethod:
          $ref: "#/components/schemas/FeedMethod"
        amountMl:
          type: integer
        diaper:
          $ref: "#/components/schemas/DiaperContent"
        note:
          type: string
        createdAt:
          type: string
          format: date-time

    OnDuty:
      type: object
      required: [memberId, since, via]
      description: Who has the baby now.
      properties:
        memberId:
          type: string
          format: uuid
        since:
          type: string
          format: date-time
        via:
          type: string
          description: handoff = the last accepted handoff; shift = the current shift occurrence, when no handoff came after its start.
          enum: [handoff, shift]

    CareSummary:
      type: object
      properties:
        lastFeed:
          $ref: "#/components/schemas/CareLogEntry"
        lastSleep:
          $ref: "#/components/schemas/CareLogEntry"
        lastDiaper:
          $ref: "#/components/schemas/CareLogEntry"
        onDuty:
          $ref: "#/components/schemas/OnDuty"

    CareLogList:
      type: object
      required: [items, latest]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/CareLogEntry"
        latest:
          $ref: "#/components/schemas/CareSummary"

    HandoffStatus:
      type: string
      enum: [pending, accepted]

    HandoffInput:
      type: object
      required: [toMemberId]
      properties:
        toMemberId:
          type: string
          format: uuid
        note:
          type: string
          maxLength: 500
          example: Fed at 14:10, 90 ml. Napping since 14:40. Diaper cream on the changing table.
        shiftId:
          type: string
          format: uuid
          description: The receiver's shift this handoff starts, when there is one.
        voiceNoteId:
          type: string
          format: uuid
          description: A voice note the acting person uploaded with createVoiceNote and has not attached yet.

    Handoff:
      type: object
