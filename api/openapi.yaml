openapi: 3.0.3
info:
  title: Parenting Planner API
  version: 0.1.0
  description: |
    Contract between web/ and api/. Both sides generate code from this file
    (`make gen`); never edit generated code by hand. Change this file first,
    in its own PR or together with both implementations.

    Auth: there is no login. POST /demo/sessions creates a demo family and
    sets an httpOnly session cookie that scopes every other call to that family.
servers:
  - url: /api
security:
  - session: []
tags:
  - name: demo
  - name: family
  - name: plan
  - name: wellbeing
  - name: care
paths:
  /healthz:
    get:
      operationId: healthz
      security: []
      responses:
        "200":
          description: The API and its database are up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /demo/sessions:
    post:
      operationId: createDemoSession
      tags: [demo]
      security: []
      summary: Start a demo with a fresh copy of a synthetic family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDemoSessionRequest"
      responses:
        "201":
          description: Family created; the session cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /family:
    get:
      operationId: getFamily
      tags: [family]
      summary: The family of the current session, with parents and children
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/plan:
    get:
      operationId: getMemberPlan
      tags: [plan]
      summary: This week's plan for one parent
      description: |
        Items come from the guideline rules engine, evaluated against the family
        data this parent is allowed to see. Each item says why it applies and
        cites its source.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/mood-checkins:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    post:
      operationId: createMoodCheckin
      tags: [wellbeing]
      summary: The acting parent records how they feel today
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoodCheckinInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoodCheckin"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listMoodCheckins
      tags: [wellbeing]
      summary: Check-ins from the last 30 days that the acting parent may see
      description: Their own check-ins plus the other parent's check-ins shared with them.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoodCheckinList"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/diary-entries:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    post:
      operationId: createDiaryEntry
      tags: [care]
      summary: The acting parent writes a diary entry and chooses who may see it
      description: |
        Diary entries are private to their author by default. The client sends
        visibility explicitly and the server never widens it.
        private = author only. partner = author and the other parent.
        care_team = the author's psychologist agenda: only agendaTopic is
        placed on the agenda, the full text is never shared. The other parent
        never sees a care_team entry or its topic. Family is not allowed here.
        agendaTopic is required when visibility is care_team and ignored otherwise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiaryEntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryEntry"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listDiaryEntries
      tags: [care]
      summary: The acting parent's diary entries from the last 90 days
      description: |
        Only entries written by the acting parent, newest first. Entries of the
        other parent are never returned here, whatever their visibility.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryEntryList"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/psychologist-agenda:
    get:
      operationId: getPsychologistAgenda
      tags: [care]
      summary: Topics for the acting parent's next psychologist session
      description: |
        Topics only, taken from the agendaTopic of the parent's own care_team
        diary entries. The full entry text is never part of the agenda. The
        agenda belongs to the acting parent: the other parent can neither read
        it nor see that a session is booked.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PsychologistAgenda"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/psychologist-slots:
    get:
      operationId: listPsychologistSlots
      tags: [care]
      summary: Open session times with the demo psychologist, next 14 days
      description: |
        Synthetic provider and slots; there is no real provider integration.
        Slots already booked by the acting parent are left out. Booking
        availability is not shared between parents.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PsychologistSlots"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/psychologist-bookings:
    post:
      operationId: createPsychologistBooking
      tags: [care]
      summary: The acting parent books one open slot
      description: |
        The booking is stored for the acting parent only and is private to them.
        Returns 409 slot_taken if the slot is gone.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PsychologistBookingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PsychologistBooking"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/session-notes:
    post:
      operationId: createSessionNote
      tags: [care]
      summary: The acting parent writes a short note after a session
      description: |
        Always private to the author; there is no visibility field and the
        server never widens it. The note feeds the author's next weekly plan.
        The booking must belong to the acting parent and must have started.
      parameters:
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionNoteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionNote"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    MemberId:
      name: memberId
      in: path
      required: true
      description: |
        The acting parent. There is no login, so the UI says which parent is
        using the app; the API checks that this parent belongs to the session's family.
      schema:
        type: string
        format: uuid

  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: pp_session


  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: not_found
        message:
          type: string

    DemoTemplate:
      type: string
      description: Which synthetic family to copy. Add a value here when its seed exists.
      enum: [pregnancy]

    CreateDemoSessionRequest:
      type: object
      required: [template]
      properties:
        template:
          $ref: "#/components/schemas/DemoTemplate"

    Stage:
      type: string
      description: Where the family is on the journey from planning to age 9.
      enum: [planning, trying, pregnancy, postpartum, infant, toddler, preschool, school_age]

    ParentRole:
      type: string
      enum: [mother, partner]

    Family:
      type: object
      required: [id, template, stage, parents, children]
      properties:
        id:
          type: string
          format: uuid
        template:
          $ref: "#/components/schemas/DemoTemplate"
        stage:
          $ref: "#/components/schemas/Stage"
        dueDate:
          type: string
          format: date
          description: Set during pregnancy.
        gestationalWeek:
          type: integer
          description: Completed weeks of pregnancy today, derived from dueDate.
        parents:
          type: array
          items:
            $ref: "#/components/schemas/Parent"
        children:
          type: array
          items:
            $ref: "#/components/schemas/Child"

    Parent:
      type: object
      required: [id, role, displayName]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ParentRole"
        displayName:
          type: string

    Child:
      type: object
      required: [id, name, birthDate, ageMonths]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        birthDate:
          type: string
          format: date
        ageMonths:
          type: integer

    Plan:
      type: object
      required: [memberId, generatedAt, items]
      properties:
        memberId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
        items:
          type: array
          description: Sorted by status (overdue, due, upcoming), then due date.
          items:
            $ref: "#/components/schemas/PlanItem"

    PlanItemStatus:
      type: string
      enum: [overdue, due, upcoming]

    PlanCategory:
      type: string
      enum: [screening, vaccine, visit, mental_health, logistics, couple, learning]

    PlanItem:
      type: object
      required: [ruleId, title, detail, status, category, reason, source]
      properties:
        ruleId:
          type: string
          example: glucose-screen
        title:
          type: string
        detail:
          type: string
          description: What to do, in plain language.
        status:
          $ref: "#/components/schemas/PlanItemStatus"
        category:
          $ref: "#/components/schemas/PlanCategory"
        dueBy:
          type: string
          format: date
        reason:
          type: string
          description: Why this applies to this parent now, based on their data.
        source:
          $ref: "#/components/schemas/Source"

    Source:
      type: object
      required: [title, url, checkedAt]
      properties:
        title:
          type: string
        url:
          type: string
        checkedAt:
          type: string
          format: date
          description: When someone last confirmed the guideline still says this.

    Visibility:
      type: string
      description: |
        Who besides the author may see a sensitive record.
        private = author only; partner = author and the other parent;
        care_team = author and their professionals, not the partner; family = both parents.
      enum: [private, partner, care_team, family]

    MoodCheckinInput:
      type: object
      required: [mood, energy, sleepHours, visibility]
      properties:
        mood:
          type: integer
          minimum: 1
          maximum: 5
          description: 1 = very low, 5 = very good.
        energy:
          type: integer
          minimum: 1
          maximum: 5
        sleepHours:
          type: number
          minimum: 0
          maximum: 24
          description: Hours slept in the last 24 hours.
        note:
          type: string
          maxLength: 500
        visibility:
          $ref: "#/components/schemas/Visibility"

    MoodCheckin:
      type: object
      required: [id, authorId, recordedAt, mood, energy, sleepHours, visibility]
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        recordedAt:
          type: string
          format: date-time
        mood:
          type: integer
        energy:
          type: integer
        sleepHours:
          type: number
        note:
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"

    MoodCheckinList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/MoodCheckin"

    DiaryEntryInput:
      type: object
      required: [body, visibility]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
        visibility:
          type: string
          description: private, partner, or care_team (puts agendaTopic on the psychologist agenda).
          enum: [private, partner, care_team]
        agendaTopic:
          type: string
          minLength: 1
          maxLength: 120
          description: A short topic to bring to the psychologist. Required when visibility is care_team.

    DiaryEntry:
      type: object
      required: [id, authorId, writtenAt, body, visibility]
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        writtenAt:
          type: string
          format: date-time
        body:
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"
        agendaTopic:
          type: string

    DiaryEntryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/DiaryEntry"

    AgendaTopic:
      type: object
      required: [id, text, addedAt]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          description: The topic the parent chose, never the entry text.
        addedAt:
          type: string
          format: date-time
        diaryEntryId:
          type: string
          format: uuid
          description: The entry it came from; only the author sees this agenda.

    Provider:
      type: object
      required: [id, name, credentials, focus]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        credentials:
          type: string
          example: PhD, licensed clinical psychologist
        focus:
          type: string
          example: Perinatal and postpartum mental health

    PsychologistBooking:
      type: object
      required: [id, provider, startsAt, durationMinutes, noteWritten]
      properties:
        id:
          type: string
          format: uuid
        provider:
          $ref: "#/components/schemas/Provider"
        startsAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        noteWritten:
          type: boolean
          description: True once the parent has written a session note for this booking.

    PsychologistAgenda:
      type: object
      required: [topics]
      properties:
        topics:
          type: array
          description: Oldest first, so the longest-waiting topic is on top.
          items:
            $ref: "#/components/schemas/AgendaTopic"
        nextSession:
          $ref: "#/components/schemas/PsychologistBooking"
        noteDue:
          allOf:
            - $ref: "#/components/schemas/PsychologistBooking"
          description: The latest session that has started and has no note yet.

    Slot:
      type: object
      required: [id, startsAt, durationMinutes]
      properties:
        id:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer

    PsychologistSlots:
      type: object
      required: [provider, items]
      properties:
        provider:
          $ref: "#/components/schemas/Provider"
        items:
          type: array
          description: Earliest first.
          items:
            $ref: "#/components/schemas/Slot"

    PsychologistBookingInput:
      type: object
      required: [slotId]
      properties:
        slotId:
          type: string
          format: uuid

    SessionNoteInput:
      type: object
      required: [bookingId, text]
      properties:
        bookingId:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 1000

    SessionNote:
      type: object
      required: [id, bookingId, writtenAt, text]
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        writtenAt:
          type: string
          format: date-time
        text:
          type: string
