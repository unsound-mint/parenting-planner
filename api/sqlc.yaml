version: "2"
sql:
  - engine: postgresql
    schema: internal/store/migrations
    queries: internal/store/queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_json_tags: false
        emit_empty_slices: true
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        output_files_suffix: .gen
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: NullUUID
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type:
              type: "*time.Time"
          - db_type: timestamptz
            go_type: time.Time
          - db_type: pg_catalog.numeric
            go_type: float64
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              type: "*float64"
          - db_type: pg_catalog.int2
            go_type: int16
          - db_type: text
            nullable: true
            go_type:
              type: "*string"
